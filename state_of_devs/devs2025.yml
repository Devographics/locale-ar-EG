locale: ar-EG
translations:
  - key: general.devs2025.survey_intro
    t: |

      عام 2025 وقت غريب لتكون مطورًا. فالذكاء الاصطناعي يغير طريقة عملنا، ونواجه موجات تسريح جماعي، وهناك تحول مستمر في المناخ السياسي في بعض أوساط مجتمع التكنولوجيا

      لذا، في حين أن السؤال عن إطار عمل جافا سكريبت المفضل لديك مرارًا وتكرارًا أمر جيد ومفيد، فقد رأينا أنه قد حان الوقت لتناول الأسئلة الأكبر للمساعدة في فهم اللحظة الحالية: من أنت؟ ماذا تفعل إلى جانب البرمجة؟ وماذا تؤمن به وتأمل؟

      أهلاً بكم في أول استطلاع رأي على الإطلاق حول حالة المطورين، حيث نسأل عن كل شيء ليس كودًا برمجيًا.


      وكالعادة، جميع الأسئلة اختيارية، فلا تتردد في تخطي أي سؤال لا تشعر بالارتياح للإجابة عنه. ونود أيضًا التنويه إلى أن مجموعة البيانات الناتجة ستتاح للعامة. ومع ذلك، نأمل أن تجد في هذا الاستطلاع فائدة، ونتطلع إلى التعرف عليك أكثر!

  - key: introduction.devs2025
    t: |

      «هذه الأسئلة شخصية جدًا»؛ «سيكون هذا مثيرًا للجدل أكثر من اللازم»؛ «الأفضل أن تلتزم باستطلاعات البرمجة».

      كانت هذه بعض الملاحظات الأولية التي تلقيتها عندما طرحت للمرة الأولى فكرة إجراء استطلاع للمطورين مخصص بالكامل لمشكلات العمل والصحة والهوايات وغيرها من الموضوعات غير المتعلقة بالشيفرة.

      ومع ذلك، أنا سعيد لأنني مضيت قدمًا. فمشاركة 8,717 شخصًا في هذا الاستطلاع تثبت أنه لامس اهتمام مجتمع المطورين، كما أن ارتفاع نسبة مشاركة النساء خصوصًا (مقارنةً بالاستطلاعات السابقة) يوضح وجود حاجة إلى استطلاع يركز على هذه القضايا الأقل نقاشًا.

      وأثناء تصفحك للبيانات، احرص أيضًا على الاطلاع على التعليقات الكثيرة (أيقونة <span class="icon-inline icon-inline-comment">تعليق</span>) التي تركها المشاركون أثناء إجابتهم عن الاستطلاع، وفيها يشاركون قصصهم الشخصية وأفكارهم بتفصيل أكبر.

      والآن، استمتع بنتائج أول استطلاع لحالة المطورين!

      *ملاحظة: نظرًا إلى حجم البيانات، ستُنشر النتائج على جزأين. استمتع بالجزء الأول في الوقت الحالي!*

      <span class="conclusion__byline">– Sacha Greif</span>

  - key: general.devs2025.css2025_banner
    t: |
      شارك في استطلاع حالة CSS واختبر معرفتك بـCSS! ←

  # FAQ

  - key: faq.how_long_will_survey_take_devs2025
    t: كم من الوقت سيستغرق إكمال هذا الاستطلاع؟
  - key: faq.how_long_will_survey_take_devs2025.description
    t: >
      يستغرق إكمال هذا الاستطلاع نحو 15 دقيقة. تذكّر أن جميع الأسئلة اختيارية.

  - key: faq.results_released_devs2025
    t: متى ستُنشر النتائج؟
  - key: faq.results_released_devs2025.description
    t: سيُجرى الاستطلاع من 15 أبريل إلى 15 مايو 2025، وستُنشر نتائجه بعد ذلك بوقت قصير.

  - key: faq.survey_design_devs2025
    t: كيف صُمم هذا الاستطلاع؟
  - key: faq.survey_design_devs2025.description
    t: >
      صُمم هذا الاستطلاع نتيجة [عملية تصميم مفتوحة](https://github.com/Devographics/surveys/issues/279) شارك فيها مجتمع تطوير الويب.

  ###########################################################################
  # Takeaways
  ###########################################################################

  # user_info

  - key: sections.user_info.description.devs2025
    t: شارك 8,717 مطورًا في أول استطلاع لحالة المطورين.

  - key: user_info.country.takeaway.devs2025
    t: |
      لا تزال الفجوة بين وسيط دخول المطورين في الولايات المتحدة ووسيطها في البلدان الأخرى كبيرة، ويرجع ذلك جزئيًا على الأقل إلى ارتفاع الرواتب وتكاليف المعيشة في وادي السيليكون.

  - key: user_info.gender.takeaway.devs2025
    t: |
      قد تبدو مشاركة النساء البالغة 15% منخفضة، لكنها أعلى بكثير من [استطلاعات أخرى](https://2024.stateofjs.com/en-US/demographics/#gender)، التي تدور نسب المشاركة فيها حول 6%.

      ورغم أن البيانات تكشف عن فجوة في الدخل بحسب النوع الاجتماعي، فإن الأمر يتطلب مزيدًا من البحث لتحديد ما إذا كانت ناجمة عن التمييز على أساس النوع الاجتماعي أم عن عوامل أخرى مرتبطة به.

  - key: user_info.race_ethnicity.takeaway.devs2025
    t: |
      يُظهر النظر إلى بيانات العِرق والإثنية أن المجموعات غير البيضاء تميل إلى أن تكون أصغر سنًا، وهو اتجاه متكرر يظهر أيضًا في [استطلاعات أخرى](https://2024.stateofjs.com/en-US/demographics/#race_ethnicity).

      وتسلط البيانات الضوء أيضًا على مدى اختلاف التوزيع حسب النوع الاجتماعي بين المجموعات العرقية المختلفة.

  - key: user_info.relationship_status.takeaway.devs2025
    t: |
      يجد معظم المشاركين شريكًا للحياة بحلول الثلاثينيات من العمر، رغم أن ذلك يبدو أصعب بكثير في بعض البلدان مقارنةً بغيرها.

      وعند المقارنة حسب النوع الاجتماعي، ترتفع نسبة العزوبية بين المشاركين غير الثنائيين بدرجة كبيرة مقارنةً بالرجال والنساء.

  - key: user_info.number_of_kids.takeaway.devs2025
    t: |
      لا يملك معظم المشاركين أطفالًا، أما من لديهم أطفال فيميلون إلى الإنجاب في سن متأخرة نسبيًا.

      كما كان متوسط عدد الأطفال لدى النساء والمشاركين غير الثنائيين أقل منه لدى الرجال.

  # career

  - key: sections.career.description.devs2025
    t: مسيرتك المهنية وخبراتك العملية حتى الآن.

  - key: career.years_of_experience.takeaway.devs2025
    t: |
      ترتبط زيادة الخبرة بارتفاع الراتب إلى حد معين؛ فبعد 15 عامًا من الخبرة، تصبح الزيادة محدودة نسبيًا.

  - key: career.higher_education_degree.takeaway.devs2025
    t: |
      ترتبط الشهادة الجامعية بدخل أعلى، ومن المثير للاهتمام أن مجالها لا يلزم أن يكون متعلقًا بالبرمجة.

  - key: career.how_many_jobs.takeaway.devs2025
    t: |
      عمل المشاركون لدى 4.2 أصحاب عمل في المتوسط. ورغم ارتباط العمل لدى عدد أكبر من أصحاب العمل بدخل أعلى، فإن هذا الارتباط يضعف عند ضبط سنوات الخبرة.

  - key: career.employment_status.takeaway.devs2025
    t: |
      رغم أن المستقلين والمتعاقدين المستقلين يكسبون أقل من الموظفين بدوام كامل، كان من المفاجئ أن تأسيس شركة أو العمل رائدَ أعمال لا يؤدي إلى زيادة كبيرة في الدخل.

      وكان موظفو الشركات أيضًا الفئة الأرجح أن تكون قد شهدت زيادة في دخلها خلال العام الماضي.

  - key: career.career_issues.takeaway.devs2025
    t: |
      من الواضح أن أبرز ثلاث مشكلات وردت هنا مترابطة: فسوء الإدارة يؤدي إلى اختلال التوازن بين العمل والحياة، ثم إلى الإنهاك الوظيفي.

      يبدو أن النوع الاجتماعي يؤثر في المشكلات المهنية؛ إذ تتعرض النساء والمشاركون غير الثنائيين لكل مشكلة بمعدل أعلى، ولا سيما **التمييز** (35%) و**مشكلات الصحة النفسية** (62%).

  - key: career.discrimination_issues.takeaway.devs2025
    t: |
      رغم أننا غالبًا ما نفكر في التمييز من منظور النوع الاجتماعي أو العِرق، فإن العامل الأكثر شيوعًا في الإبلاغ عنه هو العمر، وهو أمر يؤثر فينا جميعًا في نهاية المطاف.

      ويُظهر تفصيل أبرز خمسة أسباب للتمييز حسب الفئة العمرية أن التمييز على أساس العمر يصبح شائعًا بشكل خاص بعد سن الخمسين.

  - key: career.negative_impacts.takeaway.devs2025
    t: |
      بين جميع المشاركين، كانت أساليب التعامل غير التصادمية، مثل تجنب الزملاء أو تغيير السلوك أو حتى الاستقالة، أكثر استراتيجيات التكيف شيوعًا استجابةً لمشكلات العمل.

      وتُظهر البيانات بوضوح أثر النوع الاجتماعي أيضًا؛ إذ تتعرض النساء والمشاركون غير الثنائيين مجتمعين لكل أثر سلبي بمعدل أعلى من الرجال.

      أما العِرق والإثنية فلا يبدو أن لهما أثرًا واضحًا بالقدر نفسه. بل إن عدد المشاركين غير البيض الذين أفادوا باستقالتهم أو طلبهم العلاج النفسي بسبب مشكلات العمل كان أقل *قليلًا*؛ مع أن الأمر يتطلب مزيدًا من البحث لمعرفة ما إذا كان ذلك لأنهم لم يشعروا بالحاجة إلى ذلك، أم لأنهم شعروا بها لكن لم تسمح لهم ظروفهم بالتصرف بناءً عليها.

  - key: career.laid_off.takeaway.devs2025
    t: |
      رغم الحديث عن تراجع قطاع التقنية، لم يتعرض معظم المشاركين للتسريح من العمل قط.

      وعند ترتيب البلدان حسب أعلى معدلات التسريح، تتصدر الولايات المتحدة بفضل قوانين العمل التي تصب في مصلحة أصحاب العمل، بينما تأتي بلدان مثل فرنسا واليابان قرب أسفل القائمة.

  # workplace

  - key: sections.workplace.description.devs2025
    t: مكان عملك الحالي.

  - key: workplace.company_size.takeaway.devs2025
    t: |
      ليس من المستغرب أن تملك الشركات الأكبر موارد تتيح لها دفع رواتب أعلى. كما أن احتمال زيادة دخل المشاركين خلال العام الماضي كان أكبر بكثير إذا عملوا لدى شركة كبيرة.

  - key: workplace.job_title.takeaway.devs2025
    t: |
      كما ظهر في [استطلاعات أخرى](https://2024.stateofjs.com/en-US/demographics/#job_title)، يرتبط حمل المسمى الوظيفي «مهندس» بدخل أعلى مقارنةً بكونك «مجرد» مطور.

      وثمة نقطة أخرى جديرة بالملاحظة: تتمتع وظائف الواجهات الأمامية إجمالًا بتنوع أكبر من حيث النوع الاجتماعي مقارنةً بالوظائف الأخرى.

  - key: workplace.yearly_income.takeaway.devs2025
    t: |
      لا تزال الولايات المتحدة تقدم رواتب أعلى بكثير مقارنةً ببقية العالم.

  - key: workplace.income_evolution.takeaway.devs2025
    t: |
      رغم المخاوف من تراجع القطاع، لم تتجاوز نسبة المشاركين الذين أفادوا بانخفاض دخلهم خلال العام الماضي 9%.

      كان المشاركون المقيمون في النرويج وأيرلندا وجنوب أفريقيا الأرجح أن يكون دخلهم قد ارتفع.

  - key: workplace.job_finding_application_count.takeaway.devs2025
    t: |
      احتاج المشاركون إجمالًا إلى وسيط قدره 4 طلبات توظيف للعثور على وظائفهم الحالية، وانخفض هذا العدد كلما زادت سنوات خبرتهم.

      ومع ذلك، ظهر ارتفاع طفيف لدى أصحاب الخبرة الأطول، وقد يفسره التمييز على أساس العمر أو صعوبة البحث عن عمل بسبب تقادم المهارات.

  - key: workplace.job_finding_methods.takeaway.devs2025
    t: |
      يرتبط وجود صلة شخصية أوثق بالشركة عند التقدم إلى وظيفة (بدلًا من استخدام موقع وظائف أو وسائل التواصل الاجتماعي) بدخل أعلى.

      والاستثناء الوحيد هو التوظيف عبر العمل مفتوح المصدر، إذ يرتبط بمستويات دخل مماثلة لأساليب أكثر مباشرة مثل مسؤولي التوظيف أو التوصيات.

  - key: workplace.remote_work_policy.takeaway.devs2025
    t: |
      يرتبط غياب العمل عن بُعد بانخفاض كل من وسيط الدخل والرضا الوظيفي (المقاس على مقياس من 1 إلى 5).

  - key: workplace.work_hours_per_week.takeaway.devs2025
    t: |
      كلما زاد عملك زاد دخلك، إلى حد معين على الأقل. وتُعد الهند أكثر البلدان عملًا بوسيط يبلغ 45 ساعة عمل أسبوعيًا، بينما يتمحور معظم البلدان الأخرى حول 40 ساعة.

  - key: workplace.job_happiness.takeaway.devs2025
    t: |
      المطورون راضون عمومًا عن وظائفهم، بشرط أن يتمكنوا من تجاوز السنوات العشر الأولى.

  - key: workplace.workplace_perks.takeaway.devs2025
    t: |
      خلافًا للصورة النمطية للمهووس بالحاسوب والمنعزل اجتماعيًا، يتضح أن أكثر ما نقدّره هو بعضنا بعضًا؛ إذ جاءت العلاقات مع الزملاء في المرتبة الأولى ضمن الأمور التي يستمتع بها المطورون في أماكن عملهم.

  - key: workplace.workplace_difficulties.takeaway.devs2025
    t: |
      في نهاية المطاف، علينا جميعًا كسب قوتنا، ولذلك جاء ضعف الأجر في المرتبة الأولى بوصفه أبرز مشكلة يواجهها المطورون في مكان العمل اليوم.

  # technology

  - key: sections.technology.description.devs2025
    t: التطبيقات واللغات والمنصات التي تستخدمها.

  - key: technology.programming_languages.takeaway.devs2025
    t: |
      قد يكون من المغري تعلم Clojure أو Elm أو Ruby أو Scala نظرًا إلى الدخل الأعلى الذي يبدو أن هذه اللغات ترتبط به، لكن من المهم أيضًا الإقرار بأن مطوريها يميلون إلى امتلاك خبرة أكبر، وهو ما قد يفسر هذا الفرق.  على الرغم من أنه قد يكون من المغري تعلم Clojure أو Elm أو Ruby أو Scala نظرًا للدخل المرتفع الذي يبدو أن هذه اللغات تحمله، فمن المهم أيضًا الاعتراف بأن هذه اللغات تميل إلى أن يمارسها مطورون أكثر خبرة، وهو ما قد يفسر الفرق.

  - key: technology.productivity_apps.takeaway.devs2025
    t: |
     عندما يتعلق الأمر بتطبيقات الإنتاجية، يجدر الإشارة إلى الأداء الرائع لتطبيق **Obsidian**، حيث احتل المركز السادس بشكل عام على الرغم من أنه لم يكن حتى جزءًا من الخيارات المحددة مسبقًا في السؤال.

      تميل بعض الأدوات مثل **Azure DevOps** و **Jira** إلى الاستخدام في الشركات الكبيرة، بينما تحظى **Linear** و **Trello** بشعبية أكبر بين المؤسسات الصغيرة.


  - key: technology.chat_apps.takeaway.devs2025
    t: |
      أنا مندهش مثلك لاكتشاف أن **Google Chat** لا يزال مستخدمًا، ومع ذلك احتل المرتبة التاسعة بفضل الإجابات المكتوبة من المشاركين وحدها.

  - key: technology.social_media.takeaway.devs2025
    t: |
      يُظهر تمثيل استخدام تطبيقات التواصل الاجتماعي بحسب العمر أن مستخدمي Bluesky وMastodon ربما يحتاجون إلى التمدد كلما نهضوا من مقاعدهم، أو ربما يستمتعون بتذكر أيام الاتصال الهاتفي بالإنترنت وأشرطة الكاسيت.

      أما مستخدمو TikTok فيميلون إلى أن يكونوا أصغر سنًا، وهذا منطقي لأنك تحتاج إلى جسد أكثر نشاطًا حتى *تحاول* أداء بعض تلك الرقصات.

  - key: technology.community_involvement.takeaway.devs2025
    t: |
      ليس في ذلك ما يثير الدهشة؛ فالفيديو هو الوسيلة الأساسية التي يتابع بها المشاركون أخبار المجتمع. وللأسف، لا تزال الفعاليات الحضورية قليلة نسبيًا.

      ورغم أن موجزات RSS كانت إجابة مكتوبة شائعة، فإن وسيط أعمار هؤلاء المشاركين لا يبشر بمستقبل مزدهر لهذه التقنية.

      وعند النظر إلى الفروق حسب النوع الاجتماعي، نجد أن النساء والمشاركين غير الثنائيين أقل ميلًا بكثير إلى الاعتماد على محتوى الفيديو والمشاركة في المنصات العامة عبر الإنترنت، لكنهم أكثر ميلًا إلى المشاركة في غرف الدردشة واللقاءات الأصغر نطاقًا.

  - key: technology.community_contributions.takeaway.devs2025
    t: |
      عند مقارنة المشاركة المجتمعية بالنوع الاجتماعي، يبدو أن النساء والمشاركين غير الثنائيين أقل ميلًا إلى التفاعل في المساحات الإلكترونية، لكنهم أكثر ميلًا إلى حضور الفعاليات المباشرة؛ وقد يشير ذلك إلى إخفاقنا في بناء مجتمعات إلكترونية شاملة بما يكفي.

  - key: technology.open_source_involvement.takeaway.devs2025
    t: |
      رغم أن نحو نصف المشاركين ساهموا بشيفرات في مشروعات مفتوحة المصدر، يتضح أن هذه النسبة تخفي فجوة حقيقية بحسب النوع الاجتماعي: فقد ساهم **51%** من الرجال بشيفرات، مقابل **36%** فقط من المشاركين من غير الرجال.

  # health

  - key: sections.health.description.devs2025
    t: الصحة واللياقة البدنية.

  - key: health.age.takeaway.devs2025
    t: |
      تميل النساء والمشاركون غير الثنائيين إلى أن يكونوا أصغر سنًا قليلًا من الرجال عند مقارنة وسيط العمر حسب النوع الاجتماعي.

  - key: health.disability_status.takeaway.devs2025
    t: |
      يُظهر النظر إلى الإعاقات حسب العمر أن مشكلات الصحة النفسية وحالات التنوع العصبي هي الأكثر شيوعًا، بينما يزداد انتشار ضعف السمع بعد سن الستين.

      كما أن بعض الإعاقات، مثل ضعف البصر، أكثر شيوعًا بين الرجال، بينما ترتفع نسبة مشكلات الصحة النفسية والأمراض المزمنة بين النساء.

  - key: health.health_issues.takeaway.devs2025
    t: |
      كان سوء النوم أكثر المشكلات الصحية التي أبلغ عنها المشاركون، وربما يرتبط بالدور الكبير الذي تؤديه الشاشات بمختلف أنواعها في حياتنا.

      كما أثرت بعض المشكلات—مثل حالات الصحة النفسية والصداع النصفي—في النساء والمشاركين غير الثنائيين بمعدلات أعلى من عموم المشاركين، عند فحص أبرز ست مشكلات صحية حسب النوع الاجتماعي.

  - key: health.sleep_quantity.takeaway.devs2025
    t: |
      كما هو متوقع، يؤثر إنجاب الأطفال في متوسط مدة النوم، وإن لم يكن بالقدر الذي قد يتبادر إلى الذهن.

      ويؤدي العمر دورًا أيضًا، إذ يميل المشاركون الأكبر سنًا إلى النوم مدة أقل قليلًا.

  - key: health.sleep_measures.takeaway.devs2025
    t: |
      يجرب المشاركون مجموعة من الاستراتيجيات لتحسين نومهم (بما يتسق مع كون «سوء النوم» أكثر المشكلات الصحية التي أُبلغ عنها)، لكن لا يبدو أن هذه المحاولات تؤثر في وسيط مدة النوم ليلًا.

      ولأن زيادة مدة النوم مقياس يصعب تحسينه، فقد يكون التركيز على *جودة* النوم أكثر فاعلية، رغم أن قياسها بدقة أصعب بالطبع.

  # worldview

  - key: sections.worldview.description.devs2025
    t: النظرة إلى العالم والسياسة والأحداث الجارية.

  - key: worldview.global_issues.takeaway.devs2025
    t: |
      يُعد **تغير المناخ** مشكلة كبيرة على مستوى الكوكب، لكن المشاركين المقيمين في الولايات المتحدة سلطوا الضوء أيضًا على **تصاعد النزعة السلطوية**، بينما تشعر بولندا المجاورة لأوكرانيا بقلق مفهوم إزاء **التوترات الجيوسياسية**.

      ورغم أنك قد تفترض أن الأجيال الأصغر أكثر تقدمية، فمن اللافت أن ذلك لا ينطبق بالضرورة هنا، على الأقل فيما يتعلق ببعض القضايا الرئيسية.

      المشاركون دون العشرين هم الأرجح لاعتبار **غياب حرية التعبير** و**تآكل القيم التقليدية** مشكلتين رئيسيتين، والأقل احتمالًا لاعتبار **تصاعد التعصب** مشكلة؛ وهي مواقف تتماشى عمومًا مع التوجهات السياسية المحافظة الحديثة.

      كما تميل الفئات الأكبر سنًا إلى مزيد من القلق بشأن **تصاعد النزعة السلطوية**، إذ تضعه الفئات التي تتجاوز الأربعين في مقدمة مخاوفها عمومًا.

      وأخيرًا، ترتفع نسبة النساء بين المشاركين الذين ذكروا **إمكانية الحصول على الرعاية الصحية** ضمن أهم أولوياتهم، وهو ما يعكس مجددًا مخاوف سياسية مستمرة، لا سيما في الولايات المتحدة.

  - key: worldview.happiness_factors.takeaway.devs2025
    t: |
      قد تكون **الصحة الجيدة** أهم عوامل السعادة عالميًا، لكن الهند وروسيا تتميزان بتقديرهما الكبير أيضًا لـ**التقدم المهني**، وكذلك **الثروة والممتلكات المادية** في حالة روسيا.

      وعند النظر إلى العوامل الديموغرافية، وضع المشاركون غير الثنائيين **الهوايات** في المرتبة الأولى و**الأسرة** في مرتبة أدنى بكثير من الرجال والنساء. كما يُظهر تمثيل عوامل السعادة حسب العمر أن **الأسرة** غالبًا ما تحل محل **الصداقات** و**الهوايات** مع تقدم المشاركين في السن.

  - key: worldview.relocation.takeaway.devs2025
    t: |
      تتصدر **اليابان** الترتيب العام للوجهات التي يرغب المطورون في الانتقال إليها، رغم أن تفصيل النتائج حسب بلد المشاركين يكشف أنهم يميلون أيضًا إلى تفضيل الوجهات القريبة جغرافيًا أو البلدان التي تشاركهم اللغة.

  - key: worldview.overall_happiness.takeaway.devs2025
    t: |
      المشاركون سعداء نسبيًا عمومًا، لكن وسيط السعادة ينخفض عندما لا يحصلون على قسط كافٍ من النوم (أو عندما ينامون *أكثر من اللازم*).

      ورغم أن مقدار الدخل بحد ذاته لا يبدو مؤثرًا في السعادة، فإن *انخفاض* الدخل يؤثر فيها بالتأكيد، وكذلك عدم الارتباط بعلاقة.

    aliases:
      - happiness.overall_happiness.takeaway.devs2025

  # hobbies

  - key: sections.hobbies.description.devs2025
    t: الهوايات والاهتمامات.

  - key: hobbies.hobbies.takeaway.devs2025
    t: |
      ليس من المستغرب أن تتصدر **ألعاب الفيديو** الترتيب في استطلاع للمطورين، بل إن بعض المشاركين كتبوا **البرمجة** كهوايتهم المفضلة.

      كان المشاركون الأكبر سنًا أكثر ميلًا إلى اختيار **الأفلام/التلفزيون** بدلًا من ألعاب الفيديو، بينما تصدرت **القراءة** فعلًا لدى من تجاوزوا الستين.

      وتكشف البيانات أيضًا أن الهوايات لا تزال تختلف حسب النوع الاجتماعي: فالنساء أكثر ميلًا بكثير من الرجال إلى ذكر **الفنون والحرف اليدوية**، وأقل ميلًا إلى ذكر **ألعاب الفيديو**.

  - key: hobbies.physical_activity.takeaway.devs2025
    t: |
      يحظى **التنزه/المشي** و**تمارين القوة** بشعبية واسعة، لكن عند مقارنة النشاط البدني حسب النوع الاجتماعي، تبرز **اليوغا** بوصفها نشاطًا تميل النساء إلى ممارسته أكثر بكثير من الرجال.

  - key: hobbies.favorite_musical_artists.takeaway.devs2025
    t: |
      من كان يتوقع أن تظل **Linkin Park** متألقة في عام 2025؟

      يمنحنا تمثيل الفنانين حسب وسيط أعمار المشاركين فكرة عما نستمع إليه إذا أردنا الاندماج مع الشباب (**Charli XCX** و**Twenty One Pilots**)، وما ينبغي تجنبه بأي ثمن (**Pink Floyd**).

      وتوجد أيضًا فروق حسب النوع الاجتماعي؛ إذ تفضل النساء والمشاركون غير الثنائيين فنانين مثل **Chappell Roan** و**Taylor Swift**.

  - key: hobbies.favorite_movies.takeaway.devs2025
    t: |
      يتصدر **Dune** الترتيب هنا، تأكيدًا لمكانة الفيلم بوصفه تحفة سينمائية.

      وعند النظر إلى القوائم حسب النوع الاجتماعي، يتصدر **Wicked** قائمة النساء والمشاركين غير الثنائيين.

  - key: hobbies.favorite_tv.takeaway.devs2025
    t: |
      سيظل **Severance** علامة بارزة في السرد التلفزيوني، وقد لامست موضوعاته حول التوازن بين العمل والحياة والاغتراب في مكان العمل مشاعر المشاركين بوضوح.

      تحظى الرسوم المتحركة، ولا سيما الأعمال اليابانية مثل **Frieren** و**Solo Leveling**، بشعبية لدى المشاركين الأصغر سنًا، وكذلك المسلسلات الكوميدية الكلاسيكية الأقدم مثل **Friends** و**The Office**.

      وعند النظر حسب النوع الاجتماعي، تتشابه القوائم إلى حد كبير باستثناء المرتبة التاسعة، التي تضم عملين متباينين تمامًا هما **Reacher** و**The Handmaid's Tale**.

  - key: hobbies.favorite_video_games.takeaway.devs2025
    t: |
      تشتهر **Baldur's Gate 3** بكمية محتواها الهائلة، وينعكس ذلك في تصدرها هنا رغم صدورها عام 2023.

      ويتضح أيضًا أن **Stardew Valley** تحظى بشعبية كبيرة بين النساء والمشاركين غير الثنائيين؛ إذ جاءت في المرتبة الثانية رغم عدم دخولها قائمة أفضل 20 لعبة لدى الرجال.

  - key: hobbies.video_game_platforms.takeaway.devs2025
    t: |
      رغم أن استخدام macOS [أكثر انتشارًا](/en-US/technology/#desktop_os) بين المشاركين بوصفه نظام التشغيل الأساسي للحاسوب، لا تزال **Windows** المنصة المهيمنة في مجال الألعاب.

      الأجيال الأصغر هي الأرجح لممارسة الألعاب على الحاسوب، بينما يميل المشاركون الأكبر سنًا إلى تفضيل سهولة استخدام أجهزة الألعاب المنزلية.

  # metadata

  - key: _user.metadata.source.takeaway.devs2025
    t: |
      رغم أن غالبية المشاركين أتوا من جمهورنا الحالي وقائمتنا البريدية، فقد ساهمت أيضًا إشارة **Josh Comeau** إلى الاستطلاع في نشرته البريدية في زيادة المشاركة كثيرًا.

      وعند النظر إلى توزيع المشاركين حسب النوع الاجتماعي لكل مصدر، أثبتت [طريقة أخذ العينات التراكمية](https://github.com/Devographics/surveys/issues/258) فعاليتها في تشجيع مزيد من النساء على المشاركة، وكذلك رعاية صانعات محتوى مثل [Cassidy Williams](https://cassidoo.co/)، التي عرضت الاستطلاع في نشرتها الأسبوعية.
    aliases:
      - user.metadata.source.takeaway.devs2025

