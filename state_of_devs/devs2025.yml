  - key: conclusion.devs2025.sacha_greif.bio
    t: خبير مزج البيانات في Devographics

  - key: conclusion.devs2025.sacha_greif
    t: |
      إذا أخبرتكم أننا لم نستكشف إلا *نصف* البيانات التي جمعها هذا الاستطلاع بالكاد، فلعلكم ستفهمون سبب اضطراري إلى تقسيم هذا التقرير إلى جزأين.

      لا تزال هناك أقسام عن **الصحة** (كم ساعة ينام المطور في المتوسط؟)، و**الهوايات** (ما لعبة الفيديو الأكثر شعبية؟)، و**النظرة إلى العالم** (إلى أين ستنتقل لو أمكنك اختيار أي مكان؟).

      لكن لا تقلقوا، لن تضطروا إلى الانتظار طويلًا للاطلاع على الجزء الثاني من هذا التقرير. وإذا أردتم التأكد من عدم تفويته، فاتركوا بريدكم الإلكتروني أدناه وسنخبركم فور صدوره!

  - key: conclusion.devs2025.anjana_vakil.bio
    t: مهندسة مستقلة ومعلّمة ومستشارة علاقات المطورين

  - key: conclusion.devs2025.anjana_vakil
    t: |
      بصفتنا مطوري برمجيات، نميل إلى الاعتقاد بأن عملنا يدور حول البرمجة والأداء وطلبات السحب. لكن البرمجيات في نهاية المطاف تتمحور حقًا حول **الناس**، والناس معقدون.

      أفاد معظم المشاركين في الاستطلاع بسعادتهم في [حياتهم](../worldview/#overall_happiness) و[وظائفهم](../workplace/#job_happiness)، لكن الأمور ليست وردية تمامًا. فقد واجه معظمهم أيضًا مشكلات تتعلق بـ[الإنهاك الوظيفي](../career/#career_issues) أو التوازن بين العمل والحياة أو الصحة النفسية، وأشار كثيرون إلى ثقافات العمل السامة وسوء الإدارة بوصفهما سببين لذلك. كما شعر كثيرون بضغط داخلي وخارجي شديد للعمل بإفراط، وبأنهم لا يملكون السيطرة على ظروف عملهم.

      كما تعرض كثير من المطورين، وأنا منهم، لـ[التمييز](../career/#discrimination_issues) على أساس العمر أو النوع الاجتماعي أو التوجه الجنسي أو الإعاقة. وبوجه عام، ولا سيما لدى الفئات المهمشة، يبدو أن مشاعر القلق والعجز والعزلة تتزايد في مجتمعنا المهني.

      أحيانًا، وخصوصًا مؤخرًا، أتساءل: هل ثمة أمل؟ يبدو أن نتائج هذا الاستطلاع تؤكد درسًا تعلمته مرارًا خلال مسيرتي التي امتدت عقدًا في مجال التقنية: لا سبيل لنا إلى مواجهة هذه المشكلات الكثيرة جماعيًا وبناء قطاع برمجيات أفضل إلا بأن نكون **معًا**.

      في الواقع الاقتصادي الحالي، يشعر كثير من المطورين (والعاملين عمومًا) بأن أصحاب العمل يرونهم «موارد» يمكن استغلالها والاستغناء عنها، بدلًا من اعتبارهم زملاء ذوي قيمة بحد ذاتهم. ويمثل **العمل الجماعي** وسيلتنا نحن العاملين لمواجهة اختلال توازن القوى هذا. سواء عبر آليات رسمية مثل النقابات والدعاوى الجماعية، أو غير رسمية مثل مناقشة الرواتب والتعبير عن آرائنا على وسائل التواصل الاجتماعي أو المشاركة في هذا الاستطلاع نفسه، علينا أن **نتواصل مع بعضنا** لكشف هذه المشكلات والدفع نحو التغيير.

      لا يوجد حل سهل لمشكلات القطاع أو العالم، لكن الحاجة إلى **إعطاء الأولوية للعنصر الإنساني** تبدو أكثر إلحاحًا من أي وقت مضى. وتقع على عاتقنا، كأفراد ومجتمع، مسؤولية مضاعفة مهاراتنا في التعاطف والتواصل والتسامح والاهتمام عشرة أضعاف. فالبرمجة هي الجزء السهل.

  - key: conclusion.devs2025.josh_comeau.bio
    t: مطور مستقل يعمل بمفرده

  - key: conclusion.devs2025.josh_comeau
    t: |
      ليس سرًا أن قطاع التقنية يمر باضطرابات منذ عامين. لم يكن دخول مجال تطوير البرمجيات سهلًا قط، لكنه قد يبدو مستحيلًا هذه الأيام؛ فحتى المطورون ذوو الخبرة لسنوات يفيدون بصعوبة العثور على عمل.

      ومع ذلك، تشير نتائج الاستطلاع إلى أن الأمور ليست بالسوء الذي تبدو عليه. لقد رأينا جميعًا عناوين الأخبار عن موجات التسريح الضخمة في قطاع التقنية، لكن [أقلية صغيرة من المطورين](../career/#laid_off) فقط أفادت بتعرضها للتسريح خلال العام الماضي (وينطبق ذلك حتى على المطورين المبتدئين!).

      يقول معظم المطورين إن [رواتبهم ارتفعت خلال العام الماضي](../workplace/#income_evolution)، بينما أفاد 9% فقط بانخفاض أجورهم. وقدم المطور المبتدئ عند الوسيط [10 طلبات توظيف فقط](../workplace/#job_finding_application_count) للحصول على وظيفته الحالية. ولا يقول سوى [14% من المشاركين](../workplace/#job_happiness) إنهم غير راضين أو غير راضين إطلاقًا عن وظائفهم.

      لا تزال هناك مشكلات كبيرة في قطاع التقنية (فعلى سبيل المثال، أفادت نحو نصف النساء والمشاركين غير الثنائيين [بتعرضهم للتمييز](../career/#discrimination_issues) على أساس النوع الاجتماعي أو الهوية الجندرية)، لذا لا أزعم أن كل شيء رائع 😅.

      لكن الرأي السائد على الإنترنت هو أن تطوير البرمجيات يواجه تهديدًا وجوديًا من الذكاء الاصطناعي، وأن النماذج اللغوية الكبيرة بدأت تحل محلنا. وأعتقد أنه لو كان ذلك صحيحًا، لبدت نتائج هذا الاستطلاع مختلفة جدًا.

  - key: conclusion.devs2025.declan_chidlow.bio
    t: مطور واجهات أمامية ومصمم وكاتب

  - key: conclusion.devs2025.declan_chidlow
    t: |
      يسهل أن يحدد الراسخون ملامح أي قطاع، لكن لا مستقبل من دون دماء جديدة.

      دخول هذا المجال مهمة شاقة: طلب توظيف آخر، ويوم آخر، وأكثر من 1000 متقدم، و«مقابلات» فيديو بالذكاء الاصطناعي. من الواضح أن مواقع الوظائف ليست سوى لعبة أرقام، وأن [العلاقات هي ما يصنع الفرق](../workplace/#job_finding_methods). ويكون [عدد الطلبات](../workplace/#job_finding_application_count) اللازمة للحصول على وظيفة أعلى لدى الأقل خبرة؛ ولا يسعني إلا أن أتساءل إن كان سيزداد أكثر مع استمرار الشركات في محاولاتها الفظة لاستبدال المبتدئين بالذكاء الاصطناعي.

      يُقال إن الصحة الجيدة تضيع على الشباب. وبالحديث عن المبتدئين، يبدو ذلك [صحيحًا](../worldview/#happiness_factors) بالفعل؛ فالفئة دون العشرين هي الوحيدة التي لم تذكر «الصحة الجيدة» بوصفها مصدر سعادتها الرئيسي. ويبدو أن المطورين جماعة واعية ومسؤولة، إذ تشير [نظرتنا إلى العالم](../worldview/) إلى اهتمامنا بالقضايا العالمية.

      وعند الالتفات إلى البيانات الوصفية للإجابات، يبدو أن استخدام المطورين [للمتصفحات](../metadata/#browser) أكثر تنوعًا بكثير من عامة الناس. تبلغ حصة Chrome نسبة 36%، وFirefox نسبة 14%، وSafari نسبة 13%، وEdge نسبة 2%. في المقابل، يقدّر [Statcounter](https://gs.statcounter.com/browser-market-share/) الاستخدام العالمي بنسب 68% لـChrome و16% لـSafari و5% لـEdge و2% لـFirefox. ويظهر تنوع مماثل في مجموعة [أنظمة تشغيل الحواسيب المستخدمة](../technology/#desktop_os)، إذ تقل حصة Windows المعتادة لصالح macOS وLinux.

      أود أن أرى في الاستطلاعات المقبلة إجابات من عينة أكثر تنوعًا، وأن أسمع تجارب الفئات الأقل تمثيلًا، لا سيما كي أتعلم منها. كما أتمنى أن نرى تنوعًا جغرافيًا أكبر في الإجابات، إذ غالبًا ما تهيمن الولايات المتحدة على النقاشات المتعلقة بالتطوير.

      ومن منظور القطاع، أحلم بأن تنظر المؤسسات إلى هذه الاستطلاعات بوصفها قائمة مهام، وأن تركز على أوجه القصور التي تسلط الضوء عليها.

  - key: conclusion.devs2025.lola_odelola.bio
    t: مهندسة برمجيات ومؤسسة [Blackgirl.tech](https://blackgirl.tech/)

  - key: conclusion.devs2025.lola_odelola
    t: |
      أثناء مراجعتي لبيانات استطلاع حالة المطورين لعام 2025، لفتت انتباهي بعض النقاط. أنا امرأة سوداء بريطانية-نيجيرية سيسجندر أعمل لحسابي الخاص، وأعيش مع اضطراب فرط الحركة ونقص الانتباه والصداع العنقودي؛ أي إن هويتي تجمع تقاطعات متعددة. وهذا هو السياق الذي أقرأ البيانات وأفسرها من خلاله.

      تنعكس بعض تجاربي في البيانات. فعلى سبيل المثال، أفاد 21% من المشاركين السود أو الأفارقة، بغض النظر عن نوعهم الاجتماعي، [بتعرضهم للتمييز في مكان العمل](../career/#discrimination_issues). وقد اختبرت ذلك أيضًا أثناء عملي في شركات بريطانية وأمريكية، حتى ضمن فرق بدت متنوعة ظاهريًا.

      ومع ذلك، فإن جمع بيانات العِرق والإثنية على نطاق عالمي أمر معقد، لأن مفهوم العِرق يختلف من مكان إلى آخر. من المهم معرفة أنني امرأة سوداء سيسجندر، لكن وصف «سوداء» يفقد بعض معناه إذا كنت في نيجيريا وأعمل لدى شركة نيجيرية.

      بسبب التمييز الذي تعرضت له، أرى أن عملي لحسابي الخاص تكييف يتيح لي مواصلة العمل الذي أهتم به في أكثر بيئة ممكنة أمانًا.

      لكن لهذا الخيار تحدياته أيضًا؛ فقد أفاد 15% من المشاركين العاملين لحسابهم الخاص [بانخفاض دخلهم](../career/#employment_status) خلال العام الماضي، ووجدت نفسي ضمن هذه المجموعة كذلك.

      يحدث كل هذا في وقت تتعرض فيه حقوق العمال للهجوم في أنحاء العالم: فبينما تحاول الحكومات الغربية إلغاء الحماية في أماكن العمل (وخاصةً للأشخاص ذوي الإعاقة)، تتعرض القوى العاملة في قطاع التقنية في بلدان الجنوب العالمي للاستغلال وتقاضي أجورًا متدنية من شركات التقنية الكبرى.

      آمل أن يتغير ذلك من خلال مزيد من العمل الجماعي والتضامن بين العمال، بحيث يشارك العاملون في مختلف الأدوار في تشكيل ظروف عملهم والمنتجات التي يبنونها، وإعادة توزيع السلطة والأرباح بطرق أكثر عدلًا.

      وفي المستقبل، قد يساعد جمع بيانات إضافية عن الجنسية على توفير سياق يتجاوز العِرق؛ وكذلك معالجة نقص تمثيل البلدان الأفريقية وبلدان جنوب آسيا في الاستطلاع. وكل ذلك سيساعدنا على فهم من يملك السلطة في قطاع التقنية العالمي.

