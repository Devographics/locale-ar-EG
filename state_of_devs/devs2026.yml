  ###########################################################################
  # Conclusion
  ###########################################################################

  - key: conclusion.devs2026.sacha_greif.bio
    t: مؤسس Devographics

  - key: conclusion.devs2026.sacha_greif
    t: |

      أبدأ الآن عامي الحادي عشر على التوالي في تنظيم استطلاعات للمطورين، وعندما أنظر إلى الوراء يبدو طريفًا تقريبًا أن الأسئلة الكبيرة التي كانت تؤرقنا تتمثل في الاختيار بين React وAngular.


      لكن الأمور تغيرت، وقد يُذكر عام 2026 بوصفه العام الذي أصبح فيه الذكاء الاصطناعي أكبر من أن نتجاهله. فقد بات من الأصعب تجاهله باعتباره «تصحيحًا تلقائيًا ذكيًا»، وبدأ تأثيره يحدث صدى في كل طبقات المجتمع. وكان هذا الاستطلاع، بطريقة ما، محاولة لالتقاط صورة لهذه السنة الاستثنائية جدًا.


      ومع ذلك، هناك أسئلة لا يستطيع استطلاع الإجابة عنها. هل سيظل المبرمجون يكتبون الشيفرة بأيديهم بعد خمس سنوات؟ وهل ستظل هندسة البرمجيات مهنة قائمة أصلًا؟ وهل سيواصل المطورون الإجابة عن هذه الاستطلاعات عامًا بعد عام؟


      في الوقت الحالي على الأقل، أفضل ما نأمله هو مواصلة العثور على المتعة فيما نفعله، يومًا بعد يوم. وآمل أن أراكم جميعًا مجددًا في عام 2027!

  - key: conclusion.devs2026.miranda_heath.bio
    t: المديرة المؤسسة والباحثة في [Software Stewardship Lab](https://stewardshiplab.org/)

  - key: conclusion.devs2026.miranda_heath
    t: |
      ### "علينا أن نتحدث عن الذكاء الاصطناعي"


      يمر المطورون بمرحلة يسودها عدم اليقين.


      واجه نحو نصف المشاركين في استطلاع هذا العام [انعدام الأمان الوظيفي وعدم كفاية الأجور](../career/#career_issues). وتعرض ربعهم [للتسريح من العمل](../career/#laid_off) في مرحلة ما من مسيرتهم المهنية، كما سُرّح نحو مشارك واحد من كل عشرة خلال الأشهر التسعة الماضية. وتوقع أكثر من ربعهم الاضطرار إلى [تغيير مسارهم المهني](../career/#career_security) بالكامل خلال السنوات الخمس المقبلة.


      كان هذا أول استطلاع من Devographics يسأل عن [الحالة النفسية]() للمطورين، وتشير النتائج أيضًا إلى تغيرات مقلقة في _الشعور_ بالعمل كمطور برمجيات. فقد شعر نحو ثلثي المشاركين مؤخرًا بتراجع الحافز وتزايد التشاؤم. وعانى نحو نصفهم من صعوبة التركيز، وزيادة التسويف، وشعور غير معتاد بالاستنزاف، وتراجع الإحساس بالإنجاز والفعالية في العمل.


      ---


      تشير هذه التغيرات إلى الإنهاك الوظيفي، وهي حالة من الاستنزاف تحدث عندما يسلبك العمل طاقة تفوق ما يمنحك إياها. وأفاد 62% من المطورين بتعرضهم [للإنهاك الوظيفي](../career/#career_issues) في مرحلة ما من مسيرتهم، وهي النسبة نفسها في استطلاع العام الماضي.


      لكن استمرار شيوع الإنهاك الوظيفي في تطوير البرمجيات لا يبرر اعتباره أمرًا طبيعيًا. فقد يؤثر الإنهاك بشدة في صحة الأشخاص ورفاههم. ويتضح ذلك أيضًا في البيانات: فالمطورون الذين تعرضوا للإنهاك كانوا عمومًا أقل سعادة وأكثر عرضة لمشكلات صحية جسدية ونفسية مستمرة.


      ---


      هناك أيضًا أمر كبير نتجاهله، ويغذي حالة عدم اليقين بصمت. وللمرة الأولى هذا العام، طلبت Devographics من المطورين مشاركة آرائهم فيه. أقصد بالطبع الذكاء الاصطناعي.


      رغم أن استخدام الذكاء الاصطناعي كان [واسع الانتشار جدًا](../ai/#ai_generated_code_balance)، فإن الآراء حوله [منقسمة بشدة](../ai/#ai_sentiment)، إذ عبّر 49% من المشاركين عن انطباع إيجابي، و39% عن انطباع سلبي.


      لا يزال فهمنا للأثر النفسي للبرمجة باستخدام الذكاء الاصطناعي في طور التكوين، لكن الأدلة الأولية تشير إلى أن كتابة الأوامر قد [تبدو إدمانية](https://www.youtube.com/watch?v=iPUn1Fnfn0k&t=407s)، وأن الاعتماد المفرط على الذكاء الاصطناعي قد [يقوض التعلم](https://www.youtube.com/watch?v=DkhhE97Swmo&list=WL&index=3)، وأن تشغيل عدة وكلاء بالتوازي قد يؤدي إلى حمل معرفي زائد يُسمى «إرهاق الدماغ بالذكاء الاصطناعي». وبما يتماشى مع ذلك، رأى نحو نصف المشاركين أن الذكاء الاصطناعي أثر سلبًا في [حالتهم النفسية](../ai/#ai_mental_state).


      والأهم من ذلك أن المطورين أرادوا بوضوح التحدث عن تأثير الذكاء الاصطناعي في مهنتهم. واختار أكثر من 1500 مشارك كتابة آرائهم حول [الذكاء الاصطناعي](../ai/#ai_outlook). وشملت الموضوعات الشائعة ضرورة معرفة كيفية استخدامه بأمان وحكمة، وكيف يجعل العمل أقل إرضاءً، وكيف يدفع الإدارة إلى توقع مستويات إنتاجية غير مستدامة.


      ---


      وبينما يبدو أن الذكاء الاصطناعي يغير أشياء كثيرة بسرعة مفرطة، تتغير بعض جوانب تطوير البرمجيات ببطء محبط.


      لا تزال النساء أكثر عرضة بكثير [للتمييز](../career/#discrimination_issues) مقارنة بزملائهن الرجال. ومما يثير القلق أنهن أكثر ميلًا إلى [تجنب الزملاء أو تغيير سلوكهن أو مظهرهن، بل وحتى تغيير مسارهن المهني](../career/#negative_impacts)، استجابةً لمشكلات العمل. ويشير ذلك إلى أن الطريق الأسهل للنساء لا يزال يتمثل في التكيف أو التغير أو محو ذواتهن ليتناسبن مع ثقافة عمل تضعهن في موقف غير منصف، بدلًا من توقع تغير القطاع نفسه.


      وبالمثل، وصف المشاركون من مجتمع LGBT+ والمصابون باضطراب فرط الحركة ونقص الانتباه أو التوحد شعورهم بضغط لإخفاء هويتهم في العمل. ويعرضهم التعامل غير المنصف والضغط لإخفاء ذواتهم لمخاطر إضافية من الإنهاك الوظيفي وأضراره المرتبطة به.


      ---


      قد يشبه شعورك كمطور الآن وجودك في قلب عاصفة رملية. تهب رياح غريبة، وقد يصعب رؤية الطريق أمامنا. لكن إذا واصلنا الحوار—وواصلنا الحديث عن تأثير الذكاء الاصطناعي، والجوانب التي تمنح عملنا متعةً ومعنى، وكيف ندافع عنها—فربما يبدو المشهد أجمل بكثير بعد انقشاع الغبار.


      ويتجلى ذلك بأوضح صورة عند النظر إلى [مواقف المطورين تجاه قطاع التقنية](../worldview/#tech_industry_emotion). فالعمل في قطاع دائم التغير وغير مستقر قد يكون مرهقًا، وقد يثير الإحباط والقلق والغضب والشعور بالإنهاك. لكن التغيير يحمل معه إمكانات، وحيث توجد الإمكانات، يبقى مجال للفضول والأمل والحماس!

  ###########################################################################
  # FAQ/About
  ###########################################################################

  - key: about.content.devs2026
    t: |
      أُجري استطلاع حالة المطورين لعام 2026 من 5 يوليو إلى 5 سبتمبر 2026، وجُمع فيه 5,463 ردًا. ونُشرت النتائج في 25 سبتمبر 2025. وتتولى [Devographics](https://devographics.com/) تنظيم الاستطلاع.

      ### أهداف الاستطلاع

      أُعد هذا الاستطلاع في محاولة لمعرفة المزيد عن الجوانب غير التقنية من حياة المطور.

      ### تصميم الاستطلاع

      صُمم الاستطلاع بالتعاون مع المجتمع، وأُتيحت فترة مفتوحة لتقديم الملاحظات نوقش خلالها مخطط الاستطلاع [على GitHub](https://github.com/Devographics/surveys/issues/279).

      كانت جميع أسئلة الاستطلاع اختيارية.

      ### المشاركون في الاستطلاع

      كان الاستطلاع متاحًا للجميع عبر الإنترنت، ولم تُصفَّ المشاركات أو تُنتقَ بأي طريقة. وتألف المشاركون أساسًا من مزيج من المشاركين في استطلاعات Devographics السابقة مثل [حالة JS](https://stateofjs.com/) و[حالة CSS](https://stateofcss.com/) وغيرها (الذين أُبلغوا عبر قائمة بريدية مخصصة)، ومن زوار منصات التواصل الاجتماعي.

      ينبغي أيضًا اعتبار هذا الاستطلاع **صورةً لفئة محددة من المطورين**، فهو لا يهدف إلى تمثيل المنظومة بأكملها.

      ### تمويل المشروع

      يأتي تمويل هذا المشروع من شركائنا المدرجين على الصفحة الرئيسية للاستطلاع.

