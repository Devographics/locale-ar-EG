locale: ar-EG
translations:
  - key: general.devs2026.survey_intro
    t: |

     غطى أول استطلاع رأي على الإطلاق حول حالة المطورين في العام الماضي قضايا تتعلق بالمسار الوظيفي، ومكان العمل، والصحة، وحتى النظرة العالمية، وهي قضايا غالباً ما يتم تجاهلها في مجتمع المطورين.

      وكان من المنطقي فقط متابعة هذا الإصدار الثاني حول جميع جوانب حياة المطور التي لا تتعلق بالبرمجة، خاصة في الوقت الذي بدأ فيه الذكاء الاصطناعي في تغيير طبيعة وظائفنا.

        لذا، وبينما لا يزال هناك شخص في هذه العملية، دعونا نترك جانباً المكتبات والأطر ونسأل فقط: كيف حالك، *فعلاً*؟

       وكالعادة، كل سؤال اختياري، لذا لا تتردد في تخطي أي سؤال لا تشعر بالراحة في الإجابة عليه.
  
  - key: introduction.devs2026.not_used
    t: |

      قد يُذكر هذا العام بوصفه العام الذي أصبح فيه الذكاء الاصطناعي أكبر من أن نتجاهله. فقد بات من الأصعب تجاهله باعتباره «تصحيحًا تلقائيًا ذكيًا» أو السخرية من الشيفرة المتشابكة التي ينتجها بالبرمجة الحدسية، وأصبح تأثيره ملموسًا في كل طبقات المجتمع.


      لهذا قررت تخصيص قسم كامل لسؤال المطورين ليس فقط عما إذا كانوا يستخدمون الذكاء الاصطناعي، بل عما *يشعرون به* تجاه استخدامه، فذلك أمر مختلف تمامًا.


      كما أضفت ميزة جديدة كليًا: **الارتباطات**، ويمكن الوصول إليها عبر أيقونات الشبكة الحمراء والصفراء الصغيرة المنتشرة في الاستطلاع. وهي ترشدك إلى مسارات مثيرة للتعمق في البيانات، ويمكنك استكشافها أكثر باستخدام **منشئ الاستعلامات**.


      وبالطبع، يبقى التحذير المعتاد قائمًا: الارتباط لا يعني السببية قطعًا، وقد لا تمثل عينة المشاركين في هذا الاستطلاع مجتمع المطورين بأكمله دائمًا.


      وبعد هذه التنبيهات، ندعوك لاكتشاف نتائج استطلاع حالة المطورين لعام 2026!


      <span class="conclusion__byline">– Sacha Greif</span>

  - key: general.devs2026.html2026_banner
    t: |
      شارك الآن في استطلاع حالة HTML لمواكبة تطور منصة الويب! ←

  # FAQ

  - key: faq.how_long_will_survey_take_devs2026
    t: كم من الوقت يستغرق إكمال هذا الاستطلاع؟
  - key: faq.how_long_will_survey_take_devs2026.description
    t: >
      يستغرق إكمال هذا الاستطلاع نحو 15 دقيقة. تذكّر أن جميع الأسئلة اختيارية.

  - key: faq.results_released_devs2026
    t: متى ستُنشر النتائج؟
  - key: faq.results_released_devs2026.description
    t: سيُجرى الاستطلاع من 5 يوليو إلى 5 سبتمبر 2026، وستُنشر النتائج بعد ذلك بوقت قصير.

  - key: faq.survey_design_devs2026
    t: كيف صُمم هذا الاستطلاع؟
  - key: faq.survey_design_devs2026.description
    t: >
      صُمم هذا الاستطلاع نتيجة [عملية تصميم مفتوحة](https://github.com/Devographics/surveys/issues/288) شارك فيها مجتمع تطوير الويب.

  ###########################################################################
  # Overview
  ###########################################################################

  - key: overview.devs2026.0
    t: |
      *ساهمت [Miranda Heath](https://mirandaheath.website/)، المديرة المؤسسة والباحثة في [Software Stewardship Lab](https://stewardshiplab.org/)، في إعداد نظرة هذا العام.*
  - key: overview.devs2026.1
    t: >
      يمر المطورون بمرحلة يسودها عدم اليقين.


      واجه نحو نصف المشاركين في استطلاع هذا العام انعدام الأمان الوظيفي وعدم كفاية الأجور. وسُرّح ربعهم من العمل في مرحلة ما من مسيرتهم المهنية، كما سُرّح نحو مشارك واحد من كل عشرة خلال الأشهر التسعة الماضية. وتوقع أكثر من ربعهم الاضطرار إلى تغيير مسارهم المهني بالكامل خلال السنوات الخمس المقبلة.

  - key: overview.devs2026.2
    t: >

      ## إدارة الحالة (النفسية)


      كان هذا أول استطلاع من Devographics يسأل عن الحالة النفسية للمطورين، وتشير النتائج أيضًا إلى تغيرات مقلقة في _الشعور_ بالعمل كمطور برمجيات. فقد شعر نحو ثلثي المشاركين مؤخرًا بتراجع الحافز وتزايد التشاؤم. وعانى نحو نصفهم من صعوبة التركيز، وزيادة التسويف، وشعور غير معتاد بالاستنزاف، وتراجع الإحساس بالإنجاز والفعالية في العمل.

  - key: overview.devs2026.3
    t: >
      تشير هذه التغيرات إلى الإنهاك الوظيفي، وهي حالة من الاستنزاف تحدث عندما يسلبك العمل طاقة تفوق ما يمنحك إياها. وأفاد 62% من المطورين بتعرضهم للإنهاك الوظيفي في مرحلة ما من مسيرتهم، وهي النسبة نفسها في استطلاع العام الماضي.

  - key: overview.devs2026.4
    t: >
      لكن استمرار شيوع الإنهاك الوظيفي في تطوير البرمجيات لا يبرر اعتباره أمرًا طبيعيًا. فقد يؤثر الإنهاك بشدة في صحة الأشخاص ورفاههم. ويتضح ذلك أيضًا في البيانات: فالمطورون الذين تعرضوا للإنهاك كانوا عمومًا أقل سعادة وأكثر عرضة لمشكلات صحية جسدية ونفسية مستمرة.

  - key: overview.devs2026.5
    t: >

      ## علينا أن نتحدث عن الذكاء الاصطناعي


      هناك أيضًا أمر كبير نتجاهله، ويغذي حالة عدم اليقين بصمت. وللمرة الأولى هذا العام، طلبت Devographics من المطورين مشاركة آرائهم فيه. أقصد بالطبع الذكاء الاصطناعي.


      رغم الانتشار الواسع جدًا لاستخدام الذكاء الاصطناعي، انقسمت الآراء حوله بشدة؛ إذ عبّر 49% من المشاركين عن انطباع إيجابي، و42% عن انطباع سلبي.

  - key: overview.devs2026.6
    t: >
      لا يزال فهمنا للأثر النفسي للبرمجة باستخدام الذكاء الاصطناعي في طور التكوين، لكن الأدلة الأولية تشير إلى أن كتابة الأوامر قد [تبدو إدمانية](https://www.youtube.com/watch?v=iPUn1Fnfn0k&t=407s)، وأن الاعتماد المفرط على الذكاء الاصطناعي قد [يقوض التعلم](https://www.youtube.com/watch?v=DkhhE97Swmo&list=WL&index=3)، وأن تشغيل عدة وكلاء بالتوازي قد يؤدي إلى حمل معرفي زائد يُسمى «إرهاق الدماغ بالذكاء الاصطناعي». وبما يتماشى مع ذلك، رأى نحو نصف المشاركين أن الذكاء الاصطناعي لم يؤثر إيجابيًا في حالتهم النفسية.

  - key: overview.devs2026.7
    t: >
      والأهم من ذلك أن المطورين أرادوا بوضوح التحدث عن تأثير الذكاء الاصطناعي في مهنتهم. واختار أكثر من 1500 مشارك كتابة آرائهم حوله. وشملت الموضوعات الشائعة ضرورة معرفة كيفية استخدام الذكاء الاصطناعي بأمان وحكمة، وكيف يجعل العمل أقل إرضاءً، وكيف يدفع الإدارة إلى توقع مستويات إنتاجية غير مستدامة.

  - key: overview.devs2026.8
    t: >

      ## مشكلات مستمرة


      وبينما يبدو أن الذكاء الاصطناعي يغير أشياء كثيرة بسرعة مفرطة، تتغير بعض جوانب تطوير البرمجيات ببطء محبط.


      لا تزال النساء أكثر عرضة بكثير للتمييز مقارنة بزملائهن الرجال. ومما يثير القلق أنهن أكثر ميلًا إلى تجنب الزملاء أو تغيير سلوكهن أو مظهرهن، بل وحتى تغيير مسارهن المهني، استجابةً لمشكلات العمل. ويشير ذلك إلى أن الطريق الأسهل للنساء لا يزال يتمثل في التكيف أو التغير أو محو ذواتهن ليتناسبن مع ثقافة عمل تضعهن في موقف غير منصف، بدلًا من توقع تغير القطاع نفسه.


      وبالمثل، وصف المشاركون من مجتمع LGBT+ والمصابون باضطراب فرط الحركة ونقص الانتباه أو التوحد شعورهم بضغط لإخفاء هويتهم في العمل. ويعرضهم التعامل غير المنصف والضغط لإخفاء ذواتهم لمخاطر إضافية من الإنهاك الوظيفي وأضراره المرتبطة به.

  - key: overview.devs2026.9
    t: >

      ## رياح غريبة


      قد يشبه شعورك كمطور الآن وجودك في قلب عاصفة رملية. تهب رياح غريبة، وقد يصعب رؤية الطريق أمامنا. لكن إذا واصلنا الحوار—وواصلنا الحديث عن تأثير الذكاء الاصطناعي، والجوانب التي تمنح عملنا متعةً ومعنى، وكيف ندافع عنها—فربما يبدو المشهد أجمل بكثير بعد انقشاع الغبار.

  - key: overview.devs2026.10
    t: >
      ويتجلى ذلك بأوضح صورة عند النظر إلى مواقف المطورين من قطاع التقنية. فالعمل في قطاع دائم التغير وغير مستقر قد يكون مرهقًا، وقد يثير الإحباط والقلق والغضب والشعور بالإنهاك. لكن التغيير يحمل معه إمكانات، وحيث توجد الإمكانات، يبقى مجال للفضول والأمل والحماس!

  ###########################################################################
  # Takeaways
  ###########################################################################

  # user_info

  - key: sections.user_info.description.devs2026
    t: شارك 5,463 مطورًا في هذا الإصدار الثاني من استطلاع حالة المطورين.

  - key: user_info.country.takeaway.devs2026
    t: |
      ليس سرًا أن المطورين في [**الولايات المتحدة**]{@country_vs_salary.USA} يميلون إلى تقاضي رواتب أعلى، وتؤكد البيانات هذا الاتجاه مرة أخرى.

      لكن المشاركين من الولايات المتحدة، رغم ارتفاع دخلهم، يعملون ساعات أكثر أيضًا. ومن ناحية أخرى، تبرز [**المملكة المتحدة**]{@country_by_work_hours.GBR} و[**النرويج**]{@country_by_work_hours.NOR} و[**الدنمارك**]{@country_by_work_hours.DNK} بوجودها ضمن الدول العشر الأولى من حيث أعلى الدخل وأقل ساعات العمل.

      لاحظ أننا سألنا المشاركين هذا العام أيضًا عن بلد *أصلهم*، رغم عدم رصد فروق كبيرة.

  - key: user_info.country_of_origin.takeaway.devs2026
    t: |
      يتطابق بلد أصل المشاركين إلى حد كبير مع بلد إقامتهم.

  - key: user_info.migration_experience.takeaway.devs2026
    t: |
      يُظهر النظر إلى تجربة الهجرة أن المشاركين الذين لديهم آباء مهاجرون أو هاجروا بأنفسهم يميلون إلى كسب دخل أعلى بكثير (مع أن التكهن بأسباب هذا الارتباط خارج نطاق هذا الاستطلاع).

      وبينما تسجل [**اليابان**]{@country_vs_migration_experience.JPN} أعلى مستويات الهجرة بين المشاركين، فمن المؤكد تقريبًا أن ذلك يرجع إلى عدم وصول الاستطلاع إلى السكان اليابانيين الأصليين، لا إلى اتجاه ديموغرافي حقيقي.

      ومن ناحية أخرى، رغم شهرة الولايات المتحدة بأنها «بلد المهاجرين»، فإن {@country_vs_migration_experience.USA.same_country_immigrant_parents+different_country+different_country_immigrant_parents} فقط من المشاركين من [**الولايات المتحدة**]{@country_vs_migration_experience.USA} لهم أصول مهاجرة، مقارنةً بنسبة {@country_vs_migration_experience.overall.same_country_immigrant_parents+different_country+different_country_immigrant_parents} بين جميع المشاركين.

  - key: user_info.native_languages.takeaway.devs2026
    t: |
      عند مقارنة قوائم اللغات الأم (علامة التبويب 1) واللغات التي تعلمها المشاركون لاحقًا (علامة التبويب 2)، تبرز ملاحظة واحدة: فبينما يتحدث {@$block.japanese.count} مشاركًا فقط اليابانية كلغتهم الأم، تعلمها {@other_languages.japanese.count} منهم، ما يعكس قوة الجاذبية الثقافية للبلد.


  - key: user_info.gender.takeaway.devs2026
    t: |
      تكشف البيانات أن معظم العوامل لا ترتبط بقوة بالنوع الاجتماعي، لكن بعض المجالات الرئيسية ترتبط به *بالفعل*.

      فعلى سبيل المثال، لا يتعرض الرجال عادةً للتمييز في مكان العمل بالقدر نفسه، كما أنهم أكثر ميلًا بكثير إلى تعريف أنفسهم بأنهم مغايرون جنسيًا.

  - key: user_info.sexual_orientation.takeaway.devs2026
    t: |
      التوجه الجنسي مجال تنقصه البيانات والتمثيل في مجتمع المطورين، ولهذا قررنا إضافته إلى الاستطلاع هذا العام.

      يميل المشاركون المغايرون جنسيًا أكثر إلى تعريف أنفسهم بأنهم **يمينيون**، وهم أقل عرضة للإصابة **بحالات التنوع العصبي**، بينما يزداد قلق المشاركين المثليين والمثليات ومزدوجي التوجه الجنسي من **تصاعد التعصب** بوصفه قضية عالمية.

  - key: user_info.race_ethnicity.takeaway.devs2026
    t: |
      كما قد نتوقع، يرتبط العِرق بقوة باللغة الأم (لاحظ أن البلد وبلد الأصل مستبعدان تلقائيًا من التصفية هنا).

      وثمة ارتباط آخر جدير بالإشارة: المشاركون [**البيض**]{@$block_vs_years_of_experience.white_european} أكثر ميلًا إلى أن يكونوا أكبر سنًا ولديهم سنوات خبرة أطول في البرمجة، وهي نتيجة تتكرر منذ بدء تتبع هذه البيانات.

  - key: user_info.relationship_status.takeaway.devs2026
    t: |
      كما قد نتوقع، لدى المشاركين المرتبطين عاطفيًا أطفال أكثر، لكن ليس بفارق كبير. فحتى متوسطهم لا يتجاوز **{@$block_vs_number_of_kids.in_a_relationship.average}** طفلًا، وهو أقل بكثير من معدل الإحلال السكاني البالغ 2.1 طفل الذي يُستشهد به كثيرًا.

  - key: user_info.number_of_kids.takeaway.devs2026
    t: |
      يظهر انهيار معدلات الخصوبة العالمية بوضوح في هذه البيانات، إذ لا تتجاوز نسبة المشاركين الذين لديهم أربعة أطفال أو أكثر [2%]{@$block.range_4+range_over_5}.

      ومن أسباب ذلك تأخر المشاركين في إنجاب الأطفال (فمتوسط عدد الأطفال لدى الفئة العمرية من 20 إلى 29 عامًا لا يتجاوز **{@age_vs_number_of_kids.range_20_29.average}**)، ما يترك فترة أقصر بكثير قبل بلوغ الحد البيولوجي للإنجاب.

  # career

  - key: sections.career.description.devs2026
    t: مسيرتك المهنية وخبراتك العملية حتى الآن.

  - key: career.years_of_experience.takeaway.devs2026
    t: |
      كانت مشاركة المطورين المبتدئين أقل في استطلاع هذا العام، إذ لم تتجاوز نسبة المشاركين الذين لديهم أربع سنوات من الخبرة المهنية أو أقل {@$block.range_0_4}.

      سيكون من المثير متابعة تطور هذا الجيل من المطورين الذي نشأ في عصر الذكاء الاصطناعي، لكن في الوقت الحالي بدأ الغالبية العظمى من المشاركين مسيرتهم المهنية في عالم ما قبل الذكاء الاصطناعي.

  - key: career.how_many_jobs.takeaway.devs2026
    t: |
      يكشف النظر إلى الارتباطات في هذا السؤال عن علاقة قوية بين العمل لدى عدد أكبر من أصحاب العمل والإبلاغ عن مزيد من مشكلات مكان العمل.

      قد يرجع ذلك ببساطة إلى تعرض المشاركين لمزيد من المشكلات بمرور الوقت، لكن من العوامل المحتملة أيضًا أن الموظفين المبتدئين قد لا يمتلكون بعد المنظور اللازم للتعرف على السلوكيات الإشكالية من الأساس.

  - key: career.employment_status.takeaway.devs2026
    t: |
      بينما شهد {@$block_vs_income_evolution.company_employee.increased} من موظفي الشركات زيادةً في دخلهم خلال العام الماضي، لم يحالف الحظ المستقلين بالقدر نفسه؛ إذ لم يشهد تحسنًا في دخلهم سوى {@$block_vs_income_evolution.freelance.increased} منهم.

  - key: career.career_issues.takeaway.devs2026
    t: |
      إلى جانب [**انعدام الأمان الوظيفي**]{@$block_vs_job_insecurity.job_insecurity} نفسه، يبرز [**التمييز**]{@$block_vs_job_insecurity.discrimination} بوصفه المشكلة الأرجح لأن تدفع المشاركين إلى الاعتقاد بأنهم سيضطرون إلى تغيير وظائفهم قريبًا.

      ومن المثير للاهتمام أيضًا ملاحظة تأثير عوامل مثل [**النوع الاجتماعي**]{@$block_men_vs_non_men} في مشكلات مكان العمل. فعلى سبيل المثال، أبلغ الرجال عن **4.2** مشكلات مختلفة في المتوسط، بينما اختارت النساء والمشاركون غير الثنائيين **4.8** بنود.

  - key: career.discrimination_issues.takeaway.devs2026
    t: |
      [**العمر**]{@$block.age} هو العامل الأكثر شيوعًا في الإبلاغ عن التمييز، لكن التعليقات الإضافية للمشاركين تشير إلى أن الأمر يسير في الاتجاهين: فقد ذكروا تجاهلهم لصغر سنهم، والتقليل من شأنهم لكبر سنهم.

      ومن الجدير بالذكر أيضًا أن للتمييز أشكالًا عديدة، وأن مبادرات دعم التنوع قد تؤثر سلبًا أحيانًا في الأشخاص الذين يُفترض أن تساعدهم. وكما أشارت إحدى المشاركات: «إن كونك المرأة الرمزية أمر مرهق. يُتوقع مني الظهور في المواد التسويقية لصاحب العمل وإبداء رأيي في كل ما يتعلق بالتنوع والإنصاف والشمول من دون مقابل».

      وأخيرًا، يرتبط اختيار عدد أكبر من البنود في هذا السؤال بالتعرض لمزيد من **المشكلات الصحية المستمرة**، وهو تذكير آخر بأن مشكلات العمل لا تحدث بمعزل عن غيرها.

  - key: career.negative_impacts.takeaway.devs2026
    t: |

      بينما صرح {@$block_men_vs_non_men_2.na} من المشاركين الرجال بأنهم لم يضطروا قط إلى اتخاذ أي إجراء استجابةً لمشكلات العمل، تنخفض النسبة إلى {@$block_men_vs_non_men_1.na} لدى المشاركين من غير الرجال.

      وبوجه عام، كانت أكثر الاستجابات شيوعًا هي [**تجنب الزملاء**]{@$block.isolating_yourself}، أو [**تغيير السلوك الشخصي**]{@$block.changing_behavior}، أو ببساطة [**الاستقالة**]{@$block.quitting_job}. وبصرف النظر عن الاستراتيجية التي اتبعها المشاركون، فقد أُبلغ عن هذه الاستجابات جميعها بمعدلات أعلى لدى غير الرجال.

  - key: career.laid_off.takeaway.devs2026
    t: |

      رغم أن غالبية المشاركين لم يتعرضوا للتسريح من العمل قط، نلاحظ زيادة تدريجية في الإجابات بالإيجاب مقارنةً بالعام الماضي (مع التنبيه المعتاد إلى أن ذلك قد يرجع أيضًا إلى تغير عينة المشاركين من عام إلى آخر).

  - key: career.job_security.takeaway.devs2026
    t: |

      رغم تأثير القلق من الذكاء الاصطناعي والإنهاك في القطاع، تظل مشكلات مكان العمل التقليدية في الوقت الحالي على الأقل العوامل الرئيسية التي تجعل المشاركين يقلقون على وظائفهم.

  - key: career.career_security.takeaway.devs2026
    t: |

      لا يزال معظم المشاركين يرون أن اضطرارهم إلى تغيير مسارهم المهني أمر مستبعد، ما يدل على أن المطورين لا يصدقون تمامًا الرواية التي تقول إن الذكاء الاصطناعي سيحل محلهم قريبًا، وإنهم سيُجبرون على العمل في الأرض لتأمين معيشتهم—ليس بعد على الأقل.

  # workplace

  - key: sections.workplace.description.devs2026
    t: مكان عملك الحالي.

  - key: workplace.company_size.takeaway.devs2026
    t: |

      لا يزال العمل لدى شركات أكبر مرتبطًا بارتفاع الدخل وزيادته، لكن من المثير للاهتمام أيضًا النظر إلى ما يحدث عندما لا تعمل لدى شركة أصلًا.

      فإلى جانب العمل لساعات أقل أسبوعيًا، أفاد المستقلون أيضًا باستخدام أقل للذكاء الاصطناعي وبمواقف أكثر سلبية تجاهه عمومًا، ما يشير إلى مسار بديل محتمل لمن يبحثون عنه—على حساب دخل أقل.

  - key: workplace.job_title.takeaway.devs2026
    t: |

      لا يزال حمل المسمى الوظيفي «مهندس» يرتبط بدخل أعلى مقارنةً بكونك «مجرد» مطور.

      ونلاحظ أيضًا أن تطوير الواجهات الأمامية لا يزال يشكل الجزء الأكبر من العمل، وهذا منطقي بالنظر إلى تركيز جمهور الاستطلاع على الويب.

  - key: workplace.work_areas.takeaway.devs2026
    t: |

      يكشف تمثيل مجالات العمل مقابل متوسط الدخل السنوي ومتوسط سنوات الخبرة عن ارتباط قوي إلى حد ما بينهما.

      إلا أن بعض المجالات (مثل هندسة [**الذكاء الاصطناعي**]{@work_areas_vs_years_of_experience_vs_yearly_salary_2.ai_llm} و[**المنصات**]{@work_areas_vs_years_of_experience_vs_yearly_salary_2.platform_engineering}، و[**التوظيف/إجراء المقابلات**]{@work_areas_vs_years_of_experience_vs_yearly_salary_2.hiring_interviewing}) تقع فوق خط الاتجاه، ما يعني ارتباطها بدخول أعلى مما يُتوقع عادةً.

  - key: workplace.yearly_salary.takeaway.devs2026
    t: |

      لا تزال أقوى ثلاثة عوامل مرتبطة بالدخل المرتفع هي امتلاك **خبرة أكبر**، والعمل لدى **شركة أكبر**، والإقامة في [**الولايات المتحدة**]{@country_vs_yearly_salary.USA}.

  - key: workplace.income_evolution.takeaway.devs2026
    t: |

      رغم أن الولايات المتحدة تقدم أعلى الرواتب، فإنها [تحتل المرتبة 11 فقط]{@income_evolution_vs_country.USA.increased} عند النظر إلى الدول التي لديها أعلى نسبة من أصحاب الدخول *المتزايدة*. وتتكون قائمة الدول العشر الأولى في معظمها من دول الشمال الأوروبي وجيرانها، ما قد ينذر بتغير ترتيب الرواتب في السنوات المقبلة.

  - key: workplace.job_finding_application_count.takeaway.devs2026
    t: |

      العثور على وظيفة جديدة تحدٍ دائمًا، لكنه يصبح أسهل مع مرور السنوات، إذ احتاج المطورون الأكثر خبرة إلى محاولات أقل في المتوسط للحصول على وظيفة.

  - key: workplace.job_finding_methods.takeaway.devs2026
    t: |

      ومن المثير للاهتمام أن البيانات تُظهر أن العثور على وظيفة عبر العمل في المصادر المفتوحة أو المجتمع يرتبط [بدخل أعلى بنسبة 39%]{@$block_vs_salary.open_source_community.median} مقارنةً بالوسيط العام.

      أما من حيث الفعالية، فتتطلب أساليب البحث العامة عن الوظائف، مثل LinkedIn أو مواقع الوظائف، تقديم طلبات أكثر من الاستعانة بشبكتك الشخصية أو التقدم مباشرةً إلى شركة.

  - key: workplace.remote_work_policy.takeaway.devs2026
    t: |
      يرتبط غياب العمل عن بُعد بانخفاض كل من وسيط الدخل والرضا الوظيفي. ويبدو أن انتقال المؤسسات الأكبر إلى العمل عن بُعد أصعب، إذ لا يتجاوز وسيط عدد الموظفين **{@$block_vs_company_size.fully_remote.median}** لدى الشركات التي تعمل بالكامل عن بُعد.

  - key: workplace.work_hours_per_week.takeaway.devs2026
    t: |

      قد يبدو أن العمل أكثر يعني كسب المزيد، لكن الدخل يتأثر بالعوامل الأخرى المتداخلة (مثل سنوات الخبرة وحجم الشركة وغيرها) بدرجة أكبر بكثير من تأثره بمجرد عدد ساعات العمل.

      وفي الواقع، إذا عزلنا المطورين في الولايات المتحدة ممن لديهم خبرة من 10 إلى 14 عامًا لإزالة تأثير تلك العوامل، نرى أن الارتباط بين ساعات العمل والراتب يكاد يختفي تمامًا.

  - key: workplace.job_happiness.takeaway.devs2026
    t: |

      رغم أن غالبية المطورين لا يزالون راضين عن وظائفهم، تُظهر البيانات زيادة طفيفة في عدد المشاركين غير الراضين مقارنةً بالعام الماضي (الأعمدة المخططة بالأبيض).

  - key: workplace.workplace_perks.takeaway.devs2026
    t: |

      مرة أخرى، يأتي ترتيب [**العلاقات مع الزملاء**]{@$block.coworker_relations} و[**التوازن بين العمل والحياة**]{@$block.work_life_balance} و[**ظروف العمل**]{@$block.working_conditions} عمومًا أعلى بكثير من [**الأجر**]{@$block.compensation} وحده.

  - key: workplace.workplace_difficulties.takeaway.devs2026
    t: |
      كان [**سوء الإدارة**]{@$block.bad_management} إجابةً يكتبها المشاركون بأنفسهم العام الماضي، وإضافته ضمن الخيارات الرسمية في هذا الإصدار دفعته مباشرةً إلى المرتبة الأولى بوصفه أكثر صعوبات مكان العمل التي يعاني منها المشاركون.

  - key: workplace.workplace_burnout.takeaway.devs2026
    t: |
      استُلهمت خيارات الإجابة عن هذا السؤال من [العلامات الشائعة للإنهاك الوظيفي](https://www.mayoclinic.org/healthy-lifestyle/adult-health/in-depth/burnout/art-20046642)، وبما أن المشاركين اختاروا **4.5** بنود في المتوسط، فمن المنصف القول إن هذه المشكلة تؤثر في كثيرين منا.

  - key: workplace.keyboard.takeaway.devs2026
    t: |

      تشهد لوحات المفاتيح الميكانيكية رواجًا حاليًا، لكن كثيرًا من المطورين لا يزالون يفضلون لوحة المفاتيح الافتراضية في الحاسوب المحمول.

  - key: workplace.monitors.takeaway.devs2026
    t: |

      قد يكون استخدام شاشتين هو المعتاد، لكن أقلية كبيرة لا تزال تكتفي بشاشة واحدة.

  # ai
  - key: sections.ai_usage.description.devs2026
    t: الآراء حول الذكاء الاصطناعي

  - key: ai_usage.ai_generated_code_balance.takeaway.devs2026
    t: |
      قد توجد بعض جيوب المقاومة للذكاء الاصطناعي هنا وهناك (انظر بيانات [حالة CSS](https://2026.stateofcss.com/en-US/usage/#css_ai_generated_code_balance) لهذا العام)، لكن المطور المتوسط في عام 2026 يعيش بوضوح في عصر الذكاء الاصطناعي، إذ تشكل فئة المطورين الذين يكتبون معظم شيفرتهم باستخدامه أكبر شريحة منفردة.

  - key: ai_usage.ai_sentiment.takeaway.devs2026
    t: |

      قد يبدو اختزال المواقف من الذكاء الاصطناعي في طيف مؤيد/معارض تبسيطًا مفرطًا، لكن البيانات الناتجة تكشف مع ذلك عن رؤى مثيرة للاهتمام.

      فعلى سبيل المثال، لا يقتصر ارتباط شعورك تجاه الذكاء الاصطناعي بموقفك من التقنية عمومًا، بل يرتبط بقوة أيضًا بعوامل أخرى مثل موقعك على **الطيف السياسي**؛ إذ يميل المشاركون المؤيدون للذكاء الاصطناعي أكثر إلى **اليمين**.

  - key: ai_usage.ai_risks.takeaway.devs2026
    t: |

      يتصدر [**الأثر البيئي**]{@$block.environmental_impact} قائمة المخاوف بشأن الذكاء الاصطناعي، ويبدو أنه، مثل القضايا البيئية الأخرى، أصبح مسيّسًا ويرتبط بقوة بتعريف المشاركين لأنفسهم بأنهم أكثر ميلًا إلى اليسار.

  - key: ai_usage.ai_management_pressure.takeaway.devs2026
    t: |

      إلى جانب فائدة الذكاء الاصطناعي الفعلية للمطورين، تؤدي الشركات دورًا كبيرًا أيضًا في تشجيع استخدامه على نطاق أوسع.

      لكن الحماس للذكاء الاصطناعي لا يخلو من سلبيات؛ فالتشدد في تطبيق إجراءات مثل الحصص أو لوحات المتصدرين قد يؤثر سلبًا في **الرضا الوظيفي** و**الحالة النفسية** للموظفين.

  - key: ai_usage.ai_mental_state.takeaway.devs2026
    t: |

      قد تجعلنا أدوات الذكاء الاصطناعي أكثر إنتاجية، لكنها لا تبدو قادرة على جعلنا أكثر سعادة. فبينما ظل كثيرون محايدين، أبدت شريحة كبيرة من المشاركين أسفها لتأثيره السلبي في حالتهم النفسية، وارتبط ذلك بالشعور [**بالإرهاق**]{@tech_emotion_by_ai_mental_state_1.exhausted} و[**خيبة الأمل**]{@tech_emotion_by_ai_mental_state_1.disillusioned} تجاه قطاع التقنية عمومًا.

      وفي المقابل، كان الشعور الأكثر شيوعًا لدى من أفادوا بتأثير إيجابي في حالتهم النفسية هو [**الفضول**]{@tech_emotion_by_ai_mental_state_2.curious}، رغم أن الشعور [**بالإرهاق الشديد**]{@tech_emotion_by_ai_mental_state_2.overwhelmed} كان شائعًا إلى حد ما حتى بين هذه المجموعة.

  - key: ai_usage.ai_outlook.takeaway.devs2026
    t: |

      انقسمت الإجابات المفتوحة للمشاركين عن هذا السؤال تقريبًا إلى خمس فئات رئيسية: مخاطر الذكاء الاصطناعي وآثاره، واستخداماته، والمواقف الإيجابية، والمواقف السلبية، والمواقف المحايدة.

      ومن بين هذه الفئات، كان الموضوع الأشيع بفارق كبير هو خطر [**تأثير الذكاء الاصطناعي في المطورين**]{@$block.ai_developer_impact}، الذي يجمع ما يختبره المطورون شخصيًا من عواقب الذكاء الاصطناعي.

      وجاء بعده [**الموقف المعارض للذكاء الاصطناعي**]{@$block.anti_ai_sentiment} عمومًا، بما يشمل الخوف من فقاعة الذكاء الاصطناعي والدعوة إلى مزيد من التنظيم؛ ثم المخاوف بشأن [**تأثيره في القطاع**]{@$block.ai_industry_impact}، بما في ذلك كل التغيرات التي طرأت على منظومة التقنية تحت تأثيره.

  # health
  - key: sections.health.description.devs2026
    t: الصحة واللياقة البدنية.

  - key: health.age.takeaway.devs2026
    t: |
      يُعد العمر أحد أهم *العوامل المربكة* في مجموعة البيانات. أي إنه قد يوحي بوجود علاقة أقوى بين متغيرين آخرين (مثل «عدد الأطفال» و«الدخل السنوي»)، بينما يكون كلاهما في الواقع نتيجة لسبب جذري مشترك.

      ومن النتائج غير المتوقعة أن المشاركين الأكبر سنًا يميلون إلى كتابة نسبة أقل من شيفرتهم باستخدام الذكاء الاصطناعي، لكنهم يميلون أيضًا إلى النظر إلى التقنية بإيجابية أكبر.

  - key: health.disability_status.takeaway.devs2026
    t: |

      يؤثر النوع الاجتماعي والعمر كثيرًا في أنواع الإعاقات التي يواجهها المشاركون، إذ تزداد شيوعًا مع التقدم في العمر [**الإعاقات السمعية**]{@age_vs_disability.range_over_60.hearing_impairments} و[**الأمراض المزمنة**]{@age_vs_disability.range_over_60.chronic_illnesses}.

      وتأكيدًا لما توصلت إليه [دراسات أخرى](https://www.bmj.com/content/385/bmj.q999)، تنتشر الأمراض المزمنة أكثر بين النساء؛ بينما ترتفع نسبة [**حالات التنوع العصبي**]{@$block_vs_gender.non_binary.neurodivergent_conditions} و[**مشكلات الصحة النفسية**]{@$block_vs_gender.non_binary.mental_health_conditions} بين المشاركين غير الثنائيين.

  - key: health.health_issues.takeaway.devs2026
    t: |

      لا يزال سوء النوم المشكلة الصحية الأكثر تأثيرًا في المشاركين.

      عند مقارنة المشكلات الصحية بين الدول، كانت «الأكثر صحة» (استنادًا إلى نسبة المشاركين الذين لم يبلغوا عن أي مشكلة صحية على الإطلاق) هي إيطاليا والنرويج وسويسرا.

      لكن بالطبع، قد يتأثر اعتبار أمر ما مشكلة صحية والإبلاغ عنه بالعوامل الثقافية أيضًا؛ فعلى سبيل المثال، لم يبلغ عن مشكلات نفسية سوى **{@country_vs_health_issues.RUS.mental_health_issues}** من المشاركين المقيمين في روسيا، وهي نسبة أقل بكثير من نسبة {@country_vs_health_issues.overall.mental_health_issues} بين جميع المشاركين في الاستطلاع.

  - key: health.sleep_quantity.takeaway.devs2026
    t: |

      رغم شيوع قلة النوم بوصفها مشكلة صحية، فإن عدد ساعات النوم الفعلي متقارب بشكل ملحوظ في مجموعة البيانات؛ إذ ينام **{@$block.range_6+range_7+range_8}** من المشاركين بين 6 و8 ساعات في الليلة، مع انخفاض طفيف في هذه المدة مع التقدم في العمر.

  # worldview

  - key: sections.worldview.description.devs2026
    t: النظرة إلى العالم والسياسة والأحداث الجارية.

  - key: worldview.global_issues.takeaway.devs2026
    t: |

      ليس من المستغرب أن تذكر الدول الأوروبية التي شهدت مؤخرًا إحدى أشد موجات الحر في المنطقة [**تغير المناخ**]{@$block.climate_change} بوصفه أحد أبرز المخاوف.

      ومن المخاوف الكبرى الأخرى [**تصاعد النزعة السلطوية**]{@$block.rising_authoritarianism}، لا سيما في دول مثل السويد والولايات المتحدة وفرنسا وألمانيا، حيث تقترب أحزاب اليمين المتطرف من السلطة أو تشارك فيها.

      ويؤدي العمر دورًا هنا أيضًا، إذ يزداد قلق المشاركين الأصغر سنًا بشأن [**التوترات الجيوسياسية**]{@age_vs_global_issues.range_under_20.geopolitical_tensions}.

      وكما هو متوقع، تتبع كثير من هذه القضايا انقسامًا سياسيًا حادًا: إذ يتراجع القلق بشأن [**تغير المناخ**]{@political_spectrum_vs_global_issues.5.climate_change} بشدة عند تجاوز منتصف الطيف السياسي، ليحل محله القلق بشأن أمور مثل [**التوترات الجيوسياسية**]{@political_spectrum_vs_global_issues.8.geopolitical_tensions}، و[**تآكل القيم التقليدية**]{@political_spectrum_vs_global_issues.8.erosion_traditional_values}، و[**غياب حرية التعبير**]{@political_spectrum_vs_global_issues.8.lack_of_free_speech}.

  - key: worldview.political_expression_at_work.takeaway.devs2026
    t: |

      رغم حماية حرية التعبير في معظم الدول، فإن ذلك لا يعني دائمًا الشعور بالارتياح الكافي للتعبير عن آرائك، كما يتضح من [**الولايات المتحدة**]{@political_expression_at_work_vs_country.USA} التي [حلت في المرتبة 17]{@political_expression_at_work_vs_country.USA.average} في هذا الجانب.

      ومن المثير للاهتمام أيضًا أن المشاركين ذوي الميول اليمينية أقل ارتياحًا عمومًا للتعبير عن آرائهم السياسية في العمل.

  - key: worldview.workers_union.takeaway.devs2026
    t: |

      في وقت يهدد فيه الذكاء الاصطناعي الأمان الوظيفي في قطاع التقنية، قد توفر النقابات العمالية وسيلة لإعادة بعض القوة إلى الموظفين، رغم أن هذه الفكرة تبدو أكثر شعبية بكثير لدى اليسار منها لدى اليمين.

      وعند مقارنة الدول، تبرز [**السويد**]{@workers_union_vs_country.SWE.yes} بوصفها الدولة الوحيدة التي ينتمي فيها معظم المشاركين بالفعل إلى نقابة، بينما تحتل [**الولايات المتحدة**]{@workers_union_vs_country.USA.no_but_interested} المرتبة الأولى بين المشاركين غير المنتمين حاليًا إلى نقابة لكنهم يرغبون في الانضمام إليها.

  - key: worldview.political_spectrum.takeaway.devs2026
    t: |

      لا شك أن اختزال ميول الفرد السياسية في طيف من اليسار إلى اليمين ينطوي على بعض التبسيط؛ فضلًا عن أن الآراء نفسها قد تُعد يمينية في دولة ويسارية في أخرى.

      لكن يظل من المثير للاهتمام معرفة كيف يعرّف المشاركون ميولهم، والعوامل المرتبطة بالميل إلى اليسار (كالقلق من تصاعد التعصب وتغير المناخ) أو اليمين (كالقلق من تآكل القيم التقليدية وتأييد الذكاء الاصطناعي).

  - key: worldview.tech_industry_emotion.takeaway.devs2026
    t: |

      لا يشعر المشاركون بالارتياح تجاه قطاع التقنية في عام 2026؛ إذ تتصدر المشاعر السلبية القائمة، وفي مقدمتها [**الإرهاق**]{@$block.exhausted} و[**خيبة الأمل**]{@$block.disillusioned}.

      ورغم أن [**الفضول**]{@$block.curious} يأتي في المرتبة الثالثة إجمالًا، فإنه يرتبط أيضًا بجوانب أخرى من نظرة المشاركين إلى العالم، مثل تأييد الذكاء الاصطناعي بدرجة أكبر أو الميل السياسي أكثر إلى اليمين.

  - key: worldview.happiness_factors.takeaway.devs2026
    t: |
      لا تزال [**الصحة الجيدة**]{@$block.health} أهم مصدر للسعادة في أنحاء العالم. ويكشف العمر عن نمط آخر أيضًا: فكلما تقدم المشاركون في السن، تميل [**الصداقات**]{@age_vs_happiness_factors.range_20_29.other_relationships} و[**الهوايات**]{@age_vs_happiness_factors.range_20_29.hobbies} إلى إفساح المجال تدريجيًا لـ[**الأسرة**]{@age_vs_happiness_factors.range_over_60.family} بوصفها مصدرًا للسعادة.

  - key: worldview.relocation.takeaway.devs2026
    t: |

      لا تزال [**اليابان**]{@$block.JPN} و[**كندا**]{@$block.CAN} الوجهتين الأكثر شعبية بين الأماكن التي يرغب المشاركون في الانتقال إليها إذا أتيحت لهم الفرصة.

      أما [**الولايات المتحدة**]{@$block.USA}، التي طالما عُدت الوجهة الأكثر جاذبية للعاملين في التقنية، [فتأتي في المرتبة الخامسة فقط]{@$block.USA} (بعد استبعاد المشاركين المقيمين فيها بالفعل). وقد تؤدي العوامل السياسية دورًا، كما تشير الارتباطات مع **الميول اليمينية** و**تأييد الذكاء الاصطناعي**.

  - key: worldview.overall_happiness.takeaway.devs2026
    t: |

      في نهاية المطاف، يعتمد قدر كبير من سعادتنا على امتلاك وظيفة جيدة وآمنة، وعلى التمتع بصحة جيدة جسديًا ونفسيًا.

      لكن الذكاء الاصطناعي يهدد المطورين على الجبهتين، إذ يسهم في التوتر والإرهاق ويعرض الأمان الوظيفي للخطر، ما يفسر زيادة عدد المشاركين غير السعداء مقارنةً بعام 2025.

    aliases:
      - happiness.overall_happiness.takeaway.devs2026

  # hobbies

  - key: sections.hobbies.description.devs2026
    t: الهوايات والاهتمامات.

  - key: hobbies.hobbies.takeaway.devs2026
    t: |

      رغم أننا جميعًا نقول إن علينا القراءة أكثر، فإن القراءة هي الهواية الأولى لدى [**النساء**]{@gender_vs_hobbies.female.reading} والمشاركين [**فوق الستين**]{@age_vs_hobbies.range_over_60.reading}.

      وفي المقابل، تتصدر [**ألعاب الفيديو**]{@$block.video_games} القائمة، تليها [**الأفلام والتلفزيون**]{@$block.movies_tv}.

  - key: hobbies.physical_activity.takeaway.devs2026
    t: |

      تكشف مقارنة الدول عن تفضيلات متباينة جدًا فيما يتعلق بالنشاط البدني.

      يمارس {@country_vs_physical_activity.ISR.strength_training} من المشاركين [**الإسرائيليين**]{@country_vs_physical_activity.ISR} [**تمارين القوة**]{@$block.strength_training}، بينما تنخفض النسبة إلى {@country_vs_physical_activity.FRA.strength_training} في [**فرنسا**]{@country_vs_physical_activity.FRA}. وفي المقابل، لا تزال [**هولندا**]{@country_vs_physical_activity.NLD} المنبسطة نسبيًا تتصدر الترتيب في [**التسلق**]{@country_vs_physical_activity.NLD.climbing}.

  - key: hobbies.favorite_beverages.takeaway.devs2026
    t: |

      بما أن إحدى أشهر لغات البرمجة في العالم تحمل اسم نوع من القهوة، فليس من المستغرب أن يتصدر هذا المشروب الشائع القائمة.

  - key: hobbies.favorite_books.takeaway.devs2026
    t: |

      لا شك أن [**Dungeon Crawler Carl**]{@$block.dungeon_crawler_carl} هو العنوان الأبرز في ترتيب هذا العام، لكن القائمة كاملة تستحق الاطلاع عليها لاختيار كتابك التالي!

  - key: hobbies.favorite_video_games.takeaway.devs2026
    t: |

      تستحق [**Clair Obscur: Expedition 33**]{@$block.clair_obscur_expedition_33} بجدارة المركز الأول، منتزعةً من [**Baldur's Gate 3**]{@$block.baldurs_gate} لقب اللعبة الأكثر شعبية لهذا العام.

  - key: hobbies.video_game_platforms.takeaway.devs2026
    t: |

      بينما تظل [**ألعاب الحاسوب**]{@$block.pc} في الصدارة، تواصل أجهزة [**Switch**]{@$block.nintendo_switch} (الإصداران 1 و2) إثبات قدرتها المذهلة على الاستمرار.

  # metadata

  - key: _user.metadata.source.takeaway.devs2026
    t: |

      رغم أن غالبية المشاركين أتوا من جمهورنا الحالي وقائمتنا البريدية، فقد ساهمت أيضًا إشارة **Josh Comeau** إلى الاستطلاع في نشرته البريدية في زيادة المشاركة كثيرًا.

      وعند النظر إلى توزيع المشاركين حسب النوع الاجتماعي لكل مصدر، أثبتت [طريقة أخذ العينات التراكمية](https://github.com/Devographics/surveys/issues/258) فعاليتها في تشجيع مزيد من النساء على المشاركة، وكذلك رعاية صانعات محتوى مثل [Cassidy Williams](https://cassidoo.co/)، التي عرضت الاستطلاع في نشرتها الأسبوعية.
    aliases:
      - user.metadata.source.takeaway.devs2026

