  # FAQ

  - key: faq.who_should_take_survey_devs
    t: من ينبغي له المشاركة في هذا الاستطلاع؟
  - key: faq.who_should_take_survey_devs.description
    t: >
      هذا الاستطلاع مخصص لكل من يعمل أو يدرس في مجال التطوير أو البرمجة أو الهندسة، مهما كان مستوى خبرته أو خلفيته.

  - key: faq.survey_goals_devs
    t: ما أهداف هذا الاستطلاع؟
  - key: faq.survey_goals_devs.description
    t: >
      يهدف هذا الاستطلاع إلى تكوين صورة أشمل عن منظومة المطورين تتجاوز الاتجاهات التقنية البحتة.

  - key: faq.data_used_devs
    t: كيف ستُستخدم البيانات التي جُمعت؟
  - key: faq.data_used_devs.description
    t: >
      سيُنشر تقرير مفصل يستند إلى البيانات المجموعة ويكون متاحًا مجانًا. كما ستتوفر مجموعة البيانات كاملةً مجانًا [عند الطلب](https://discord.gg/2E7bbgnrJJ).

