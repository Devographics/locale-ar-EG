  ###########################################################################
  # General
  ###########################################################################

  - key: general.state_of_devs.description
    t: استطلاع المطورين عن كل ما عدا ذلك.

  - key: general.state_of_devs.intro
    t: |
      بينما يُعدّ السؤال عن إطار عمل جافا سكريبت المفضل لديك مرارًا وتكرارًا أمرًا جيدًا، فقد رأينا أنه قد حان الوقت لتناول الأسئلة الأكبر في الحياة: من أنت؟ ماذا تفعل إلى جانب البرمجة؟ وماذا تؤمن به وتأمل؟

      هذا هو جوهر استطلاع حالة المطورين. هذه المرة، يتناول كل ما ليس برمجة.

  - key: tools.tools_intro.ai2025
    t: |
      يدور هذا الجزء الأول من الاستطلاع حول أدوات الذكاء الاصطناعي التي تستخدمها أو سمعت عنها.

