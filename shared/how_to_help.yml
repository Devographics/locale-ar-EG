locale: ar-EG
translations:

  - key: how_to_help.content
    t: >
      على الرغم من أن مشروع "حالة جافا سكريبت وسي إس إس" يحقق بعض الإيرادات، إلا أنه لا يزال يعتمد بشكل أساسي على العمل التطوعي. إذا كنت ترغب في الانضمام إلى المشروع والمساعدة، فإليك بعض الأمور التي نحتاج فيها دائمًا إلى المساعدة. 

      ### ترجمة

       تُرجمت الاستبيانات الآن إلى أكثر من 20 لغة، لكن الكثير من الترجمات غير مكتملة أو قديمة. إذا كنت ترغب بالمساعدة، انضم إلى خادمنا على ديسكورد (https://discord.gg/tuWRUWVyJs) وأضف اسم مستخدمك على جيت هاب في قناة **#translations**. 

      ### التواصل

      ليس سراً أن جمهور استطلاعات رأي المطورين يميل عموماً إلى أن يكون من الذكور البيض المقيمين في الولايات المتحدة. إذا كنتم ترغبون في مساعدتنا على تحقيق توازن أكبر، فنحن بحاجة ماسة إلى دعمكم!

      تشمل جهود التوعية التواصل مع المنظمات التي تُعنى بمساعدة الفئات المهمشة على التعامل مع عالم التكنولوجيا، ونشر روابط الاستبيان في مختلف المنتديات الإلكترونية، وإرسال رسائل بريد إلكتروني إلى المدونات والمجلات للتعريف بالاستبيان، والسعي عمومًا لتنويع جمهور الاستبيان. إذا كنت ترغب في المساعدة، انضم إلى قناة **#outreach** على خادم Discord الخاص بنا (يمكنك كتم صوت جميع القنوات الأخرى إن شئت).

      على وجه التحديد، نود الحصول على بعض المساعدة في التواصل مع المنظمات التي تركز على:


      - مطورو BIPOC
      

      - مطورو برامج من مجتمع LGBTQ+
      

      - مطورات أعمال
      

      - مطورون من ذوي الإعاقة
      

      - المطورون في البلدان الأقل تمثيلاً (الصين، البرازيل، الهند، اليابان، إلخ).


      ### الكتابة والتحليل

      رغم سعينا الدؤوب لتقديم رؤى قيّمة كل عام، ندرك استحالة تغطية كل شيء في تقرير واحد. إذا كنتَ عالم بيانات أو مهتمًا فقط بالاتجاهات التقنية، يسعدنا أن نرى تحليلك الخاص لبياناتنا! ستكون هذه فرصة رائعة لإثراء الحوار حول الاستطلاع، لا سيما فيما يتعلق بتسليط الضوء على المجتمعات المهمشة كالمجتمعات المذكورة آنفًا.

      يمكنك إما استخدام ميزة تخصيص المخطط (أيقونة القلم بجوار بعض المخططات) و[واجهة برمجة تطبيقات GraphQL العامة](https://api.stateofjs.com/) لإنشاء تصورات جديدة، أو [الانضمام إلى Discord الخاص بنا](https://discord.gg/tuWRUWVyJs) والتواصل معنا لطلب مجموعة بيانات JSON الكاملة. 

      ### ترميز

       جميع قواعد بياناتنا مفتوحة المصدر، ونرحب بالمساهمات. أقترح أولاً [التعرف على كيفية إجراء الاستبيانات](https://dev.to/sachagreif/how-the-state-of-js-css-surveys-are-run-4lnb)، ثم [الانضمام إلى خادم Discord](https://discord.gg/tuWRUWVyJs) لإخباري بما ترغب في العمل عليه. 

      ### الصفقات والشراكات

      في المستقبل، نرغب في استكشاف إمكانية تقديم عروض أو خصومات على المنتجات للمشاركين في استطلاعاتنا كوسيلة لمكافأة المشاركين وتحفيز جماهير جديدة على المشاركة في الاستطلاع.

      ## الدعم المالي

      #### المنح والتمويل

      بالطبع، هناك طريقة أخرى للمساعدة وهي ببساطة توفير التمويل. على سبيل المثال، بفضل منحة تلقيناها من جوجل، تمكنا من توظيف خبير لإجراء تدقيق شامل لإمكانية الوصول إلى المشروع.

      #### رعاية المخططات

      إذا كنت ترغب في دعم الاستطلاع على نطاق أصغر، يمكنك الآن أيضًا

      الموارد الموصى بها

      إذا أنشأت محتوىً ذا صلة بجمهورنا، يمكنك أيضًا شراء أحد روابط "الموارد الموصى بها" المعروضة أسفل كل صفحة. كما نوفر هذه المساحات مجانًا لـ

      الموارد الموصى بها
      رعاية قوائم الأغاني
      خصومات
      شراكات أخرى

            ### ملاحظة حول العمل بأجر

      لقد تحدثتُ هنا بشكل أساسي عن العمل التطوعي، ولكن لدينا أيضًا ميزانية صغيرة لدفع أجور الاستشاريين أو الخبراء، ونسعى جاهدين لإيجاد شركاء لدعم المزيد من الأعمال. وبشكل أكثر تحديدًا، نُفضّل الدفع مقابل المهام التي:


      - محدودة النطاق، لأن الميزانية ستكون محدودة على الأرجح أيضاً.


      - تتطلب **خبرة خاصة** لا يمكن توفيرها بسهولة من قبل المتطوعين.


      - هي **مكتفية ذاتياً** ولا تتطلب الكثير من أعمال المتابعة لأننا قد لا نملك الوقت للقيام بذلك.


      تشمل الأمثلة الجيدة ما يلي: أعمال الرسوم التوضيحية والعلامات التجارية، وعمليات تدقيق سهولة الاستخدام أو إمكانية الوصول، وأعمال تصور البيانات، وأعمال التوعية، وما إلى ذلك.