      تُحفظ هنا العناصر التي تهمك، وستحصل في نهاية الاستطلاع على قائمة بروابط لمعرفة المزيد عنها.

  - key: readinglist.empty
    t: >
      لا توجد عناصر في قائمة القراءة.
      عُد إلى الاستطلاع وأضف الميزات أو المكتبات التي ترغب في معرفة المزيد عنها
      باستخدام زر "+".

  - key: readinglist.autogenerated
    t: >
      لم تضف أي عناصر إلى قائمة القراءة باستخدام زر "+"، لذا أعددنا لك بدلًا من ذلك قائمة موارد تلقائية استنادًا إلى إجاباتك في الاستطلاع.

  - key: readinglist.results
    t: >
      إليك بعض الموارد لمعرفة المزيد عن العناصر في قائمة القراءة.

  - key: readinglist.homepage_link
    t: الصفحة الرئيسية

  - key: readinglist.receive_copy
