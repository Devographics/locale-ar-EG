      أدخل بريدك الإلكتروني لتصلك نسخة من قائمة القراءة مباشرةً إلى صندوق الوارد:
  - key: readinglist.send_by_email
    t: إرسال
  - key: readinglist.email_sent
    t: شكرًا! قائمة القراءة في طريقها إلى صندوق الوارد.

