  - key: readinglist.remove_from_list
    t: أزل من قائمة القراءة

  - key: readinglist.added_to_list
    t: أُضيف “{label}” إلى قائمة القراءة.

  - key: readinglist.title
    t: قائمة القراءة

  - key: readinglist.description
    t: >
      احفظ العناصر هنا باستخدام زر "+"، وستحصل في نهاية الاستطلاع على قائمة بروابط لمعرفة المزيد عنها.

  - key: readinglist.description2
