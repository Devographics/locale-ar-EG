  - key: general.privacy_policy.description
    t: >
      ### 1. جمع البيانات

      بالإضافة إلى البيانات التي نجمعها من خلال أسئلة الاستطلاع، نجمع معلومات عن جهازك ومتصفحك ونظام التشغيل وإصدار المتصفح ومصدر الإحالة.

      يُرجى ملاحظة أن جميع الأسئلة اختيارية تمامًا، ولا نربط مطلقًا أي معلومات تكشف هويتك، مثل عناوين البريد الإلكتروني، بإجاباتك في الاستطلاع.

      ### 2. جمع البريد الإلكتروني

      قد نجمع بريدك الإلكتروني اختياريًا من أجل:


      1. إنشاء رابط تسجيل دخول سحري؛ وبعد ذلك نحذف بريدك الإلكتروني ونحتفظ فقط ببصمة أحادية الاتجاه في قاعدة بيانات المستخدمين.

      2. التواصل معك عند توفر نتائج الاستطلاع، وعند إطلاق نسخ مستقبلية منه، ولإرسال إعلانات متباعدة. يمكنك إلغاء الاشتراك من قائمتنا البريدية في أي وقت، ونحذف بريدك الإلكتروني من سجلاتنا بعد إرساله إلى مزود النشرة البريدية.

      3. إرسال قائمة موجزة بالميزات أو الأدوات التي ترغب في معرفة المزيد عنها. نحذف عنوانك بعد إرسال الرسالة عبر مزود البريد الإلكتروني للمعاملات.


      عندما نجمع بريدك الإلكتروني للأغراض المذكورة أعلاه، لا نربطه أبدًا بإجاباتك في الاستطلاع أو بحساب المستخدم، ولا نخزنه مطلقًا على خوادمنا أو قواعد بياناتنا.

      ### 3. ملفات تعريف الارتباط

      نستخدم ملف تعريف ارتباط لتسجيل الدخول، وقد يستخدم مزود الاستضافة (Vercel) ملف تعريف ارتباط خاصًا به أيضًا. لا نستخدم ملفات تعريف ارتباط أخرى أو تحليلات أو إعلانات على جانب العميل.

      ### 4. استخدام البيانات

      نعالج البيانات ثم نستخدمها لنشر التقارير. كما نتيح مجموعة البيانات كاملةً للعامة.

      ### 5. حذف البيانات/الحساب

      يمكنك مراسلتنا على [hello@stateofjs.com](mailto:hello@stateofjs.com) إذا رغبت في حذف بياناتك كلها أو بعضها.

