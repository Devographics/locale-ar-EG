  ###########################################################################

  - key: readinglist.prompt
    t: >
      اخترت “{option}”. إذا أردت معرفة المزيد عن هذه الميزة في نهاية الاستطلاع، فانقر على رمز "+" في الزاوية أعلاه لإضافتها إلى **قائمة القراءة**.

  - key: readinglist.add_to_list
