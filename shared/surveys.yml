  - key: user_info.gender.snowball_sampling
    t: >
      ### ساعدنا في مشاركة هذا الاستطلاع مع مزيد من النساء!


      نأمل زيادة مشاركة النساء في الاستطلاع. ومن الأساليب التي نجربها، والمعروفة باسم “[أخذ العينات بطريقة كرة الثلج](https://github.com/Devographics/surveys/issues/258)”، أن نطلب من المشاركات مثلك مشاركة رابط الاستطلاع مع مطورات أخريات.


      إذا استطعت المساعدة، يمكنك استخدام رابط المشاركة الخاص التالي لنتابع مدى نجاح هذه المبادرة:

