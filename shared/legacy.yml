    t: هل لديك أسئلة أو وجدت خطأ؟ <a href="{link}" target="_blank">أبلغنا عن المشكلة</a>.
  - key: general.emoji_icons
    t: أيقونات الرموز التعبيرية من <a target="_blank" rel="noreferrer" href="https://icons8.com">Icons8</a>

  # navigation
  - key: general.table_of_contents
    t: جدول المحتويات
  - key: general.all_questions_optional
    t: >
      ملاحظة: جميع الأسئلة اختيارية، ولا يلزم إكمال الاستطلاع بنسبة 100%.
  - key: general.data_is_saved
    t: تُحفظ بياناتك كلما انتقلت إلى القسم السابق أو التالي.
  - key: general.close_nav
    t: إغلاق القائمة
  - key: general.open_nav
    t: فتح القائمة
  - key: general.more_actions
    t: مزيد من الإجراءات
  - key: general.skip_to_content
    t: الانتقال إلى المحتوى

  # thanks
  - key: general.back
    t: رجوع
  - key: general.thanks
    t: >
      شكرًا لإكمال الاستطلاع! حُفظت بياناتك.


      يمكنك أيضًا مساعدتنا في نشر الاستطلاع بمشاركته. فكل مساهمة مهمة، وستساعد في جعل بياناتنا
      أكثر تمثيلًا:
  - key: thanks.learn_more_about
    t: "بعض الميزات التي قد ترغب في معرفة المزيد عنها:"
  - key: thanks.knowledge_score
    t: درجة المعرفة
  - key: thanks.score_explanation
    t: >
      سمعت عن أو استخدمت <span class="score-number score-number-known">{known}</span> من أصل
      <span class="score-number score-number-total">{total}</span> ميزة وردت في الاستطلاع، وهذا
      يضعك ضمن أعلى <span class="score-number score-number-ranking">{knowledgeRankingFromTop}%</span>
      من جميع المشاركين.
  - key: thanks.share_on_twitter
    t: المشاركة على Twitter
  - key: thanks.share_score_message
    t: >
      حصلت على درجة معرفة {score}% في استطلاع #{hashtag} لهذا العام! شارك في الاستطلاع من هنا: {shareUrl}
  # share
  - key: general.share_subject
    t: >
      استطلاع {surveyName}
  - key: general.share_text
    t: >
      استطلاع {surveyName} لهذا العام مفتوح الآن! {link}

  # forms
  - key: forms.select_option
    t: اختر خيارًا
  - key: forms.clear_field
    t: مسح السؤال

  # partners
  - key: sponsors.our_partners
    t: شركاؤنا
  - key: sponsors.become_partner
    t: كن شريكًا

  # 404
  - key: notfound.title
    t: 404 غير موجود
  - key: notfound.description
    t: عذرًا، لم نتمكن من العثور على ما تبحث عنه.

  # other
  - key: general.join_discord
    t: انضم إلينا على <a href="{link}">Discord</a>.
  - key: general.translator_mode
    t: اضغط على Option/Alt لتمكين وضع الترجمة.
  - key: general.charts_nivo
    t: رسوم بيانية مبنية باستخدام <a href="{link}">Nivo</a>.
  - key: general.made_by_devographics
    t: من إعداد <a href="{link}">Devographics</a>

