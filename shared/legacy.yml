  ###########################################################################
  # General
  ###########################################################################

  # homepage
  - key: general.why_create_account
    t: لماذا أحتاج إلى إنشاء حساب؟
  - key: general.create_account_reasons
    t: >
      نطلب منك إنشاء حساب من أجل:

      - تجنب الإجابات المكررة

      - إتاحة الوصول إلى بياناتك

      - حفظ جلستك أثناء تقدمك

      - إعلامك عند نشر النتائج
  - key: general.survey_closed_detailed
    t: >
      عذرًا، أُغلق الاستطلاع الآن! لا يزال بإمكانك مراجعة بياناتك، لكن لن تتمكن من تعديلها.
  - key: general.survey_read_only
    t: >
      أنت تشاهد هذا الاستطلاع حاليًا في وضع القراءة فقط.
  - key: general.survey_preview
    t: >
      هذا الاستطلاع في وضع المعاينة. قد تتغير أسئلته، وستُحذف جميع
      البيانات المُدخلة عند بدء الاستطلاع الفعلي.

  - key: general.survey_read_only_back
    t: >
      <a href="{link}">عُد</a> إلى صفحة الاستطلاع الرئيسية لبدء جلسة أو استئنافها.
  - key: general.take_survey
    t: شارك في استطلاع {name}

  # surveys
  - key: general.open_surveys
    t: الاستطلاعات المفتوحة
  - key: general.no_open_surveys
    t: لا توجد استطلاعات مفتوحة حاليًا.
  - key: general.closed_surveys
    t: الاستطلاعات المغلقة
  - key: general.no_closed_surveys
    t: لا توجد استطلاعات مغلقة حاليًا.
  - key: general.preview_surveys
    t: استطلاعات المعاينة
  - key: general.no_preview_surveys.legacy
    t: لا توجد استطلاعات متاحة للمعاينة.
  - key: general.start_survey
    t: ابدأ الاستطلاع »
  - key: general.continue_survey
    t: تابع الاستطلاع »
  - key: general.review_survey
    t: راجع الاستطلاع »
  - key: general.preview_survey
    t: عاين الاستطلاع »
  - key: general.finish_survey
    t: إنهاء الاستطلاع
