    t: أُضيف حديثًا هذا العام
  - key: general.new
    t: جديد
  - key: general.devographics_banner
    t: <a href="https://www.devographics.com/" target="_blank">Devographics</a> هو الاسم الجديد للمجموعة التي تدير استطلاعات حالة JavaScript وCSS وGraphQL.

