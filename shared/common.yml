      من بين {total} ميزة وردت في الاستطلاع،
      استخدمت {usage_count} منها وسمعت عن {awareness_count} أخرى،
      ما يضعك ضمن أعلى {knowledgeRankingFromTop} من المشاركين.
      أحسنت!
  - key: thanks.score_statistics_noranking
    t: >
      من بين {total} ميزة وردت في الاستطلاع،
      استخدمت {usage_count} منها وسمعت عن {awareness_count} أخرى.
      أحسنت!
  - key: thanks.points
    t: >
      نقطة
  - key: thanks.score_awareness_explanation
    t: >
      لضمان الإنصاف، تُحسب هذه النسبة بناءً على الميزات الـ{awareness_total} التي استطعت تحديد معرفتك بها
  - key: thanks.share_on_twitter
    t: شارك على تويتر
  - key: thanks.share_on_x
