  # tools quadrant
  - key: blocks.tools_quadrant
    t: الرضا مقابل الاستخدام
    aliases:
      - tools.scatterplot_overview
      - libraries.scatterplot_overview
  - key: blocks.tools_quadrant.description
    t: |
      يعرض هذا الرسم البياني **نسبة استبقاء** كل تقنية مقارنةً بإجمالي **عدد مستخدميها**.
      ويمكن تقسيمه إلى أربعة أرباع:

        - **1**: استخدام منخفض واستبقاء مرتفع. تقنيات تستحق المتابعة.

        - **2**: استخدام واستبقاء مرتفعان. تقنيات آمنة للاعتماد عليها.

        - **3**: استخدام واستبقاء منخفضان. يصعب التوصية بهذه التقنيات حاليًا.

        - **4**: استخدام مرتفع واستبقاء منخفض. أعد تقييم هذه التقنيات إذا كنت تستخدمها حاليًا.

