  # tools arrows
  - key: blocks.tools_arrows
    t: التغيرات بمرور الوقت
  - key: blocks.tools_arrows.description
    t: |
      يمتد كل خط من أقدم سنة تتوفر عنها بيانات إلى أحدثها. تشير النقطة الأعلى إلى أن عددًا أكبر من الأشخاص استخدموا التقنية،
      وتشير النقطة الأبعد إلى اليمين إلى أن مزيدًا من المستخدمين يرغبون في تعلمها أو استخدموها ويرغبون في استخدامها مجددًا.
  - key: blocks.tools_arrows.note
    t: |
      - تتخطى بعض الخطوط سنوات.
      - لا تظهر التقنيات التي تتوفر بياناتها لسنة واحدة فقط.
      - معادلة سرعة التغير = (أحدث انطباع - أقدم انطباع) + (أحدث استخدام) - (أقدم استخدام)
      - تعني سرعة التغير الإيجابية زيادة الاستخدام و/أو الانطباعات الإيجابية بمرور الوقت.

