  - key: sponsors.neon.description
    t: أطلق العنان لتطبيقات الذكاء الاصطناعي المتطورة باستخدام Postgres.

  - key: sponsors.frontendmasters.description
    t: طوّر مهاراتك من خلال دورات متعمقة وحديثة في هندسة الواجهات الأمامية.

  - key: sponsors.polypane.description
    t: المتصفح للمطورين الطموحين. أنشئ مواقع متجاوبة وسهلة الوصول وسريعة بكل سهولة.

  - key: sponsors.nijibox.description
    t: استشارات تجربة المستخدم وتطوير المنتجات في قلب طوكيو.

  - key: sponsors.renderatl.description
    t: أكبر مؤتمر تقني يضم مسارًا مخصصًا للتصميم وCSS.

  - key: sponsors.google_chrome.description
    t: شكرًا لفريق Google Chrome على دعم عملنا.

  - key: sponsors.tokyodev.description
    t: اعثر اليوم على وظيفة أحلامك كمطور في اليابان.

  - key: sponsors.gitnation.description
    t: تعرّف على أحدث الاتجاهات مباشرةً من أوائل المتبنين ومؤلفي المحتوى التقني.

  - key: sponsors.algolia.description
    t: انشر بحثًا سريعًا وقابلًا للتوسع ومدعومًا بالذكاء الاصطناعي في أي مكان، مع تصميم Algolia المعتمد على API أولًا.

  - key: sponsors.storyblok.description
    t: حقق أثرًا أكبر وأسرع في السوق باستخدام نظام إدارة المحتوى الذي يترك لك حرية العمل.

  - key: sponsors.jetbrains.description
    t: مجموعة متكاملة من الأدوات التي توفر تجربة استثنائية للمطورين.

  - key: sponsors.webstorm.description
    t: اكتب الشيفرة بإنتاجية أكبر مع بيئة تطوير JavaScript المتكاملة التي توفر كل ما تحتاج إليه.

  - key: sponsors.sentry.description
    t: منصة مراقبة التطبيقات المفضلة لدى المطورين حول العالم.

  - key: sponsors.clerk.description
    t: مصادقة متكاملة وإدارة للمستخدمين تساعدك على الإطلاق بسرعة والتوسع بسهولة.

  - key: sponsors.certificates_dev.description
    t: شهادات للمطورين أُعدت بالتعاون مع مبتكري أطر العمل أنفسهم.

  - key: sponsors.reactsummit.description
    t: أكبر مؤتمر React في العالم. واكب الاتجاهات مع أكثر من 50 متحدثًا، وتواصل واحتفل مع 1500 مطور، واستمتع بصيف أمستردام وغير ذلك الكثير!

  - key: sponsors.reactparis.description
    t: مؤتمر React الرائد الذي يمتد يومين بمسار واحد، ولا ينبغي أن تفوته في عام 2025.

  - key: sponsors.nhost.description
    t: >
      Nhost بديل مفتوح المصدر لـ Firebase مزود بـ GraphQL.

  - key: sponsors.apollo.description
    t: >
      تمكّن البنية الفائقة من Apollo فرق المنتجات والهندسة من إنشاء تجارب مذهلة لعملائها بسرعة.

  - key: sponsors.the_guild.description
    t: >
      توفر أدوات The Guild مفتوحة المصدر ومنظومتها كل ما تحتاج إليه لتطوير واجهات API الخاصة بك.

  - key: sponsors.hasura.description
    t: >
      شغّل Hasura محليًا أو على السحابة، واربطها بقواعد بياناتك الجديدة أو الحالية لتحصل فورًا على واجهة GraphQL جاهزة للإنتاج.

  - key: sponsors.graphql_wtf.description
    t: >
      تعلّم شيئًا جديدًا عن GraphQL كل أسبوع. تصلك الحلقات الجديدة مباشرةً إلى بريدك الوارد.

  - key: sponsors.grafbase.description
    t: >
      أنظمة خلفية فورية لـ GraphQL دون خوادم. توفر Grafbase أفضل تجربة للمطورين لنشر واجهات GraphQL.

  - key: sponsors.cybozu.description
    t: >
      مطورو Kintone، الحل الرائد في اليابان لإنشاء التطبيقات دون كتابة شيفرة.

  # midpage sponsors blocks

  - key: tokyodev.relocation
    t: |
      اعثر على عمل في اليابان

  - key: tokyodev.relocation.description
    t: |
      ليس الانتقال إلى اليابان مجرد حلم. تغطي دورة TokyoDev المكثفة للمطورين الراغبين في الانتقال إلى اليابان نقاط مثل طبيعة العمل في شركة يابانية، والراتب المتوقع، وأنواع التأشيرات المتاحة ومدى صعوبة الحصول عليها.

  - key: frontendmasters.learning_path
    t: |
      طريقك لتصبح مطور ويب خبيرًا

  - key: frontendmasters.learning_path.description
    t: |
      هل تريد تطوير مسيرتك المهنية؟ تعمق في JavaScript وReact وأداء الويب وCSS ونشر المواقع وTypeScript والبرمجة الوظيفية لتنتقل اليوم من مستوى مبتدئ إلى خبير.

  - key: storyblok.technologies
    t: React؟ Vue؟ Astro؟ JS؟

  - key: storyblok.technologies.description
    t: |
      لا يهم، فنحن نتحدث JSON. Storyblok نظام إدارة محتوى منفصل يعمل مع جميع أطر العمل والمنصات الحديثة، ما يمنحك حرية اختيار الأنسب لمشروعك. ابدأ خلال دقائق!