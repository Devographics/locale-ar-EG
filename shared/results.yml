  - key: explorer.count_details.2
    t: |
      اختار **{yAxisPercentage}%** من المشاركين في «{yAxisLabel}» الإجابة «{yAnswerLabel}».

  - key: explorer.count_details.3
    t: |
      عند تطبيق هذه النسبة على عدد المشاركين السابق البالغ **{xAxisTotal}**
      نحصل على خط أساس متوقع قدره **{normalizedCount}** مشاركًا في هذا التقاطع.

  - key: explorer.count_details.4_extra
    t: |
      العدد الفعلي هو **{cellCount}**، وقد تم *تمييز* هؤلاء المشاركين الإضافيين وعددهم **{normalizedCountDelta}**.

  - key: explorer.count_details.4_missing
    t: |
      العدد الفعلي هو **{cellCount}**، ويظهر هؤلاء المشاركون الناقصون وعددهم **{normalizedCountDelta}** كنقاط فارغة.

  - key: explorer.percentage_details.1_extra
    t: |
      إجمالًا، اختار **{xAxisPercentage}%** من المشاركين في «{xAxisLabel}» الإجابة «{xAnswerLabel}»،
      لكن ترتفع هذه النسبة إلى **{bucketPercentage}%** بين **المشاركين في «{yAxisLabel}» الذين اختاروا «{yAnswerLabel}»**.

  - key: explorer.percentage_details.1_missing
    t: |
      إجمالًا، اختار **{xAxisPercentage}%** من المشاركين في «{xAxisLabel}» الإجابة «{xAnswerLabel}»،
      لكن تنخفض هذه النسبة إلى **{bucketPercentage}%** بين **المشاركين في «{yAxisLabel}» الذين اختاروا «{yAnswerLabel}»**.

  - key: explorer.percentage_details.2_extra
    t: |
      تم *تمييز* هؤلاء المشاركين الإضافيين، ونسبتهم **{normalizedPercentageDelta}%**.

  - key: explorer.percentage_details.2_missing
    t: |
      يظهر هؤلاء المشاركون الناقصون، ونسبتهم **{normalizedPercentageDelta}%**، كنقاط فارغة.

  # - key: explorer.percentage_details.1
  #   t: |
  #     **{xAxisPercentage}%** of **{xAxisTotal}** “{xAxisLabel}” respondents selected “{xAnswerLabel}”.

  # - key: explorer.percentage_details.2
  #   t: |
  #       **{yAxisPercentage}%** of “{yAxisLabel}” respondents selected “{yAnswerLabel}”.

  # - key: explorer.percentage_details.3
  #   t: |
  #       Applying that percentage to the previous **{xAxisTotal}** respondents figure
  #       gives us an expected baseline of **{normalizedPercentage}%** of respondents in this intersection.

  # - key: explorer.percentage_details.4_extra
  #   t: |
  #       The actual percentage is **{bucketPercentage}%**, and those extra **{normalizedPercentageDelta}%** respondents are *highlighted*.

  # - key: explorer.percentage_details.4_missing
  #   t: |
  #       The actual count is **{bucketPercentage}%**, and those missing **{normalizedPercentageDelta}%** respondents appear as empty dots.

  - key: explorer.extra_missing_respondents
    t: |
      ### المشاركون الإضافيون والناقصون

      يهدف الرسم البياني أعلاه إلى تحديد المواضع التي تظهر قيمًا أعلى أو أدنى من المتوقع
      مقارنة بخط أساس محسوب.

      على سبيل المثال، إذا افترضنا وجود 1000 مستخدم لـ CSS Grid وأن 50% من المشاركين يعملون في شركات كبيرة،
      فسنتوقع أن يعمل 500 من مستخدمي CSS Grid في شركات كبيرة.

      قد يشير أي اختلاف عن هذا العدد المتوقع إلى وجود علاقة مهمة بين المتغيرين،
      ويُبرز في الرسم البياني بنقاط ملونة (للمشاركين الإضافيين فوق خط الأساس)
      أو نقاط فارغة (للمشاركين الناقصين).

