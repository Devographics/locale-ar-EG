  ###########################################################################
  # Help
  ###########################################################################

  - key: help.title
    t: >
      ميزة تحت الضوء:

  - key: help.description
    t: تعرّف على المزيد عن ميزات الاستطلاع

  - key: help.correlations
    t: الارتباطات

  - key: help.correlations.description
    t: >
      تساعد هذه الدرجات المنشأة تلقائيًا على إبراز ارتباط عنصرين في مجموعة البيانات، استنادًا إلى مقاييس مثل الحصول على تقييم **أعلى** لسؤال، أو اختيار **عناصر أكثر** لسؤال، أو اختيار **إجابة محددة**.

  - key: help.query_builder
    t: منشئ الاستعلامات

  - key: help.query_builder.description
    t: >
      يتيح لك منشئ الاستعلامات إضافة عوامل تصفية إلى الرسم البياني الحالي للاستعلام تفاعليًا من Devographics API وإنشاء نسخة مخصصة.

  - key: help.export_data
    t: تصدير البيانات

  - key: help.export_data.description
    t: >
      يمكنك تصدير بيانات JSON الخام المستخدمة لإنشاء الرسم البياني، أو الحصول على استعلام GraphQL الذي استُخدم لجلب البيانات.

  - key: help.comments
    t: التعليقات

  - key: help.comments.description
    t: >
      أُتيحت للمشاركين أثناء الاستطلاع إمكانية إبداء ملاحظاتهم على كل سؤال عبر حقل تعليق نصي منفصل واختياري.

  - key: help.freeform_answers
    t: إجابات حرة

  - key: help.freeform_answers.description
    t: >
      تُطابق إجابات الأسئلة ذات الحقول النصية الحرة مع كلمات مفتاحية محددة (في هذه الحالة **{topic}**) عبر مزيج من معالجة البيانات الآلية واليدوية.

  - key: help.boxplot
    t: مخطط الصندوق

  - key: help.boxplot.description
    t: >
      تعرض مخططات الصندوق المئينات 10 و25 و50 (أي **الوسيط**) و75 و90 لمجموعة البيانات. يمكنك أيضًا استخدام عناصر التحكم المدمجة لعرض **المتوسط** (أو **الوسط الحسابي**) بدلًا من ذلك.

  - key: help.stacked_bar
    t: مخطط أعمدة مكدس

  - key: help.stacked_bar.description
    t: >
      يعرض مخطط الأعمدة المكدس سؤالًا، ثم يقسم كل عمود لإظهار كيفية إجابة تلك المجموعة الفرعية عن سؤال آخر. يمكنك استخدام مفتاح الرسم لتبديل الفرز والترتيب.

  - key: help.two_series_scatterplot
    t: مخطط مبعثر

  - key: help.two_series_scatterplot.description
    t: >
      يعرض المخطط المبعثر مجموعة من العناصر على شبكة مع [خط اتجاه](https://www.mathsisfun.com/definitions/trend-line.html)، ويمثل كل محور متغيرًا مختلفًا.

