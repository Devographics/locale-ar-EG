  ###########################################################################
  # Hints
  ###########################################################################

  - key: hints.hint_hint
    t: >
      ستجد تلميحات صغيرة كهذه في أنحاء نتائج الاستطلاع
      لتعرّفك على ميزات وتفاصيل إضافية.

  - key: hints.units_switcher_hint
    t: >
      يمكنك استخدام أداة الاختيار المقسمة أسفل كل لوحة للتبديل
      بين وحدات مختلفة وعرض البيانات نفسها بطريقة أخرى.

  - key: hints.export_hint
    t: >
      تتيح لك علامة التبويب <span class="hint-icon hint-export-button">البيانات</span> عرض البيانات الخام لأي رسم بياني،
      أو عرضها بتنسيق JSON، أو الحصول على استعلام GraphQL يمكنك
      تشغيله على واجهة API العامة.

  - key: hints.completion_hint
    t: >
      بما أن جميع الأسئلة اختيارية، تلقى بعضها إجابات أقل من غيره.
      يوضح مؤشر الإكمال (<span class="hint-completion-indicator">◕</span>) عدد الأشخاص الذين أجابوا عن أي سؤال بالتحديد.

  - key: hints.tool_modal_hint
    t: >
      يمكنك النقر على اسم أي تقنية للاطلاع على تفاصيل إضافية
      ونظرة أعمق على البيانات المرتبطة بها.

  - key: hints.rankings_modes_hint
    t: >
      يمكنك التبديل في رسم «الخبرة بمرور الوقت» بين الاستبقاء والاهتمام والاستخدام والوعي
      للحصول على صورة أشمل عن الفئة.

  - key: hints.sharing_hint
    t: >
      ثبت علميًا أن مشاركة هذا الاستطلاع على Twitter أو Facebook أو عبر البريد الإلكتروني
      تحسن أداءك في البرمجة بنسبة تصل إلى 15%.

  - key: hints.tshirt_hint
    t: >
      ومن النتائج العلمية المؤكدة أيضًا: شراء قميصنا
      سيزيد مهاراتك البرمجية بأكثر من 9000!

  - key: hints.variants_hint
    t: >
      تتضمن بعض الرسوم البيانية علامات تبويب إضافية تعرض تفصيلات مكملة للبيانات نفسها
      أو بيانات ذات صلة. لا تنسَ الاطلاع عليها!

  - key: hints.share_hint
    t: >
      تسهّل علامة التبويب <span class="hint-icon hint-share-button">مشاركة</span> مشاركة أي رسم بياني،
      أو حتى تنزيله كصورة.

  - key: hints.bracket_hint
    t: >
      <span class="hint-bracket"><span class="hint-text">يعرض الرسم البياني التالي نتائج بطولة بنظام الإقصاء تضم 8 مشاركين، حيث طُلب من
      المشاركين اختيار الفائز في كل مواجهة حتى يتبقى فائز واحد.</span><span class="hint-diagram"/></span>

  - key: hints.comments_hint
    t: >
      تتيح لك علامة التبويب <span class="hint-icon hint-comment-button">التعليق</span> الاطلاع على التعليقات التي تركها المشاركون أثناء إكمال الاستطلاع.

  ###########################################################################
  # Sponsor Chart
  ###########################################################################

  - key: sections.sponsor_finish.title
    t: شكرًا

  - key: sponsor.sponsor_finish
    t: >
      شكرًا لدعمك الاستطلاع. من المفترض أن تظهر صورتك الرمزية بجوار الرسم البياني الذي اخترته
      خلال ساعة تقريبًا. إذا لم تظهر، يُرجى [التواصل معنا](mailto:chartsponsor@stateofjs.com).

  - key: sponsor.sponsored_by
    t: >
      تبرع **{name}** بمبلغ **${amount}** لرعاية هذا الرسم البياني

  - key: sponsor.sponsor_button
    t: رعاية هذا الرسم البياني

  - key: sponsor.sponsor_chart.title
    t: رعاية الرسم البياني "{title}"

  - key: sponsor.sponsor_chart.description
    t: >
      ادعم هذا الاستطلاع ماليًا بالتبرع بمبلغ 10 دولارات أو أكثر، واعرض صورتك الرمزية على Twitter بجوار أحد الرسوم البيانية!

  - key: sponsor.chart_id
    t: "معرّف الرسم البياني: "

  - key: sponsor.sponsor_this_chart
    t: رعاية هذا الرسم البياني (${baseAmount}+)

  - key: sponsor.how_it_works.title
    t: كيف يعمل ذلك

  - key: sponsor.how_it_works.description
    t: >
      1. عند **النقر على زر "رعاية هذا الرسم البياني"**، ستُحوّل إلى صفحة الدفع لدى شريكنا [SendOwl](https://www.sendowl.com/).


      2. يمكنك بعد ذلك **تعديل المبلغ** الذي ترغب في التبرع به لدعم الاستطلاع، بدءًا من 10 دولارات أمريكية.


      3. بعد إتمام الدفع، ستتمكن من **إدخال اسم المستخدم على Twitter**.


      4. ستظهر لك صفحة **تنزيل ملف**، ويمكنك تجاهلها بأمان.


      5. سيُعاد بناء الموقع في الخلفية، وسيظهر اسم المستخدم ومبلغ التبرع **بجوار الرسم البياني خلال ساعة**.

  - key: sponsor.faq.title
    t: الأسئلة الشائعة

  - key: sponsor.faq.usage.title
    t: فيمَ سيُستخدم تبرعي؟

  - key: sponsor.faq.usage.description
    t: سيساعد تبرعك في دعم القائمين على الاستطلاع وتوظيف مزيد من المساهمين (كالرسامين وخبراء سهولة الوصول والتنوع وغيرهم).

  - key: sponsor.faq.public.title
    t: هل سيُعلن عن تبرعي؟

  - key: sponsor.faq.public.description
    t: نعم. سيُعرض **اسم المستخدم على Twitter** و**مبلغ التبرع** علنًا بجوار الرسم البياني.

  # - key: sponsor.faq.donation_public.title
