  - key: sponsor.faq.refund.title
    t: ما سياسة استرداد الأموال؟

  - key: sponsor.faq.refund.description
    t: يمكن استرداد جميع التبرعات خلال أسبوع، بعد خصم رسوم المعاملة.

  - key: sponsor.faq.influence.title
    t: هل تؤثر التبرعات في محتوى الاستطلاع؟

  - key: sponsor.faq.influence.description
    t: تُقدّم التبرعات بعد نشر الاستطلاع، ولا يؤثر المتبرعون في محتواه.

  - key: sponsor.faq.feedback.title
    t: أين يمكنني إبداء الملاحظات أو طرح الأسئلة؟

  - key: sponsor.faq.feedback.description
    t: يمكنك فعل ذلك [على GitHub](https://github.com/StateOfJS/Monorepo/issues/69) أو [في خادم Discord](https://discord.gg/tuWRUWVyJs).

