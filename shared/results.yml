  - key: custom_data.details
    t: >

      1. انسخ محتوى حقل "استعلام GraphQL" والصقه في اللوحة الوسطى من [مستكشف GraphQL API](https://graphiql.stateofjs.com/).

      2. عدّل الاستعلام بإضافة **عوامل تصفية** باستخدام الشريط الجانبي الأيسر للمستكشف. احرص على إبقاء بنية البيانات العامة كما هي.

      3. في نافذة المستكشف، انقر زر التشغيل ("تنفيذ الاستعلام").

      4. انسخ نتائج الاستعلام المعدّل (`{ data: … }`) إلى حقل "البيانات المخصصة" أعلاه ثم أرسلها.

  # Tools usage variations
  - key: blocks.tools_usage_variations
    t: اختلافات الاستخدام
  - key: blocks.tools_usage_variations.description
    t: |
      كيف تؤثر عوامل مختلفة، مثل نطاق الراتب وسنوات الخبرة
      أو حجم الشركة، في الاستخدام (أي المشاركون الذين أجابوا
      «سأستخدمه مجددًا» أو «لن أستخدمه مجددًا»).

      يمثل خط الأساس الاستخدام الأساسي لكل أداة، وتمثل الإزاحات الفرق عن خط الأساس في كل نطاق. لنفترض
      أن الاستخدام الإجمالي للأداة X يبلغ 10% من جميع المشاركين (خط الأساس)،
      وأن نسبة المستخدمين ذوي الخبرة من سنة إلى سنتين الذين يستخدمونها تبلغ 13%
      (مقارنةً بجميع المستخدمين ضمن نطاق الخبرة نفسه)، عندها يكون الفرق إيجابيًا بمقدار +3%.
