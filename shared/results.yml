  - key: blocks.tools_experience_ranking.description
    t: ترتيب نسب الاستبقاء والاهتمام والاستخدام والوعي.
  - key: blocks.tools_experience_ranking.note
    t: |
      لا تُدرج التقنيات التي يقل الوعي بها عن 10%. تُعرّف كل نسبة كما يلي:

      - الاستبقاء: **سيستخدمه مجددًا** / (**سيستخدمه مجددًا** + **لن يستخدمه مجددًا**)
      - الاهتمام: **يرغب في التعلم** / (**يرغب في التعلم** + **غير مهتم**)
      - الاستخدام: (**سيستخدمه مجددًا** + **لن يستخدمه مجددًا**) / **الإجمالي**
      - الوعي: (**الإجمالي** - **لم يسمع به من قبل**) / **الإجمالي**

