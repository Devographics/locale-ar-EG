  ###########################################################################
  # Correlations
  ###########################################################################

  - key: correlations.correlations_trigger
    t: عُثر على {count} علاقة ارتباط بمتغيرات أخرى

  # heading

  # note: we need tu support a custom directionLabel for heading such as
  # "correlation for scoring **to the right** on…"

  - key: correlations.heading.trend
    t: |
      الارتباطات مع الحصول على تقييم <span class="correlation-direction">{directionLabel}</span> في **«{questionLabel}»**

  - key: correlations.heading.option
    t: |
      الارتباطات مع اختيار **«{optionLabel}»** لسؤال **«{questionLabel}»**

  - key: correlations.heading.cardinality
    t: |
      الارتباطات مع اختيار عناصر <span class="correlation-direction">أكثر</span> لسؤال **«{questionLabel}»**

  - key: correlations.exclusions
    t: "مستبعدة: "
  - key: correlations.exclusions.description
    t: تُصفّى بعض أزواج الارتباط يدويًا إذا عُدّت واضحة جدًا أو غير ذات صلة.

  - key: correlations.no_correlations
    t: لم يُعثر على ارتباطات.

  - key: correlations.note
    t: |
      تُقارن الأسئلة والإجابات الفردية بعضها ببعض باستخدام [معامل ارتباط الرتب لسبيرمان](https://en.wikipedia.org/wiki/Spearman%27s_rank_correlation_coefficient). لا تُعرض إلا الارتباطات المستندة إلى عدد كافٍ من الإجابات والتي تتجاوز حدًا أدنى للقوة، وقد تُستبعد الارتباطات البديهية تلقائيًا (مثل «السكن في إسبانيا يرتبط بالتحدث بالإسبانية»).

      يُرجى ملاحظة أن [الارتباط لا يعني السببية](https://en.wikipedia.org/wiki/Correlation_does_not_imply_causation)، وأن هذه علاقات خام منشأة تلقائيًا دون [ضبط العوامل الأخرى](https://en.wikipedia.org/wiki/Confounding). ومع مقارنة آلاف الأزواج، قد تكون بعض الارتباطات [ناجمة عن الصدفة](https://en.wikipedia.org/wiki/Multiple_comparisons_problem).

  - key: correlations.takeaway.with_question
    t: |
      ارتباط <span class="correlation-item-content-strength">{strengthLevelLabel}</span> بالحصول على تقييم <span class="correlation-direction">{directionLabel}</span> في **«{questionLabel}»**.
    aliases:
      - correlations.takeaway.shape1
      - correlations.takeaway.shape2
      - correlations.takeaway.shape7

  - key: correlations.takeaway.with_option
    t: |
      ارتباط <span class="correlation-item-content-strength">{strengthLevelLabel}</span> <span class="correlation-direction">{directionLabel}</span> باختيار **«{optionLabel}»** لسؤال **«{questionLabel}»**
    aliases:
      - correlations.takeaway.shape3
      - correlations.takeaway.shape4
      - correlations.takeaway.shape8

  - key: correlations.takeaway.with_cardinality
    t: |
      ارتباط <span class="correlation-item-content-strength">{strengthLevelLabel}</span> باختيار عدد <span class="correlation-direction">{directionLabel}</span> من العناصر لسؤال **«{questionLabel}»**.
    aliases:
      - correlations.takeaway.shape5
      - correlations.takeaway.shape6
      - correlations.takeaway.shape9

