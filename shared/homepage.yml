  # creators
  - key: creators.heading
    t: المبدعون الذين ندعمهم

  - key: creators.description
    t: |
      لا يمكن إجراء استطلاعاتنا إلا بفضل الدعم المستمر من مجتمع المطورين، ومن الطبيعي أن نرد الجميل عندما نستطيع.

      هؤلاء بعض منشئي المحتوى والمنظمات الرائعة التي ندعمها مالياً، في مقابل زيادة الوعي حول الاستطلاعات.

  - key: creators.stephanie_walter.description
    t: |
      ستيفاني والتر باحثة ومصممة وكاتبة بارعة في مجال تجربة المستخدم، تعيش في لوكسمبورغ، ولديها موهبة في جعل المواضيع المعقدة واضحة وسهلة الفهم.

  - key: creators.afor_digital.description
    t: |
      تُعد أفور شخصية رئيسية في مجتمع البث المباشر لتطوير مواقع الويب باللغة الإسبانية، وقد أدى موهبتها في جعل محتوى البرمجة جذابًا إلى نجاحها المستحق.

  - key: creators.shruti_kapoor.description
    t: |
      بين التدوين وإنتاج مقاطع الفيديو على يوتيوب والتحدث في المؤتمرات، وكونها بشكل عام شخصًا رائعًا بكل المقاييس، كانت شروتي ركيزة أساسية في نظام React البيئي لفترة من الوقت الآن.
  
  - key: creators.codebar.description
    t: |
      Codebar هي منظمة رائعة تقوم بتنظيم ورش عمل تكلف عادةً آلاف الدولارات، وتجعلها متاحة مجانًا عبر الإنترنت من أجل بناء مجتمع مطورين أكثر شمولاً.

