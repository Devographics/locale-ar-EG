      ستُنشر جميع البيانات المجموعة علنًا كي يطلع عليها أي مطور أو شركة.
      كما [تستخدم شركات المتصفحات هذه البيانات](https://web.dev/blog/interop-2024) لتحديد مجالات التركيز وإرشاد خططها المستقبلية.

  - key: faq.survey_goals_html2024
    t: ما أهداف هذا الاستطلاع؟
  - key: faq.survey_goals_html2024.description
    t: >
      يهدف الاستطلاع إلى قياس مدى الوعي بميزات HTML وواجهات برمجة تطبيقات المتصفح الجديدة، ومساعدة المطورين على متابعة تطور استخدامها.

  - key: about.content.html2024
    t: |
      أُجري استطلاع حالة HTML لعام 2024 من 12 سبتمبر إلى 5 نوفمبر 2024، وجُمع فيه 5,402 رد.

      صُمم الاستطلاع بالتعاون عبر [نقاش مفتوح على GitHub](https://github.com/Devographics/surveys/issues/246) واجتماعات [مجموعة WebDX المجتمعية](https://www.w3.org/groups/cg/webdx/).

      يتولى [Sacha Greif](https://sachagreif.com/) و[Eric Burel](https://www.lbke.fr/) تشغيل البنية التحتية للاستطلاع، بمساعدة فريق من المساهمين والاستشاريين في المصادر المفتوحة.

      صمم [Christopher Kirk-Nielsen](http://chriskirknielsen.com/) شعار هذا العام وقميصه.

      ### أهداف الاستطلاع

      أُعد هذا الاستطلاع للتعرف على الاتجاهات القادمة في منظومة تطوير الويب ومساعدة المطورين على اتخاذ قرارات تقنية.

      لذلك يركز الاستطلاع على توقع ما سيأتي خلال السنوات القليلة المقبلة بدلًا من تحليل ما هو شائع الآن، ولهذا لا يشمل دائمًا الميزات أو التقنيات الأكثر انتشارًا حاليًا.

      ينبغي أيضًا اعتباره **صورةً لفئة محددة من المطورين**، فهو لا يهدف إلى تمثيل المنظومة بأكملها.

      كان الاستطلاع متاحًا للجميع عبر الإنترنت، ولم تُصفَّ المشاركات أو تُنتقَ بأي طريقة.

      ### تمويل المشروع

      يأتي تمويل هذا المشروع من مصادر متنوعة:

      - **مبيعات القمصان**.

      - **الروابط المدعومة**: يوفر شريكنا [Frontend Masters](https://frontendmasters.com/) روابط الموارد الموصى بها أسفل كل صفحة.

      - **مصادر تمويل أخرى**: ساهمت [Google](https://www.google.com/) و[TokyoDev](https://www.tokyodev.com/) أيضًا في تمويل العمل على الاستطلاع.

      ### نظرة تقنية عامة

      يمكنك الاطلاع [هنا](https://dev.to/sachagreif/how-the-devographics-surveys-are-run-2023-edition-1p6a) على شرح تقني مفصل لكيفية إجراء الاستطلاعات.