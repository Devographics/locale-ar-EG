locale: ar-EG
translations:
  ###########################################################################
  # General
  ###########################################################################

  - key: general.results.description.html2024
    t: إصدار 2024 من الاستطلاع السنوي حول أحدث الاتجاهات في منظومة HTML.

  - key: general.html2024.survey_intro
    t: |

      كانت HTML أولى تقنيات الويب، ومن المذهل إلى حد ما أنها أصبحت بعد ثلاثة عقود أكثر أهمية من أي وقت مضى.

      لكن هذا الاستطلاع، رغم اسمه، يتجاوز HTML بكثير ليشمل جميع جوانب منصة الويب ككل، وهناك *الكثير* لتغطيته!

      لذا، كما قد تتوقع، يتطلب تصميم استطلاع كهذا اتخاذ قرارات صعبة دائمًا. قررنا هذا العام التركيز على الميزات الجديدة والقادمة لمساعدتك على مواكبة المستجدات، وكذلك على المجالات التي تهم شركات المتصفحات أكثر من غيرها.

      وهذا يعني أن إجاباتك قد تؤثر مباشرةً في خطة تطوير المتصفح الذي تستخدمه الآن. ولهذا أنا متحمس جدًا لإطلاق الإصدار الثاني من استطلاع حالة HTML!

  - key: features.features_intro_html2024
    t: |
      أهلًا بك في الاستطلاع! يتناول هذا الجزء الأول خبرتك مع ميزات مختلفة في منصة الويب:


      - **لم أسمع بها من قبل**: تراها للمرة الأولى، أو سمعت بها لكنك لا تعرف ما وظيفتها.

      - **سمعت بها**: قرأت عنها أو تعلمتها، لكنك لم تستخدمها بعد.

      - **استخدمتها**: استخدمتها مرة واحدة على الأقل، حتى لو كان ذلك لمجرد التجربة.


      بالمناسبة، إذا أردت إخبارنا بالمزيد عن أي من اختياراتك، فانقر على أيقونة «التعليق» الصغيرة!

  ###########################################################################
  # Introduction
  ###########################################################################

  - key: introduction.html2024
    t: |
      <span class="first-letter">ر</span>غم اسمه، يتناول هذا الاستطلاع أكثر بكثير من HTML وحدها.

      لا تفهمني خطأً؛ فما زالت HTML نفسها أكثر أهمية من أي وقت مضى، وهذا مثير للإعجاب بالنسبة إلى تقنية عمرها 30 عامًا. ومع ذلك، حاولنا توسيع نطاق الاستطلاع ليشمل منصة الويب ككل.

      من واجهات برمجة تطبيقات المتصفح إلى مشكلات تطوير الويب واستراتيجيات إمكانية الوصول وأدوات التحليلات والأداء، هناك *الكثير* لتغطيته.

      لتسهيل استكشاف كل هذه الميزات الجديدة، نعرض الآن [حالة Baseline](https://web-platform-dx.github.io/web-features/) للميزة كلما أمكن؛ ابحث عن نقطة زرقاء أو خضراء صغيرة بجوار اسمها.

      وإذا وجدت أن هذه البيانات الخام تفتقر إلى السياق، يمكنك الآن أيضًا تصفح **التعليقات** التي تركها المشاركون على كل سؤال.

      فلنبدأ مباشرةً ونكتشف ما شهدته منصة الويب في عام 2024!

      <span class="conclusion__byline">– Sacha Greif</span>

  ###########################################################################
  # Sections Introductions
  ###########################################################################

  - key: sections.user_info.description.html2024
    t: |
      أهلًا بك في نتائج استطلاع حالة HTML. وصل إصدار هذا العام إلى **5,402** مشارك من مختلف أنحاء العالم.

  - key: sections.features.description.html2024
    t: |
      ميزات HTML وواجهات برمجة تطبيقات المتصفح الأخرى
  ###########################################################################
  # Charts
  ###########################################################################

  # user_info

  - key: user_info.country.takeaway.html2024
    t: >
      حققت ألمانيا حضورًا قويًا هذا العام؛ ورغم أنها لم تتجاوز الولايات المتحدة في المركز الأول، فقد تفوقت على ما قد يوحي به حجمها.

  - key: user_info.locale.takeaway.html2024
    t: >
      جزيل الشكر لمترجمينا المتطوعين الذين أتاحوا الاستطلاعات بلغات كثيرة ومختلفة!

  - key: user_info.completion_stats.takeaway.html2024
    t: >
      رغم طول الاستطلاع، حرصت أغلبية ساحقة من المشاركين على إكماله من البداية إلى النهاية!

  - key: user_info.age.takeaway.html2024
    t: >
      بلغ وسيط أعمار المشاركين في استطلاع حالة HTML 35 عامًا؛ قريبًا من 34 عامًا في حالة CSS، وأكبر بكثير من 31 عامًا في حالة JS.

  - key: user_info.years_of_experience.takeaway.html2024
    t: >
      ويظهر الفرق بين الاستطلاعين أيضًا عند النظر إلى سنوات الخبرة في تطوير الويب: فمتوسطها هنا 12 عامًا، مقابل 9 أعوام لدى المشاركين في استطلاع حالة JS.

  - key: user_info.company_size.takeaway.html2024
    t: >
      كلما كبرت الشركة ارتفع الراتب. ومع ذلك، تُظهر بياناتنا أنك تستطيع كسب دخل جيد مهما كان حجم شركتك، إذا كنت ماهرًا بما يكفي.

  - key: user_info.yearly_salary.takeaway.html2024
    t: >
      رغم أننا كثيرًا ما نسمع عن رواتب من ستة أرقام في وادي السيليكون، فإن الواقع هو أن معظم مطوري الواجهات الأمامية حول العالم يكسبون أقل بكثير، كما يتضح عند المقارنة المباشرة بين الولايات المتحدة وبقية العالم.

  - key: user_info.higher_education_degree.takeaway.html2024
    t: >
      رغم أن الحصول على شهادة جامعية يرتبط بدخل أعلى، اتضح أن مجالها لا يلزم أن يكون متعلقًا بالبرمجة؛ وهذا خبر جيد لكثيرين منا ممن اكتشفوا شغفهم بتطوير الويب في مرحلة متأخرة من حياتهم.

  - key: user_info.gender.takeaway.html2024
    t: >
      على عكس الاستطلاعات السابقة، لم نلاحظ هذه المرة فرقًا كبيرًا في الدخل بين الأنواع الاجتماعية.

      ومع ذلك، لا تعني هذه المعلومة المنفردة أن علينا تجاهل التحديات التي تواجهها النساء في قطاعنا.

  - key: user_info.race_ethnicity.takeaway.html2024
    t: >
      كان المشاركون غير البيض أكثر ميلًا إلى أن يكونوا أصغر سنًا وأقل خبرة؛ ونأمل أن يشير ذلك إلى استمرار تنوع القطاع.

  - key: user_info.disability_status.takeaway.html2024
    t: >
      بفضل الجهود المتواصلة للمدافعين عن إمكانية الوصول، أصبحنا ندرك الآن ضرورة مراعاة الإعاقات، الدائمة منها وغير الدائمة، في عملية التصميم والتطوير.

  - key: user_info.source.takeaway.html2024
    t: >
      عرف معظم المشاركين بالاستطلاع من إصدارات السنوات السابقة، لكن كثيرين عثروا عليه أيضًا عبر لافتة في [نتائج استطلاع حالة CSS لعام 2024](https://2024.stateofcss.com/).

      وللمرة الأولى، تجاوز Mastodon منصة X بوصفه مصدرًا للزيارات، وربما يرجع ذلك إلى أن الأخيرة بدأت لاحقًا بمعاقبة المنشورات التي تتضمن روابط خارجية.

  # features

  - key: features.all_features.takeaway.html2024
    t: >
      تصدرت عناصر المعالم (`<main>` و`<nav>` وغيرها) قائمة الميزات الأكثر استخدامًا، كما هو متوقع، بينما كانت تطبيقات الويب المعزولة الأقل استخدامًا.

      حقق `<datalist>` أعلى نسبة من المواقف الإيجابية (47%)، بينما تصدر `<model>` المواقف السلبية بنسبة 9%.

  - key: features.reading_list.takeaway.html2024
    t: >
      تتيح لك قائمة القراءة حفظ البنود التي تريد معرفة المزيد عنها بعد إكمال الاستطلاع، وكانت ميزة Select القابلة للتخصيص الجديدة أكثر البنود إضافةً إليها.

  # forms

  - key: features.forms_features.takeaway.html2024
    t: >
      بما أن النماذج إحدى الطرق الرئيسية لتفاعل المستخدمين مع الويب، فليس من المستغرب أن تطرح مجموعة من التحديات.

      ومن الميزات الجديرة بالمتابعة Select القابل للتخصيص؛ فحداثته تجعله من أقل ميزات النماذج استخدامًا، لكنه يحتل المرتبة الثانية عند ترتيب الميزات حسب المواقف الإيجابية.

  - key: features.forms_pain_points.takeaway.html2024
    t: >
      لا يزال تنسيق حقول إدخال النماذج أبرز مشكلة تواجه المطورين فيما يتعلق بالنماذج، وخصوصًا عناصر `<select>`.

      وبالحديث عن `<select>`، كان غياب سلوك «مربع الاختيار» (البحث والإكمال التلقائي وغيرها) ملحوظًا أيضًا، إذ يجبر التطبيقات غالبًا على الاعتماد على حلول التفافية باستخدام JavaScript.

  # interactivity

  - key: features.interactivity_features.takeaway.html2024
    t: >
      رغم انخفاض الاستخدام وتصنيف Baseline بوصفه «متاحًا بشكل محدود»، تصدرت Popover API من حيث المواقف الإيجابية، وهذا منطقي لميزة مفيدة كهذه.

  - key: features.interactivity_pain_points.takeaway.html2024
    t: >
      لا يزال تنسيق حقول إدخال النماذج أبرز مشكلة تواجه المطورين فيما يتعلق بالنماذج، وخصوصًا عناصر `<select>`.

      وبالحديث عن `<select>`، كان غياب سلوك «مربع الاختيار» (البحث والإكمال التلقائي وغيرها) ملحوظًا أيضًا، إذ يجبر التطبيقات غالبًا على الاعتماد على حلول التفافية باستخدام JavaScript.

  # content

  - key: features.content_features.takeaway.html2024
    t: >
      تلقت السمتان `srcset` و`sizes` 81 تعليقًا مفتوحًا، عبّر 58% منها عن موقف سلبي. وكما قال أحد المشاركين: «عليك البحث عن الصياغة في كل مرة تستخدمهما».

  - key: features.content_pain_points.takeaway.html2024
    t: >
      يتصدر SVG (ولا سيما تنسيقه باستخدام CSS) وإدارة الصور قائمة أبرز مشكلات التعامل مع المحتوى.

  # web_components

  - key: features.web_components_features.takeaway.html2024
    t: >
      رغم وجود مؤيدين لمكونات الويب، فإنها لا تزال تقنية مثيرة للجدل. بلغ متوسط الآراء السلبية تجاه ميزات مكونات الويب 7%، مقابل 4% لجميع الميزات الأخرى مجتمعة.

  - key: features.web_components_libraries.takeaway.html2024
    t: >
      قد لا يُعرف Svelte بأنه مكتبة لمكونات الويب، لكنه يعمل معها جيدًا، على عكس React الذي جاء في مرتبة أدنى بكثير.

  - key: features.using_web_components_pain_points.takeaway.html2024
    t: >
      لا تزال صعوبة تنسيق مكونات الويب وتخصيصها العقبة الرئيسية أمام انتشار استخدامها. ومن العوائق الأخرى صعوبة دمجها مع مكتبات الواجهات الأمامية المبنية على JavaScript.

  - key: features.making_web_components_pain_points.takeaway.html2024
    t: >
      رغم اسمه الجذاب، لا يزال Shadow DOM مصدر إحباط لمطوري مكونات الويب، إذ يستسلم كثيرون أمام التعقيد المفرط للعملية برمتها.

  # accessibility

  - key: features.accessibility_features.takeaway.html2024
    t: >
      اتضح أن ميزات إمكانية الوصول الواردة في استطلاع هذا العام سهلة الاستخدام بما يكفي، ما أدى إلى انخفاض شديد في المواقف السلبية إجمالًا.

  - key: features.accessibility_disabilities.takeaway.html2024
    t: >
      كان من المطمئن أن نرى المطورين يراعون طيفًا واسعًا من الإعاقات عند إنشاء المواقع، وكانت الإعاقات البصرية في مقدمة القائمة.
    aliases:
      - accessibility.accessibility_disabilities.takeaway.html2024

  - key: features.accessibility_techniques.takeaway.html2024
    t: >
      من الرائع أن نرى انتشار تطبيق النصوص البديلة، ويمكن لهذا الرسم البياني، على أقل تقدير، أن يكون قائمة موجزة مفيدة بأنماط إمكانية الوصول التي يمكنك تطبيقها في مشروعاتك.
    aliases:
      - accessibility.accessibility_techniques.takeaway.html2024

  - key: features.accessibility_screenreaders.takeaway.html2024
    t: >
      ليس من المستغرب أن يكون المطورون أكثر ميلًا إلى استخدام قارئات الشاشة إذا كانت مضمّنة مع المتصفح أو نظام التشغيل.
    aliases:
      - accessibility.accessibility_screenreaders.takeaway.html2024

  - key: features.accessibility_tools.takeaway.html2024
    t: >
      تصدرت Lighthouse وأدوات المطور في المتصفح عمومًا الترتيب، متجاوزةً أدوات أكثر تخصصًا مثل Axe أو WAVE.
    aliases:
      - accessibility.accessibility_tools.takeaway.html2024

  - key: features.accessibility_pain_points.takeaway.html2024
    t: >
      تطرح إمكانية الوصول تحديًا فريدًا؛ إذ يتعين على المطورين التغلب ليس فقط على المشكلات التقنية مثل صعوبة الاختبار، بل أيضًا على العوائق التنظيمية مثل انخفاض الأولوية أو غياب طلب العملاء.
    aliases:
      - accessibility.accessibility_pain_points.takeaway.html2024

  # mobile_web_apps_features

  - key: features.mobile_web_apps_features.takeaway.html2024
    t: >
      كان استخدام ميزات تطبيقات الويب للهواتف والحواسيب منخفضًا إجمالًا؛ إذ لم يتجاوز متوسط المشاركين الذين استخدموا هذه الميزات 6%، مقابل 30% لجميع الميزات الأخرى مجتمعة.

  - key: features.native_apps_tools.takeaway.html2024
    t: >
      رغم أن إنشاء تطبيقات أصلية باستخدام تقنيات الويب ينطوي على تحديات وقيود، فإنه ظل الأسلوب الأكثر شعبية بين المشاركين.
    aliases:
      - mobile_web_apps.native_apps_tools.takeaway.html2024

  - key: features.mobile_web_apps_pain_points.takeaway.html2024
    t: >
      تعني الحصة السوقية المهيمنة لنظام iOS وطبيعته المغلقة أن الخيارات محدودة عند ظهور مشكلات في منصة الويب.

  # other_tools

  - key: other_tools.site_generators.takeaway.html2024
    t: >
      رغم أن Next.js ليس مولدًا تقليديًا للمواقع الثابتة، فإن دعمه لأساليب عرض أكثر ديناميكية إلى جانب العرض وقت البناء يجعله خيارًا متعدد الاستخدامات للغاية، شأنه شأن Astro الذي يضم مجموعة ميزات مشابهة.

  - key: other_tools.validation_tools.takeaway.html2024
    t: >
      قد لا تحظى أدوات التحقق بالشعبية التي كانت لها سابقًا، لكنها لا تزال أدوات مفيدة ضمن عدة مطور الويب.

  - key: other_tools.performance_tools.takeaway.html2024
    t: >
      كما في مخطط أدوات إمكانية الوصول، تتصدر Lighthouse وأدوات المطور في المتصفح الترتيب، ما يبين مرة أخرى أن الأدوات متعددة الاستخدامات تميل إلى أن تكون أكثر شعبية من نظيراتها المتخصصة.

  - key: other_tools.analytics_tools.takeaway.html2024
    t: >
      قد تظل Google Analytics مهيمنة، لكن البدائل الأكثر مراعاة للخصوصية مثل Plausible وFathom تكتسب شعبية.

  - key: other_tools.browsers.takeaway.html2024
    t: >
      عند النظر إلى ما وراء المتصفحات الأربعة الكبرى، ستجد تنوعًا مفاجئًا في هذا المجال، مع وافدين جدد مثل Arc وBrave وZen، وخيارات مخصصة للمطورين مثل Polypane.

  - key: other_tools.web_platform_resources.takeaway.html2024
    t: >
      تستحق MDN وCan I Use مكانتهما بوصفهما مصدرين أساسيين لمجتمع تطوير الويب، لكن تابع عمل مجموعة WebDX حول [ميزات الويب](https://web-platform-dx.github.io/web-features-explorer/)؛ فهي مبادرة جديدة واعدة.

  # usage

  - key: usage.html_interoperability_features.takeaway.html2024
    t: >
      قليل من الأمور أكثر إحباطًا من معرفة أن واجهة برمجة تطبيقات جديدة للمتصفح ستحل مشكلتك تمامًا، لكنك لا تستطيع استخدامها بسبب ضعف الدعم.


      لحسن الحظ، وبفضل مبادرات مثل [Interop](https://web.dev/blog/interop-2024)، يمكننا أن نأمل أن تنضم Popover API وAnchor Positioning قريبًا إلى الميزات التي نستخدمها جميعًا دون تفكير.

  - key: usage.html_functionality_features.takeaway.html2024
    t: >
      رغم أن ضعف دعم المتصفحات مشكلة بالتأكيد، قد يقل استخدام الميزات المدعومة جيدًا أيضًا إذا صعب تخصيصها لتلبية احتياجات المطورين أو كان إتقانها صعبًا ببساطة.

  - key: usage.html_missing_elements.takeaway.html2024
    t: >
      قد يبدو غريبًا أن عناصر واجهة المستخدم المنتشرة مثل علامات التبويب وجداول البيانات لا تملك حتى الآن عنصر HTML أصليًا يقابلها.


      لكن تنفيذ هذه السلوكيات المعقدة بشكل صحيح مع مراعاة جميع الحالات الاستثنائية يستغرق وقتًا؛ لذا ليس أمامنا الآن سوى الانتظار والأمل في أن تصل هذه العناصر إلى المتصفح يومًا ما.

  - key: usage.html_css_js_balance.takeaway.html2024
    t: >
      لا نزال نقضي وقتًا أطول بكثير في كتابة JavaScript (أو TypeScript) مقارنةً بأي شيء آخر. لا بأس في ذلك، لكننا نأمل أن يساعد التقدم المستمر لمنصة الويب ككل في تحقيق قدر أكبر من التوازن قريبًا.

  - key: usage.what_do_you_use_html_for.takeaway.html2024
    t: >
      رغم أن حالات الاستخدام «التقليدية» مثل المدونات والصفحات الرئيسية لا تزال تشكل جزءًا كبيرًا من عمل مطوري الويب المعاصرين، فإن تطبيقات الويب باتت تشكل الحصة الأكبر بفارق كبير؛ وهذا يفسر بدوره تكيف منصة الويب مع هذا الواقع الجديد.

  - key: usage.industry_sector.takeaway.html2024
    t: >
      تصدرت أدوات البرمجة والتقنية الترتيب، وهذا منطقي في استطلاع يركز على المطورين.


      ومن المثير للاهتمام أيضًا أن التجارة الإلكترونية جاءت في المرتبة الثالثة، فهذا قطاع يواجه تحديًا مزدوجًا يتمثل في إنشاء مواقع عالية الأداء تتضمن كذلك تفاعلات معقدة للمستخدمين.

  # opinions

  - key: opinions.accessibility_is_valued.takeaway.html2024
    t: >
      من الرائع أن نرى التقدير المناسب لإمكانية الوصول في أماكن العمل، على الأقل بين المشاركين في الاستطلاع.


      ورغم وجود تحيز ناتج عن الاختيار الذاتي بالتأكيد، فقد أسهمت جهود المدافعين عن إمكانية الوصول كثيرًا في إحراز التقدم.

  - key: opinions.keeping_informed_is_challenging.takeaway.html2024
    t: >
      الميزات الجديدة رائعة، لكن بشرط أن تتمكن فعلًا من معرفة ماهيتها وكيفية استخدامها.


      يواجه معظم المشاركين هذا التحدي يوميًا، كما تعكس البيانات.

  - key: opinions.browser_interoperability_is_obstacle.takeaway.html2024
    t: >
      رغم أن التوافق بين المتصفحات كان تقليديًا إحدى أكبر مشكلات تطوير الويب، يبدو أن الوضع يتحسن أخيرًا؛ وسيكون من المثير متابعة تطور هذا المخطط مع مرور الوقت.

  - key: opinions.web_platform_right_direction.takeaway.html2024
    t: >
      ثمة أسباب تدعو إلى التفاؤل بشأن منصة الويب، وينعكس هذا التفاؤل في بيانات هذا العام.

  ################################################
  ###########################################################################
  # Conclusion
  ###########################################################################

  - key: conclusion.html2024.patrick_brosset.bio
    t: مدير منتجات في فريق Edge لدى Microsoft
  - key: conclusion.html2024.patrick_brosset
    t: >
      نميل إلى اعتبار HTML أمرًا مسلمًا به، ونظن أنها مكتملة إلى حد كبير. لكن عناصرها وميزات المتصفح التي توفرها تطورت كثيرًا على مر السنين، ولا تزال تتطور. ومع انتشار البنى التي تعطي الأولوية لـHTML، نحصل على الإمكانات اللازمة لبنائها بالطريقة الصحيحة. لم يسبق أن كان الوقت أفضل من الآن لتكون مطور HTML.

      ومع ذلك، لا يزال هناك المزيد لإنجازه. تظهر مجالات جديدة للمشكلات باستمرار، وعلى المنصة مواكبة الاحتياجات الجديدة.

      ### إضافة ميزات جديدة…

      هناك حاجة ماسة إلى عناصر HTML جديدة، مثل جداول البيانات وعلامات التبويب ومفاتيح التبديل، لكن من المهم تحقيق التوازن المناسب بين المكونات المعقدة التي تفعل كل شيء، والعناصر الأساسية الأبسط لكنها متينة وقابلة للتنسيق ويمكننا البناء عليها.

      ### …مع تحسين العناصر القديمة

      ومن المهم أيضًا مواصلة تحسين ما لدينا بالفعل. فالميزات الحالية مثل `<select>` وحقول `<input>` للتاريخ والوقت و`<details>` لا توفر دائمًا المستوى المناسب من قابلية التنسيق والتخصيص، بينما يصعب استخدام ميزات أخرى مثل CSP وShadow DOM بسبب تعقيدها.

      ورغم أن المطورين والمؤسسات باتوا يدركون أهمية إمكانية الوصول أكثر من ذي قبل، فلا يزال اختبارها صعبًا وتحسينها معقدًا.

      ### التوافق بين المتصفحات

      إضافة إلى ذلك، لا يزال توافق ميزات HTML لدينا وعملها المشترك بين المتصفحات عقبة كبيرة أمام مطوري الويب. فدعم إصدارات المتصفحات القديمة أمر شاق. وتُظهر نتائج هذا العام أن ذلك ينطبق بوجه خاص على الميزات الأحدث مثل Popover وAnchor Positioning وانتقالات العرض متعددة الصفحات، وكذلك على `<dialog>` وتطبيقات الويب التقدمية. بدأ اعتماد هذه الميزات، ويحتاج المطورون إلى عملها في كل مكان.

      ### تحدي مواكبة المستجدات

      نعم، لا يزال هناك المزيد لإنجازه، لكن الأمور _تتغير بالفعل_. بل إنها تتغير بسرعة تجعل مواكبة المستجدات تحديًا. وتساعدنا كثيرًا مصادر مثل MDN وCaniuse.com وWeb.dev وموقع W3C، لكن المجال ما زال مفتوحًا لمزيد من الأدوات التي تساعدنا على المتابعة.

      ومن ناحية أخرى، قد يكون الحديث عن الميزات الجديدة مبكرًا محبطًا للمطورين الذين لا يستطيعون استخدامها بعد. ولهذا من المهم مواصلة صيانة بيانات المنصة عالية الجودة مثل [browser-compat-data](https://github.com/mdn/browser-compat-data/) و[web-features](https://github.com/web-platform-dx/web-features/)، التي تتيح لنا وصف الميزات بطريقة أنسب للمطورين.

      ### مستقبل مشرق لـHTML

      ختامًا، من المبهج أن يتفق معظم المشاركين على أن التوافق بين المتصفحات أصبح عمومًا مشكلة أقل بكثير مما كان عليه، مع تحسن واضح في السنوات الأخيرة. ومع تزايد الإمكانات المتاحة، يصبح بناء واجهات مستخدم تعطي الأولوية لـHTML وتتميز بالأداء وإمكانية الوصول والتفاعلية أسهل باستمرار، ما يتيح تقليل استخدام JavaScript إلى المواضع التي تشتد فيها الحاجة إليها، ويجعل خوادم الويب والمتصفحات تتواصل بالطريقة التي صُممت لها: باستخدام HTML!

