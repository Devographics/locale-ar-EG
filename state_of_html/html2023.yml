translations:
  ###########################################################################
  # General
  ###########################################################################

  - key: general.results.description.html2023
    t: إصدار 2023 من الاستطلاع السنوي حول أحدث الاتجاهات في منظومة HTML.

  - key: introduction.html2023
    t: >
      بينما كانت JavaScript تهيمن على الويب، وكانت CSS تكتسب قدرات جديدة عامًا بعد عام،
      بدا وكأن HTML راضٍ بالبقاء ساكنًا والتنازل عن مركز الصدارة لشقيقيه الأصغر سنًا.
      ففي النهاية، بعد أن تتعلم عن عناصر `<div>` وعناوين `<h>` من 1 إلى 6، ماذا بقي لتعرفه؟


      اتضح أن هناك الكثير! استعنا مجددًا بـ[Lea Verou](https://lea.verou.me/) لتوظيف معرفتها العميقة
      بمنصة الويب ومساعدتنا على إعداد استطلاع تجاوز HTML وحده
      ليشمل إمكانية الوصول ومكونات الويب والكثير غير ذلك.


      وهذا يفسر جزئيًا سبب تأخر صدور هذا التقرير؛ إذ كان هناك *كم هائل* من البيانات الجديدة لمعالجته!
      نأمل أن تجد أن النتيجة تستحق الانتظار.


      وإلى جانب البيانات الواردة هنا، حسّنا أيضًا ميزة **تخصيص المخططات** لتتيح لك تعديل
      كل تمثيل مرئي للبيانات بمزيد من الدقة. وإذا توصلت أثناء ذلك إلى أي رؤى مثيرة للاهتمام،
      فأخبرنا بها!


      يمكنك معرفة المزيد عن كل ذلك في [هذا المنشور](https://dev.to/sachagreif/discover-the-state-of-html-2023-survey-results-n10)، أو بمشاهدة [فيديو سريع على YouTube](https://www.youtube.com/watch?v=G-rFwp2zUT4)


      وبعد أن أوضحنا كل ذلك، أهلًا بك في نتائج أول استطلاع لحالة HTML.
      أراهن أنك لن تنظر إلى HTML العتيق بالطريقة نفسها بعد الآن!

  ###########################################################################
  # Sections Introductions
  ###########################################################################

  - key: sections.user_info.description.html2023
    t: |
      أهلًا بك في نتائج استطلاع حالة HTML. وصل هذا الإصدار الأول إلى **20,904** مشاركين من مختلف أنحاء العالم.

  - key: sections.features.description.html2023
    t: |
      ميزات HTML وواجهات برمجة تطبيقات المتصفح الأخرى

  ###########################################################################
  # Other Content
  ###########################################################################

  - key: features.all_features.html2023
    t: جميع الميزات
  - key: features.all_features.html2023.description
    t: |
      يلخص هذا الرسم البياني جميع أسئلة الميزات في الاستطلاع. تمثل الأعمدة الرئيسية خبرة المشارك، ثم تُقسّم وفقًا لموقفه. ويمكنك تغيير التجميع للتبديل بين الطريقتين.


      يمكنك أيضًا العثور على تفصيل أكثر تحديدًا للبيانات نفسها في القسم الفرعي لكل ميزة.

  ###########################################################################
  # Conclusion
  ###########################################################################

  - key: conclusion.html2023.lea_verou.bio
    t: عضو مجموعة البنية التقنية في W3C وباحث في MIT CSAIL
  - key: conclusion.html2023.lea_verou
    t: >
      *يا له من جهد!* تطلب هذا الاستطلاع عملًا هائلًا من عشرات الأشخاص عبر ست قارات. ولم يسجل رقمًا قياسيًا جديدًا في عدد الإجابات لاستطلاع أول من سلسلة «حالة…» فحسب، بل قدمت واجهة جمع البيانات فيه ابتكارات منحتنا فهمًا غير مسبوق لمواقف المطورين، وسيمتد أثرها إلى ما يتجاوز نطاقه بكثير.


      يرى البعض أن تحسين HTML أمر لا جدوى منه، لكن الاستطلاع يثبت العكس بوضوح. **يتوق المطورون إلى مزيد من عناصر HTML التفاعلية**: فلم تكن العناصر التفاعلية مثل `<datalist>` وPopover API من أكثر العناصر إيجابية في مختلف الفئات فحسب، بل إن جميع أبرز [العناصر المفقودة](https://2023.stateofhtml.com/en-US/usage/#html_missing_elements) كانت أدوات تفاعلية.


      لكن **تسهيل الأمور البسيطة** بتوفير وظائف جاهزة لم يعد كافيًا. فقد أصبح **تمكين الأمور المعقدة** عبر دعم التخصيص الشامل ضرورة؛ إذ كان قصور قابلية التخصيص، ولا سيما في **التنسيق**، أبرز المشكلات المتكررة بفارق كبير.


      ونتيجة لذلك، كانت عناصر النماذج أيضًا العناصر [الأكثر إعادة إنشاءً](https://2023.stateofhtml.com/en-US/usage/#html_functionality_features)، وهي نتيجة خاسرة للجميع، إذ يعاني منها المطورون والمستخدمون النهائيون. ولحسن الحظ، توجد مبادرات جديدة عديدة لتحسين هذا الوضع، لذا يبدو المستقبل واعدًا.


      ومن الاحتياجات المهمة أيضًا قابلية التوسعة. لا يمكن التوسع إذا كانت هيئات المعايير وحدها مخولة بتوسيع HTML؛ فضلًا عن أن العناصر العامة لا تستطيع تلبية هذا التنوع الهائل في الاحتياجات. وللأسف، يبدو أن **واجهات برمجة تطبيقات مكونات الويب** (وخاصة Shadow DOM)، رغم انتشار استخدامها، لا تلبي احتياجات المطورين ولا توفر تجربة تطوير سلسة، إذ تصدرت قائمة أسوأ التجارب في الاستطلاع. ومع ذلك، فإن النشاط المستمر في هذا المجال (وشاركت في بعضه) يجعلني آمل أن هذه التقنيات، رغم صعوبة مسارها، تسير نحو تحقيق كامل إمكاناتها.


      وهذا يقودني إلى نقطتي الأخيرة: من المهم أن نتذكر أن هذا الاستطلاع مجرد صورة آنية لوجهات نظر المطورين ولحالة منصة الويب في ذلك الوقت. ومع ذلك، يتمثل أحد الأهداف الرئيسية لهذه الاستطلاعات في تحسين الوضع الراهن عبر إلقاء مزيد من الضوء على احتياجات المطورين. فكم مشكلة من مشكلات اليوم ستُعالج غدًا نتيجة لذلك؟ انضموا إلينا في وقت لاحق من هذا العام في الإصدار الثاني من الاستطلاع لنعرف!

  ###########################################################################
  # About
  ###########################################################################

  - key: about.content.html2023
    t: |
      أُجري استطلاع حالة HTML لعام 2023 من 19 سبتمبر إلى 19 أكتوبر 2023، وجُمع فيه 20,904 ردود.

      قادت [Lea Verou](https://lea.verou.me/) جهود تصميم الاستطلاع بفضل منحة من Google. كما أشرفت Lea على تصميم النماذج الأولية واختبار عناصر جديدة لجمع بيانات واجهة المستخدم وتنفيذها؛ وساهمت في معالجة البيانات، وساعدت في تمثيلها بصريًا.

      يتولى [Sacha Greif](https://sachagreif.com/) و[Eric Burel](https://www.lbke.fr/) تشغيل البنية التحتية للاستطلاع، بمساعدة فريق من المساهمين والاستشاريين في المصادر المفتوحة.

      صمم [Christopher Kirk-Nielsen](http://chriskirknielsen.com/) شعار هذا العام وقميصه.

      ### أهداف الاستطلاع

      أُعد هذا الاستطلاع للتعرف على الاتجاهات القادمة في منظومة تطوير الويب ومساعدة المطورين على اتخاذ قرارات تقنية.

      لذلك يركز الاستطلاع على توقع ما سيأتي خلال السنوات القليلة المقبلة بدلًا من تحليل ما هو شائع الآن، ولهذا لا يشمل دائمًا الميزات أو التقنيات الأكثر انتشارًا حاليًا.

      ينبغي أيضًا اعتباره **صورةً لفئة محددة من المطورين**، فهو لا يهدف إلى تمثيل المنظومة بأكملها.

      كان الاستطلاع متاحًا للجميع عبر الإنترنت، ولم تُصفَّ المشاركات أو تُنتقَ بأي طريقة.

      ### تمويل المشروع

      يأتي تمويل هذا المشروع من مصادر متنوعة:

      - **مبيعات القمصان**.

      - **الروابط المدعومة**: يوفر شريكنا [Frontend Masters](https://frontendmasters.com/) روابط الموارد الموصى بها أسفل كل صفحة.

      - **مصادر تمويل أخرى**: ساهمت [Google](https://www.google.com/) و[TokyoDev](https://www.tokyodev.com/) أيضًا في تمويل العمل على الاستطلاع.

      ### نظرة تقنية عامة

      يمكنك الاطلاع [هنا](https://dev.to/sachagreif/how-the-devographics-surveys-are-run-2023-edition-1p6a) على شرح تقني مفصل لكيفية إجراء الاستطلاعات.

  # HTML 2023

  - key: faq.data_used_html2023
    t: كيف ستُستخدم هذه البيانات؟
  - key: faq.data_used_html2023.description
    t: >
      ستُنشر جميع البيانات المجموعة علنًا كي يطلع عليها أي مطور أو شركة.
      كما [تستخدم شركات المتصفحات هذه البيانات](https://web.dev/interop-2023/) لتحديد مجالات التركيز وإرشاد خططها المستقبلية.

  - key: faq.survey_goals_html2023
    t: ما أهداف هذا الاستطلاع؟
  - key: faq.survey_goals_html2023.description
    t: >
      يهدف الاستطلاع إلى قياس مدى الوعي بميزات HTML وواجهات برمجة تطبيقات المتصفح الجديدة، ومساعدة المطورين على متابعة تطور استخدامها.

  - key: faq.who_should_take_survey_html2023
    t: من ينبغي له المشاركة في هذا الاستطلاع؟
  - key: faq.who_should_take_survey_html2023.description
    t: >
      هذا استطلاع مفتوح لكل من ينشئ مواقع أو تطبيقات ويب، سواء بانتظام أو من حين لآخر، ضمن عمله أو بصفته طالبًا أو لمجرد المتعة!

  - key: faq.how_long_will_survey_take_html2023
    t: كم يستغرق إكمال الاستطلاع؟
  - key: faq.how_long_will_survey_take_html2023.description
    t: >
      وفقًا لعدد الأسئلة التي تجيب عنها (جميع الأسئلة اختيارية)،
      يستغرق ملء الاستطلاع نحو 15 إلى 20 دقيقة.

  - key: faq.learn_more_html2023
    t: أين يمكنني معرفة المزيد؟
  - key: faq.learn_more_html2023.description
    t: يمكنك معرفة المزيد عن هذا الاستطلاع في [منشور الإعلان](https://lea.verou.me/blog/2023/design-state-of-html/).

  - key: faq.survey_design_html2023
    t: كيف صُمم هذا الاستطلاع؟
  - key: faq.survey_design_html2023.description
    t: >
      صممت [Lea Verou](https://lea.verou.me) الاستطلاع بمساهمات من شركات المتصفحات ومجموعات مثل [مجموعة WebDX المجتمعية](https://www.w3.org/community/webdx/).

  - key: faq.results_released_html2023
    t: متى ستُنشر النتائج؟
  - key: faq.results_released_html2023.description
    t: سيُجرى الاستطلاع من 19 سبتمبر إلى 16 أكتوبر، وستُنشر نتائجه بعد ذلك بوقت قصير.

  # Intro for actual survey page
  - key: general.html2023.survey_intro
    t: |
      يميل مطورو الويب إلى التركيز على JavaScript وCSS، لكن لا شيء مما نفعله ممكن من دون HTML الذي يشكل الأساس.

      لطالما بدا أن HTML لا يتطور، لكن الأمور قد تكون في طريقها إلى التغيير.
      فهناك عناصر جديدة مثل `<selectlist>` تلوح في الأفق، وميزات رائعة مثل النوافذ المنبثقة،
      ومجموعة واسعة من واجهات برمجة تطبيقات المتصفح ذات الصلة (مكونات الويب وتطبيقات الويب التقدمية وغيرها).

      تولت [Lea Verou](https://lea.verou.me/) هذا العام المهمة الكبيرة المتمثلة في قيادة تصميم هذا الاستطلاع الجديد كليًا، بدءًا من المحتوى وتجربة المستخدم وما بعدهما.

      وبناءً على نجاح [حالة JS](http://stateofjs.com/) و[حالة CSS](https://stateofcss.com/)، نقدم **حالة HTML**؛
      القطعة الأخيرة التي تكمل الثلاثية، كي نتمكن من متابعة تطور منصة الويب ككل.

      الفوائد التي ستحصل عليها:
      - **تستخدم المتصفحات** ومجموعات المعايير نتائج الاستطلاع **لتحديد أولويات خططها**.
      ويمكن لإجاباتك المساعدة في تنفيذ الميزات التي تهمك، وإعطاء الأولوية لمشكلات عدم التوافق بين المتصفحات، ومعالجة الثغرات في المنصة.
      - تعرّف على الميزات الجديدة والقادمة؛ وأضف الميزات إلى قائمة قراءتك واحصل على قائمة بالمصادر في النهاية!
      - احصل على تقييم مخصص لمعرفتك، واكتشف كيف تقارن إجاباتك بإجابات المشاركين الآخرين.

      سيظل الاستطلاع مفتوحًا لمدة 3 أسابيع، لكن الإجابات المقدمة **خلال الأيام التسعة الأولى (حتى 1 أكتوبر)** سيكون لها تأثير أكبر بكثير في الويب،
      إذ ستُستخدم البيانات الأولية في جهود تحديد أولويات يحل موعدها النهائي قبل ذلك.