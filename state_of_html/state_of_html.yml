      - forms.forms_pain_points
  - key: features.forms_pain_points.question
    t: ما أبرز المشكلات التي تواجهك مع نماذج HTML؟
    aliases:
      - forms.forms_pain_points.question
  - key: features.forms_pain_points.prompt
    t: |
      فكّر في عناصر التحكم المختلفة في النماذج (مثل `<input>` و`<textarea>` و`<select>` و`<button>` وغيرها)،
      والسلوكيات (مثل التحقق والإكمال التلقائي)، والتعامل مع النماذج عبر JS، وواجهات برمجة تطبيقات التحرير (مثل `contentEditable`) وغيرها.
      كل ما يزعجك مهم هنا — دعم المتصفحات، والميزات الناقصة، والتنسيق، وغيرها.
    aliases:
      - forms.forms_pain_points.prompt
  - key: features.forms_pain_points.placeholder
    t: |
      المشكلة رقم #{index}…

