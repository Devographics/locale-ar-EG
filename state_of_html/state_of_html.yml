  ###########################################################################
  # General
  ###########################################################################
  # Intro for stateofhtml.com
  - key: general.state_of_html.intro
    # aliasFor: general.html2023.survey_intro # Can we do that?
    t: |
      بينما يميل مطورو الويب إلى التركيز على جافا سكريبت و CSS، فإن أيًا مما نقوم به لن يكون ممكنًا بدون HTML الذي يعمل كأساس.

      لطالما بدا أن لغة HTML لا تتطور، لكن الأمور قد تتغير.

      عناصر جديدة، وميزات جديدة،
      وتتم الآن إضافة واجهات برمجة تطبيقات المتصفح الجديدة إلى منصة الويب بشكل سنوي.

      وبناءً على نجاح [State of JS](http://stateofjs.com/) و[State of CSS](https://stateofcss.com/)، كان من المنطقي إضافة استطلاع **State of HTML**؛

      القطعة الأخيرة المفقودة التي تُكمل الثلاثية، حتى نتمكن من تتبع تطور منصة الويب ككل.

  - key: general.state_of_html.description
    t: الاستطلاع السنوي للمطورين حول منصة الويب

  ###########################################################################
  # Tshirt
  ###########################################################################

  - key: tshirt.description.state_of_html
    t: |
      ## ادعم الاستطلاع بارتداء قميص حالة HTML

      هل تشتاق إلى الأيام الجميلة في منتصف التسعينيات، حين كان HTML في الصدارة وكانت أغلفة أشرطة VHS تتزين برسوم ملونة مستقبلية؟

      الخبر السيئ هو أنه حتى بتقنيات اليوم، لا يمكنك العودة بالزمن لتعيش تلك الأيام المجيدة من جديد. لكن ما *يمكنك* فعله هو ارتداء هذا القميص الرجعي الرائع، من تصميم الموهوب Christopher Kirk-Nielsen.

