    t: |
      أهلًا بك في الاستطلاع! يهدف القسمان الأولان إلى معرفة
      **ميزات** HTML (وواجهات برمجة التطبيقات المرتبطة بها) التي تعرفها.

      بالمناسبة، إذا أردت معرفة المزيد عن أي بند في الاستطلاع، يمكنك إضافته إلى قائمة القراءة بالنقر على أيقونة "+" الصغيرة الخاصة به!

  ###########################################################################
  # FAQ
  ###########################################################################

  - key: faq.how_long_will_survey_take_html
    t: كم يستغرق إكمال الاستطلاع؟
  - key: faq.how_long_will_survey_take_html.description
    t: >
      وفقًا لعدد الأسئلة التي تجيب عنها (يمكن تخطي جميع الأسئلة)،
      يستغرق ملء الاستطلاع نحو 10 إلى 15 دقيقة.

  - key: faq.who_should_take_survey_html
    t: من ينبغي له المشاركة في هذا الاستطلاع؟
  - key: faq.who_should_take_survey_html.description
    t: >
      هذا استطلاع مفتوح لكل من ينشئ مواقع أو تطبيقات ويب، سواء بانتظام أو من حين لآخر، ضمن عمله أو بصفته طالبًا أو لمجرد المتعة!

  - key: faq.data_used_html
    t: كيف ستُستخدم هذه البيانات؟
  - key: faq.data_used_html.description
    t: >
      ستُنشر جميع البيانات المجموعة علنًا كي يطلع عليها أي مطور أو شركة.
      كما [تستخدم شركات المتصفحات هذه البيانات](https://web.dev/blog/interop-2024) لتحديد مجالات التركيز وإرشاد خططها المستقبلية.

  - key: faq.survey_goals_html
    t: ما أهداف هذا الاستطلاع؟
  - key: faq.survey_goals_html.description
    t: >
      يهدف الاستطلاع إلى قياس مدى الوعي بميزات HTML وواجهات برمجة تطبيقات المتصفح الجديدة، ومساعدة المطورين على متابعة تطور استخدامها.