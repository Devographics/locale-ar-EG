    t: |
      يلخص هذا الرسم البياني جميع أسئلة الميزات في الاستطلاع. تمثل الأعمدة الرئيسية خبرة المشارك، ثم تُقسّم وفقًا لموقفه. ويمكنك تغيير التجميع للتبديل بين الطريقتين.


      يمكنك أيضًا العثور على تفصيل أكثر تحديدًا للبيانات نفسها في القسم الفرعي لكل ميزة.

