locale: ar-EG
translations:
  ###########################################################################
  # General
  ###########################################################################

  - key: general.results.description.html2026
    t: إصدار 2026 من الاستطلاع السنوي حول أحدث الاتجاهات في منظومة HTML.

  - key: general.html2026.survey_intro
    t: |
      قد يتذكر كبار السن منكم الأوقات القديمة في أواخر العقد الثاني من القرن الحادي والعشرين، عندما كانت مكتبات جافا سكريبت تسيطر على الساحة، ولم يكن من غير المألوف رؤية مطور يقوم بتثبيت إطار عمل كامل للواجهة الأمامية لمجرد عرض نافذة منبثقة أو إرسال نموذج.

      وبعد سنوات قليلة فقط، دخلنا عصراً جديداً كلياً. بات الذكاء الاصطناعي يُنتج جزءاً كبيراً، إن لم يكن معظم، من برمجياتنا، وأصبحت البرامج قادرة تماماً على اختيار أفضل واجهة برمجة تطبيقات للمتصفح تناسب احتياجاتك الخاصة دون الحاجة إلى استيراد إطار عمل كامل. وهذا ما يجعل الميزات الأصلية لمنصة الويب أكثر أهمية من أي وقت مضى.

      لكن على الرغم من أن الذكاء الاصطناعي يزيد من إنتاجيتنا، إلا أنه لا يقلل من انشغالنا. ولهذا السبب حرصنا على إبقاء استبيان هذا العام مختصراً، حيث حذفنا العديد من الميزات والأسئلة لضمان إمكانية إكماله في 15 دقيقة أو أقل.

      وكما هو الحال دائمًا، ستؤخذ نتائج هذا العام في الاعتبار من قبل موردي المتصفحات لتحديد أولويات خططهم، مما يعني أن مشاركتك يمكن أن تساعد في تشكيل مستقبل الويب.


  - key: features.features_intro_html2026
    aliasFor: features.features_intro_html2024

  - key: introduction.html2026
    t: |
      لما بدا كأنه دهور، شعرنا أن الويب ساكن لا يتقدم. كانت واجهات برمجة تطبيقات الويب محدودة مقارنةً بنظيراتها الأصلية. وكان بناء أي شيء أكثر تعقيدًا من تخطيط بعمود واحد يتطلب الكثير من الحلول الملتوية والترقيع والقَسَم.


      ونتيجة لذلك، جاءت JavaScript لسد الفراغ، وشهدنا انفجارًا حرفيًا في أطر العمل والمكتبات وكل ما بينهما.


      لكن الأمور انقلبت هذه الأيام. فقد استقرت أطر عمل JavaScript حول بضعة خيارات راسخة، وتباطأت وتيرة التغيير. وفي الوقت نفسه، نظمت شركات المتصفحات جهودها أخيرًا، وأصبحت تعمل جنبًا إلى جنب لإصدار ميزات جديدة أسرع من أي وقت مضى وضمان عملها في مختلف المتصفحات!


      ويحدث ذلك في الوقت المناسب تمامًا لانتشار توليد الشيفرة بمساعدة الذكاء الاصطناعي، الذي لا يتردد في تجاوز أطر عمل JavaScript تمامًا والاستفادة مباشرةً من واجهات برمجة تطبيقات المتصفح عندما يكون ذلك منطقيًا.


      لذا يبدو هذا وقتًا مثاليًا للعودة إلى الأساسيات والتعرف من جديد على ما تستطيع المتصفحات الحديثة فعله فعلًا. وهذا الاستطلاع هنا لمساعدتك!


      <span class="conclusion__byline">– Sacha Greif</span>

  - key: faq.survey_design_html2026
    t: كيف صُمم هذا الاستطلاع؟
  - key: faq.survey_design_html2026.description
    t: >
      صُمم هذا الاستطلاع نتيجة [عملية تصميم مفتوحة](https://github.com/Devographics/surveys/issues/253) شاركت فيها شركات المتصفحات ومجتمع تطوير الويب.

  - key: faq.results_released_html2026
    t: متى ستُنشر النتائج؟
  - key: faq.results_released_html2026.description
    t: سيُجرى الاستطلاع من 1 أكتوبر إلى 1 نوفمبر 2026، وستُنشر نتائجه قرابة 15 نوفمبر 2026.

  ###########################################################################
  # Figures
  ###########################################################################

  - key: figure.figure_lazy_loading_usage.html2026
    t: نسبة المشاركين الذين استخدموا **التحميل الكسول**، وهي الميزة الأكثر استخدامًا بين الميزات ذات حالة Baseline «متاحة حديثًا».

  - key: figure.figure_content_security_usage.html2026
    t: أكبر زيادة في الاستخدام مقارنةً بالعام السابق، وكانت لميزة **سياسة أمن المحتوى**.

  - key: figure.figure_forms_features.html2026
    t: عدد التعليقات على الميزة الأكثر تعليقًا، وهي **datalist**.

  ###########################################################################
  # Highlights
  ###########################################################################

  - key: highlight.customizable_select.html2026
    t: |
      قد لا تحظى **قوائم Select القابلة للتخصيص** بدعم واسع حاليًا، لكنها ميزة تستحق التعرف عليها. فرغم أن **7.1%** فقط من المشاركين استخدموها، أفاد **89%** من المطورين الذين *استخدموها* بتجربة إيجابية.

      وبما أن تنسيق عنصر `<select/>` كان دائمًا تحديًا، فإن القدرة أخيرًا على تخصيصه وفق احتياجاتك دون اللجوء إلى حلول ملتوية باستخدام JavaScript تحسن مرحب به!

  - key: highlight.jpeg_xl.html2026
    t: |
      بعد جدل نطق "JIF/GIF" والاسم المربك "PNG" («بي إن جي»؟ «بينغ»؟)، قرر المسؤولون عن تسمية تنسيقات الصور تبسيط الأمر هذه المرة: أخذوا JPEG الشائع وأضافوا إليه "XL" ليبدو أكثر روعة.

      لكن ليس أكبر حجمًا؛ فعلى عكس ما يوحي به الاسم، تكون صور JPEG XL *أصغر* فعلًا من JPEG القديم الممل، مع أنها متوافقة معه بطريقة ما. لا تسألني كيف يعمل ذلك.

  - key: highlight.hidden_until_found.html2026
    t: |
      هل تعلم أن المتصفحات أصبحت قادرة على لعب الغميضة؟ تتيح لك السمة `hidden="until-found"` إخفاء عنصر حتى يستدعيه المستخدم، كأن ينقر مثلًا على رابط مرساة يشير إليه.

      في الوقت الحالي، لا تزال هذه الميزة «مخفية» فعلًا، إذ لم يسمع بها من قبل **79.4%** من المشاركين. كما أن دعم المتصفحات لها لا يزال محدودًا (ننظر إليك يا Safari!). لكن عندما يتحسن التوافق، قد يتضح أنها تستحق الإضافة إلى أدواتك.

  - key: highlight.popover_api.html2026
    t: |
      أصبحت **Popover API** «متاحة حديثًا» هذا العام، أي إنها مدعومة الآن في المتصفحات الأربعة الرئيسية. وهذا يجعل الوقت مثاليًا لمعرفة كيف تساعدك على التخلص من شيفرة JavaScript الملتوية واستبدالها بواجهة تصريحية أنيقة!

  - key: highlight.blocking_render.html2026
    t: |
      سيسعد المهتمون بالتحكم في كيفية تحميل المواقع (FOUC، أي ظهور المحتوى دون تنسيق) بالتعرف على `blocking="render"`. وكما يوحي الاسم، يمكن لهذه السمة أن تجعل وسم `<link>` أو `<script>` أو `<style>` يحجب عرض الصفحة حتى يكتمل تحميله.

      لم يصل دعم المتصفحات إلى المستوى المطلوب بعد، لكنها بالتأكيد ستجعل تجربة تحميل الويب أكثر سلاسة بكثير عندما تحظى بدعم واسع.

  - key: highlight.element_internals.html2026
    t: |
      إذا كنت تكتب مكونات ويب، فلا بد أنك احتجت كثيرًا إلى تحديد فئات زائفة مخصصة أو خصائص ARIA افتراضية، أو جعل مكون يتصرف كعنصر نموذج عادي.

      تتولى **ElementInternals** كل ذلك وأكثر! والأفضل من ذلك؟ إنها متاحة على نطاق واسع ومدعومة في جميع المتصفحات منذ عام 2023!

  - key: highlight.payment_request_api.html2026
    t: |
      «وصفتي المفضلة لكعكة الجزر؟ بالتأكيد، سأخبرك! لكن أولًا، هل ترغب في شراء مرتبة جديدة؟ أو ربما حذاء؟».

      قد تبدو الإعلانات جزءًا لا مفر منه من الويب، خصوصًا عندما تحاول خبز حلوى جديدة. لكن **PaymentRequest API** قد تكون الخطوة الأولى نحو جعل المدفوعات الصغيرة المدمجة في المتصفح حقيقةً. وهذا وحده يجعلها جديرة بالمتابعة.

  - key: highlight.search_element.html2026
    t: |
      يُعد عنصر `<search>` من المكاسب السهلة التي لا تتطلب جهدًا كبيرًا لإضافتها إلى قائمة أفضل ممارساتك. الخطوة الأولى: استخدمه للدلالة على أي حقل بحث في تطبيقاتك. الخطوة الثانية: هذا كل شيء!

      والآن بعد أن أصبح مدعومًا في المتصفحات الأربعة الرئيسية، لم يعد هناك سبب حقيقي لعدم استخدامه.

  ###########################################################################
  # Takeaways
  ###########################################################################

  - key: features.all_features.takeaway.html2026
    t: >
      يدعم هذا الجدول الآن التصفية حسب حالة [Baseline](https://web.dev/baseline)، وهي طريقة سهلة لمعرفة الميزات الجاهزة للاستخدام في جميع المتصفحات الرئيسية بنظرة سريعة.

  - key: features.features_ratios_over_time.takeaway.html2026
    t: >
      تشمل الميزات التي ازداد استخدامها `datalist` المذكور سابقًا (**+14%**)، وكذلك `dialog` (**+15%**) وPopover API (**+19%**)، وبالأخص `<dialog.closedBy="any">` المفيد جدًا (**+20%**).


      وفي المقابل، يمنحنا النظر إلى الوعي بالميزات رؤى مثيرة حول الميزات التي قد يزداد استخدامها بشدة في المستقبل القريب، مثل File System Access (**+24%**).

  - key: forms.forms_features.takeaway.html2026
    t: |
      يجدر تسليط الضوء على عنصر `datalist`، الذي شهد زيادة كبيرة في الاستخدام مقارنةً بالعام السابق، إذ ارتفعت نسبته من **30%** إلى **44%**.


      لكن في الوقت نفسه، انخفضت المواقف الإيجابية من **44%** إلى **34%** (فتراجع من المركز الأول إلى المركز 18 في الترتيب العام).


      تشير تعليقات المشاركين إلى صعوبات في التنسيق وإمكانية الوصول وأخطاء المتصفحات، ما يدل على أن التحسينات بعد الإطلاق لم تلبِ توقعات المطورين تمامًا، ويظهر مجددًا أن الانتقادات تزداد غالبًا مع زيادة استخدام الميزة.

  - key: forms.forms_pain_points.takeaway.html2026
    t: |
      كما في السنوات السابقة، لا يزال **التنسيق والتخصيص** من أبرز المشكلات المتعلقة بالنماذج.

  - key: content.content_features.takeaway.html2026
    t: |
      لا يزال المطورون يحبون **Sanitizer API**، وقد أعرب كثيرون في تعليقاتهم عن أسفهم لغياب دعمها حاليًا في Safari.

  - key: content.content_pain_points.takeaway.html2026
    t: |
      كما في العام الماضي، تظل **إعادة استخدام HTML** عمومًا، ودعم قوالب HTML الأصلية تحديدًا، أكبر المشكلات المتعلقة بالمحتوى لدى المطورين.

  - key: interactivity.interactivity_features.takeaway.html2026
    t: |
      عمومًا، لا تزال الميزات المتعلقة بالتفاعلية ضمن أعلى المراتب من حيث المواقف الإيجابية، ولا يجد معظم المطورين الكثير من الأمور السلبية ليقولوها عنها.

  - key: interactivity.interactivity_pain_points.takeaway.html2026
    t: |
      كان دعم المتصفحات مشكلة كبيرة العام الماضي، ولا يختلف الأمر هذا العام.

  - key: performance.performance_features.takeaway.html2026
    t: |
      كما في العام الماضي، لا تزال سمتا `srcset` و`sizes` مثيرتين للجدل بسبب صياغتهما المعقدة.

  - key: performance.performance_pain_points.takeaway.html2026
    t: |
      كما رأينا سابقًا، لا يزال تحميل الصور نقطة مؤلمة، ولا سيما عند التعامل مع أحجام متعددة.

  - key: web_components.web_components_features.takeaway.html2026
    t: |
      قد يكون **Shadow DOM** مفهومًا رائعًا (واسمه رائع أيضًا!)، لكنه لا يزال معقدًا بعض الشيء بحيث يصعب على كثير من المطورين استيعابه.

  - key: web_components.web_components_pain_points.takeaway.html2026
    t: |
      لا يزال غياب حالة استخدام واضحة مشكلةً لمكونات الويب، إذ يقول كثير من المطورين إنهم غالبًا لا يرون سببًا يدعوهم إلى استخدامها.

  - key: system_capabilities.system_capabilities_features.takeaway.html2026
    t: |
      رغم استمرار ضعف استخدام كثير من ميزات الأجهزة، فإن سهولة الاستفادة من واجهات برمجة تطبيقات متخصصة مثل **WebUSB** و**Web Bluetooth** بفضل البرمجة بمساعدة الذكاء الاصطناعي قد تفتح لها استخدامات جديدة مستقبلًا.

  - key: system_capabilities.system_capabilities_pain_points.takeaway.html2026
    t: |
      رغم أن **دعم المتصفحات** أصبح مشكلة أقل قليلًا مقارنةً بالعام الماضي، فإنه لا يزال أبرز ما يعيق الاستفادة من إمكانات النظام والأجهزة.

  # a11y

  - key: accessibility.accessibility_features.takeaway.html2026
    t: |
      رغم شيوع استخدام السمة **tabindex**، أفاد كثير من المشاركين بأن واجهة برمجة التطبيقات مربكة وصعبة القراءة.

  - key: accessibility.accessibility_techniques.takeaway.html2026
    t: |
      من المشجع أن نرى كل تقنيات إمكانية الوصول المذكورة هنا تزداد انتشارًا خلال العام الماضي.

  - key: accessibility.accessibility_disabilities.takeaway.html2026
    t: |
      بما أن منصة الويب توفر الآن مزيدًا من الأدوات لتلبية احتياجات مجموعة أوسع من المستخدمين، فقد أصبح علينا مراعاة هذه الاحتياجات في عملية التطوير.

  - key: accessibility.accessibility_screenreaders.takeaway.html2026
    t: |
      تتفوق مجددًا الأدوات سهلة الوصول مثل VoiceOver أو أدوات مطوري Chrome على الخيارات الأكثر تخصصًا.

  - key: accessibility.accessibility_tools.takeaway.html2026
    t: |
      يبدو في هذه المرحلة أن أدوات المطور في المتصفح أصبحت البوابة الفعلية إلى ممارسات جيدة لإمكانية الوصول.

  - key: accessibility.accessibility_ai_impact.takeaway.html2026
    t: |
      قد تظن أن البرمجة بمساعدة الذكاء الاصطناعي تضر بإمكانية الوصول لأن المطورين يولون الشيفرة الفعلية اهتمامًا أقل، لكن اتضح أن العكس صحيح، مع وجود تنبيه مهم.

      وكما أشار كثير من المعلقين، عليك أن تجعل إمكانية الوصول إحدى أولوياتك صراحةً لضمان أن ينتج النموذج اللغوي الكبير شيفرة مهيأة للوصول. وهذا في النهاية لا يختلف كثيرًا عما كان عليه الحال سابقًا!

  - key: accessibility.accessibility_pain_points.takeaway.html2026
    t: |
      لا يزال أكبر عائق أمام إمكانية الوصول هو عدم توفر أدوات اختبار جيدة. وإلى جانب المشكلات التقنية، يظل إقناع الشركات بتقدير إمكانية الوصول كما ينبغي تحديًا قائمًا.

  # usage
  - key: usage.html_interoperability_features.takeaway.html2026
    t: |
      يقترب **Select القابل للتخصيص** من خط النهاية، ويشعر المطورون بذلك؛ إذ لم يتبق سوى Firefox دون دعم هذه الميزة التي طال انتظارها.


      وفي الوقت نفسه، بعد أن أصبحت Popover API مدعومة في جميع المتصفحات الرئيسية، انخفض عدد المطورين الذين يذكرون دعم المتصفحات عائقًا أمام اعتمادها، كما ينبغي.

  - key: usage.html_functionality_features.takeaway.html2026
    t: |
      انخفض تقييم `<select>` بنسبة 10% مقارنةً بالعام الماضي، ويُعزى ذلك على الأرجح إلى التقدم المحرز في تسهيل تنسيقه وتخصيصه. وهذا يمنح **حقول إدخال التاريخ** الشرف المشكوك فيه لتصدر قائمة الميزات ذات القيود الأشد تأثيرًا.

  - key: usage.html_missing_elements.takeaway.html2026
    t: |
      ما زلنا نريد **جداول بيانات** أصلية، وتأتي علامات التبويب في المرتبة الثانية بفارق ضئيل.

  - key: usage.html_styling_issues.takeaway.html2026
    t: |
      تؤكد هذه التصنيفات أساسًا نتائج ظهرت في أسئلة أخرى: لا يزال التنسيق مشكلة كبيرة، ولا سيما في عناصر النماذج. وفي وقت تحرز فيه CSS نفسها تقدمًا بوتيرة غير مسبوقة، من المحبط عدم القدرة على الاستفادة من كل هذه الإمكانات في بعض العناصر الأكثر شيوعًا في أي واجهة ويب.

  - key: usage.progressive_enhancement_priority.takeaway.html2026
    t: |
      اعتُمد التحسين التدريجي منذ زمن بوصفه إحدى أفضل الممارسات الأساسية في قطاعنا، لكن كما هي الحال مع كثير من المبادئ الحسنة النية، غالبًا ما توجد فجوة كبيرة بين النظرية والتطبيق.


      في هذه الحالة، لا يهتم 43% كاملين من المشاركين بجعل تطبيقاتهم أو مواقعهم تعمل دون JavaScript. وعلى الطرف الآخر من الطيف، لا يعد ذلك شرطًا إلا لدى 4%.


      وهذا مؤسف، لأن اعتبار التحسين التدريجي «أولوية عالية» ارتبط أيضًا باستخدام مزيد من **تقنيات إمكانية الوصول**.

  - key: usage.html_css_js_balance.takeaway.html2026
    t: |
      لا تزال قواعد شيفرتنا تحتوي على الكثير من JavaScript (أو TypeScript). لكن ذلك قد يتغير مع توسيع المتصفحات إمكاناتها الأصلية، ما يتيح لـHTML وCSS تولي بعض المهام التي تؤديها JavaScript حاليًا.

  - key: usage.ai_generated_code_balance.takeaway.html2026
    t: |
      من المثير للاهتمام مقارنة نتائج شرائح مختلفة من مجتمع مطوري الويب فيما يتعلق باستخدام الذكاء الاصطناعي.


      بلغ وسيط الشيفرة التي ينتجها الذكاء الاصطناعي لدى المشاركين في [حالة المطورين](https://2026.stateofdevs.com/en-US/ai/#ai_generated_code_balance) 63%، وهو أعلى بكثير من نسبة 50% المسجلة هنا. أما بالنسبة إلى [شيفرة CSS تحديدًا](https://2026.stateofcss.com/en-US/usage/#css_ai_generated_code_balance)، فقد كان الوسيط أقل بكثير وبلغ 13% فقط!

  - key: usage.ai_browser_apis.takeaway.html2026
    t: |
      من المؤكد أن تجنب استدعاءات واجهات برمجة التطبيقات البطيئة والحصول على ميزات الذكاء الاصطناعي مباشرةً في متصفحك أمر جذاب، لكن الإقبال عليه لا يزال محدودًا في الوقت الحالي.

  - key: usage.html_pain_points_freeform.takeaway.html2026
    t: |
      رغم أن معظم المشاركين تمكنوا بالفعل من مشاركة إحباطاتهم في بقية الاستطلاع، فإن غياب تضمين HTML الأصلي أو القوالب ورد مجددًا هنا على لسان عدد قليل منهم.

  ###########################################################################
  # Conclusion
  ###########################################################################

  - key: conclusion.html2026.kilian_valkhof.name
    t: Kilian Valkhof
  - key: conclusion.html2026.kilian_valkhof.bio
    t: مبتكر Polypane
  - key: conclusion.html2026.kilian_valkhof
    t: >
      لا أعرف رأيك، لكنني أشعر أن الأمور _تتحرك_ في الطبقة الأساسية للويب.


      ### إمكانات جديدة


      تختبر المتصفحات عناصر جديدة تتيح للمستخدمين منح الأذونات (مثل استخدام الكاميرا) دون الحاجة إلى JavaScript. نحن _قريبون جدًا_ من دعم Select القابل للتخصيص في جميع المتصفحات، كما تظهر إمكانات جديدة للنماذج: اللون ومفتاح التبديل و`showPicker()` وربما حتى عنصر `rangegroup` جديد. وتجعل ميزات مثل `<dialog>` و`<details>` والسمة `popover` حياتنا أسهل الآن.


      ما يجعل كثيرًا من واجهات برمجة التطبيقات هذه رائعة هو طبيعتها التصريحية. لماذا تتحمل مسؤولية معالج النقر بينما يكتب `command="show-modal" commandfor="dialog"` شيفرة أقل ويتولى أمورًا أكثر؟ يتضح من نتائج الاستطلاع أن كثيرين منا يوافقون على ذلك. وتحظى واجهات برمجة التطبيقات المتعلقة بالمحتوى وعناصر HTML بأكبر قدر من التقدير.


      ومن الأمور الأخرى التي اتضحت هذا العام أن «الطبقة الأساسية» للويب لا يلزم أن تعني الويب الذي يتفاعل معه المستخدم مباشرةً. فميزات مثل قواعد التنبؤ (JSON تصريحي) وWebMCP التصريحي، وحتى سمتَي `loading` و`fetchpriority`، يمكن أن تساعد وكيل المستخدم على اتخاذ قرارات أفضل بشأن تحميل البيانات والتفاعلات، وإذا نُفذت جيدًا فلن يلاحظها المستخدم أصلًا.


      ### إحباطات مستمرة


      من ناحية أخرى، لا يبدو أن مجموعة من الميزات تحظى بانتشار كبير بين المطورين. خذ `datalist` مثلًا؛ لا يمكن الاعتماد على مربع الاقتراحات الأنيق، حتى لو _بدا_ أن استخدامه يمنحك «قائمة اختيار مع مربع بحث»، لذا نتجاهله. وواجهات مثل WebUSB وSpeechRecognition ممتعة، لكن حالات استخدامها محدودة. وماذا عن `<model>`؟ عنصر كامل لمجرد عرض ملفات نماذج ثلاثية الأبعاد ثابتة؟


      لا تزال الاختلافات بين المتصفحات مصدرًا دائمًا للإحباط، لكن يبدو أن المشكلة تحولت من اختلاف المتصفحات في طريقة عملها إلى عدم مواكبة بعضها للتطور بعد.


      ويبدو أن أبرز نقطة مؤلمة هذا العام تحديدًا هي تأثير أنظمة تشغيل الهواتف وخيارات واجهاتها على الويب. فما تزال أنظمة تشغيل الهواتف غير ناضجة نسبيًا: هل سننظر بعد عقد من الزمن إلى هذه الفترة ونعدها شبيهة بالأيام الأولى للمنافسة بين Firefox وIE؟


      ### حكاية إمكانية الوصول


      من المشجع جدًا أن نرى أن إمكانية الوصول من أهم اهتمامات المشاركين في الاستطلاع، ولسبب وجيه. فلا يمكن تحقيق إمكانية وصول جيدة من دون HTML جيدة، ولا تكون HTML جيدة من دون مراعاة إمكانية الوصول. فهما ليسا الشيء نفسه، لكنهما متداخلان.


      لإمكانية الوصول جوانب متعددة، ما يصعّب على المطورين معرفة ما إذا كانوا يفعلون الصواب لجميع المستخدمين؛ وهنا يمكن للمتصفحات أن تؤدي دورًا في تسهيل ذلك.


      *ملاحظة المحرر: ألقِ نظرة على متصفح [Polypane](https://polypane.app/) الخاص بـKilian، فهو يفعل ذلك تمامًا!*


      ### ما التالي؟


      ما الذي لا يزال مدرجًا في قائمة أمنياتنا؟ بعد وصول Select القابل للتخصيص أخيرًا، سنرغب في تخصيص كل ما يتعلق بالنماذج (فلنبدأ بـ`datalist`، أليس كذلك؟).


      يُعد تضمين HTML ميزة أخرى تتصدر قوائم أمنيات كثيرين منا. ويجري العمل في [OpenUI](https://open-ui.org/) على أمور مثل علامات التبويب و`focusgroup`. فهل أصبحت المكونات الشبيهة بالتطبيقات شائعة بما يكفي لتوحيدها رسميًا؟ أم سننتقل إلى جعل HTML تتولى مزيدًا من الإمكانات غير الظاهرة للمستخدم؟ الأيام كفيلة بالإجابة.


      بالنظر إلى ما كتبته الدكتورة Lea Verou [العام الماضي](https://2025.stateofhtml.com/en-US/conclusion/)، يبدو أن المنصة تسير بالتأكيد في الاتجاه الصحيح من وجهة نظرنا كمطورين، حتى إن لم تحقق قفزات هائلة.


      اختفت مشكلات رئيسية ببساطة بفضل الدعم الواسع لـ`dialog` و`popover`، وسيفعل Select القابل للتخصيص الشيء نفسه قريبًا لكثير من واجهات المستخدم. HTML هي الطبقة الأساسية للويب، لذا ربما لا يكون من السيئ أن تتطور ببطء أكبر وبقدر أكبر من التروي. قد يشهد قطاعنا اضطرابًا، لكنني أعتقد أن أساسنا متين.

  - key: about.content.html2026
    t: |
      أُجري استطلاع حالة HTML لعام 2026 من 19 يوليو إلى 1 سبتمبر 2026، وجُمع فيه 6,223 ردًا.

      صممت [Lea Verou](https://lea.verou.me/) الاستطلاع أساسًا، كما صُمم بالتعاون عبر [نقاش مفتوح على GitHub](https://github.com/Devographics/surveys/issues/253).

      يتولى [Sacha Greif](https://sachagreif.com/) تشغيل البنية التحتية للاستطلاع، بمساعدة فريق من المساهمين والاستشاريين في المصادر المفتوحة.

      صمم [Christopher Kirk-Nielsen](http://chriskirknielsen.com/) شعار هذا العام وقميصه.

      ### أهداف الاستطلاع

      أُعد هذا الاستطلاع للتعرف على الاتجاهات القادمة في منظومة تطوير الويب ومساعدة المطورين على اتخاذ قرارات تقنية.

      لذلك يركز الاستطلاع على توقع ما سيأتي خلال السنوات القليلة المقبلة بدلًا من تحليل ما هو شائع الآن، ولهذا لا يشمل دائمًا الميزات أو التقنيات الأكثر انتشارًا حاليًا.

      ينبغي أيضًا اعتباره **صورةً لفئة محددة من المطورين**، فهو لا يهدف إلى تمثيل المنظومة بأكملها.

      كان الاستطلاع متاحًا للجميع عبر الإنترنت، ولم تُصفَّ المشاركات أو تُنتقَ بأي طريقة.

      ### تمويل المشروع

      يأتي تمويل هذا المشروع من مصادر متنوعة:

      - **مبيعات القمصان**.

      - **الروابط المدعومة**: يوفر شريكنا [Frontend Masters](https://frontendmasters.com/) روابط الموارد الموصى بها أسفل كل صفحة.

      - **مصادر تمويل أخرى**: ساهمت [Google](https://www.google.com/) و[TokyoDev](https://www.tokyodev.com/) أيضًا في تمويل العمل على الاستطلاع.

      ### نظرة تقنية عامة

      يمكنك الاطلاع [هنا](https://dev.to/sachagreif/how-the-devographics-surveys-are-run-2023-edition-1p6a) على شرح تقني مفصل لكيفية إجراء الاستطلاعات.