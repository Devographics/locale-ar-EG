locale: ar-EG
translations:
  ###########################################################################
  # General
  ###########################################################################

  - key: general.results.description.html2025
    t: إصدار 2025 من الاستطلاع السنوي حول أحدث الاتجاهات في منظومة HTML.

  - key: general.html2025.survey_intro
    t: |
      في عام 2023، وبعد أن استمرت استطلاعات حالة جافا سكريبت وحالة CSS لعدة سنوات، أدركنا أن هناك شيئًا مفقودًا: ماذا عن التكنولوجيا التي تجمع كل شيء معًا؟

      في النهاية، يتجاوز HTML الآن مجرد العلامات والخصائص، ليشمل واجهات برمجة التطبيقات للتحديثات الديناميكية، والتضمينات الغنية، وتلميحات الأداء، والقوالب والمكونات، والمزيد.

      حطمت أول دراسة حالة لـ HTML، بقيادة نجمة الويب [ليا فيرو](https://lea.verou.me/)، جميع الأرقام القياسية السابقة لاستطلاع جديد بمشاركة 21000 مستجيب، وقدمت نماذج جديدة لواجهة المستخدم أدت إلى تحسين جميع الاستطلاعات المستقبلية.

      هذا العام، ومع عودة ليا إلى القيادة، أضفنا ✨35 ميزة جديدة✨، وقدمنا ​​قسمين جديدين: **الرسومات والوسائط المتعددة** و**الأداء**.

      علاوة على ذلك، وكما هو الحال في الإصدارات السابقة، ستؤخذ نتائج هذا العام في الاعتبار من قبل موردي المتصفحات عند تحديد خططهم المستقبلية، لذا فإن المشاركة يمكن أن تساعد في تشكيل مستقبل الويب!


      هل أنت مستعد؟ انطلق!

  - key: features.features_intro_html2025
    aliasFor: features.features_intro_html2024

  - key: introduction.html2025
    t: |
      إذا أردت تكوين فكرة عن مدى تطور إمكانات منصة الويب خلال السنوات القليلة الماضية، فما عليك سوى إلقاء نظرة على فئات هذا الاستطلاع.

      النماذج والرسومات وميزات الأداء وطرق التفاعل مع واجهات برمجة تطبيقات الأنظمة والأجهزة وإمكانية الوصول… من العجيب أن يتمكن أحد من متابعة كل ذلك!

      لحسن الحظ، هناك شخص واحد على الأقل يستطيع ذلك: [Lea Verou](https://lea.verou.me/)، التي انضمت إلينا مجددًا هذا العام لتحديث الاستطلاع بعد أن صممت نسخته الأصلية عام 2023.

      ومن المجالات التي ركزنا عليها معًا هذا العام تحليل العدد الهائل من الإجابات المفتوحة حول جوانب مختلفة من المشكلات.

      ستتمكن الآن من التعمق أكثر في البيانات المصنفة، فضلًا عن الوصول إلى إجابات المشاركين الأصلية والبحث فيها.

      وإذا لم يحقق هذا شيئًا آخر، فسيذكرنا بأننا جميعًا في هذا معًا، نتشارك الإحباطات نفسها، وكذلك الآمال نفسها!

      <span class="conclusion__byline">– Sacha Greif</span>

  - key: faq.survey_design_html2025
    t: كيف صُمم هذا الاستطلاع؟
  - key: faq.survey_design_html2025.description
    t: >
      صُمم هذا الاستطلاع نتيجة [عملية تصميم مفتوحة](https://github.com/Devographics/surveys/issues/253) شاركت فيها شركات المتصفحات ومجتمع تطوير الويب.

  - key: faq.results_released_html2025
    t: متى ستُنشر النتائج؟
  - key: faq.results_released_html2025.description
    t: سيُجرى الاستطلاع من 15 يوليو إلى 15 أغسطس 2025، وستُنشر نتائجه قرابة 15 سبتمبر 2025.

  ###########################################################################
  # Figures
  ###########################################################################

  - key: figure.figure_lazy_loading_usage.html2025
    t: نسبة المشاركين الذين استخدموا **التحميل الكسول**، وهي الميزة الأكثر استخدامًا بين الميزات ذات حالة Baseline «متاحة حديثًا».

  - key: figure.figure_content_security_usage.html2025
    t: أكبر زيادة في الاستخدام مقارنةً بالعام السابق، وكانت لميزة **سياسة أمن المحتوى**.

  - key: figure.figure_forms_features.html2025
    t: عدد التعليقات على الميزة الأكثر تعليقًا، وهي **datalist**.

  ###########################################################################
  # Highlights
  ###########################################################################

  - key: highlight.customizable_select.html2025
    t: |
      قد لا تحظى **قوائم Select القابلة للتخصيص** بدعم واسع حاليًا، لكنها ميزة تستحق التعرف عليها. فرغم أن **7.1%** فقط من المشاركين استخدموها، أفاد **89%** من المطورين الذين *استخدموها* بتجربة إيجابية.

      وبما أن تنسيق عنصر `<select/>` كان دائمًا تحديًا، فإن القدرة أخيرًا على تخصيصه وفق احتياجاتك دون اللجوء إلى حلول ملتوية باستخدام JavaScript تحسن مرحب به!

  - key: highlight.jpeg_xl.html2025
    t: |
      بعد جدل نطق "JIF/GIF" والاسم المربك "PNG" («بي إن جي»؟ «بينغ»؟)، قرر المسؤولون عن تسمية تنسيقات الصور تبسيط الأمر هذه المرة: أخذوا JPEG الشائع وأضافوا إليه "XL" ليبدو أكثر روعة.

      لكن ليس أكبر حجمًا؛ فعلى عكس ما يوحي به الاسم، تكون صور JPEG XL *أصغر* فعلًا من JPEG القديم الممل، مع أنها متوافقة معه بطريقة ما. لا تسألني كيف يعمل ذلك.

  - key: highlight.hidden_until_found.html2025
    t: |
      هل تعلم أن المتصفحات أصبحت قادرة على لعب الغميضة؟ تتيح لك السمة `hidden="until-found"` إخفاء عنصر حتى يستدعيه المستخدم، كأن ينقر مثلًا على رابط مرساة يشير إليه.

      في الوقت الحالي، لا تزال هذه الميزة «مخفية» فعلًا، إذ لم يسمع بها من قبل **79.4%** من المشاركين. كما أن دعم المتصفحات لها لا يزال محدودًا (ننظر إليك يا Safari!). لكن عندما يتحسن التوافق، قد يتضح أنها تستحق الإضافة إلى أدواتك.

  - key: highlight.popover_api.html2025
    t: |
      أصبحت **Popover API** «متاحة حديثًا» هذا العام، أي إنها مدعومة الآن في المتصفحات الأربعة الرئيسية. وهذا يجعل الوقت مثاليًا لمعرفة كيف تساعدك على التخلص من شيفرة JavaScript الملتوية واستبدالها بواجهة تصريحية أنيقة!

  - key: highlight.blocking_render.html2025
    t: |
      سيسعد المهتمون بالتحكم في كيفية تحميل المواقع (FOUC، أي ظهور المحتوى دون تنسيق) بالتعرف على `blocking="render"`. وكما يوحي الاسم، يمكن لهذه السمة أن تجعل وسم `<link>` أو `<script>` أو `<style>` يحجب عرض الصفحة حتى يكتمل تحميله.

      لم يصل دعم المتصفحات إلى المستوى المطلوب بعد، لكنها بالتأكيد ستجعل تجربة تحميل الويب أكثر سلاسة بكثير عندما تحظى بدعم واسع.

  - key: highlight.element_internals.html2025
    t: |
      إذا كنت تكتب مكونات ويب، فلا بد أنك احتجت كثيرًا إلى تحديد فئات زائفة مخصصة أو خصائص ARIA افتراضية، أو جعل مكون يتصرف كعنصر نموذج عادي.

      تتولى **ElementInternals** كل ذلك وأكثر! والأفضل من ذلك؟ إنها متاحة على نطاق واسع ومدعومة في جميع المتصفحات منذ عام 2023!

  - key: highlight.payment_request_api.html2025
    t: |
      «وصفتي المفضلة لكعكة الجزر؟ بالتأكيد، سأخبرك! لكن أولًا، هل ترغب في شراء مرتبة جديدة؟ أو ربما حذاء؟».

      قد تبدو الإعلانات جزءًا لا مفر منه من الويب، خصوصًا عندما تحاول خبز حلوى جديدة. لكن **PaymentRequest API** قد تكون الخطوة الأولى نحو جعل المدفوعات الصغيرة المدمجة في المتصفح حقيقةً. وهذا وحده يجعلها جديرة بالمتابعة.

  - key: highlight.search_element.html2025
    t: |
      يُعد عنصر `<search>` من المكاسب السهلة التي لا تتطلب جهدًا كبيرًا لإضافتها إلى قائمة أفضل ممارساتك. الخطوة الأولى: استخدمه للدلالة على أي حقل بحث في تطبيقاتك. الخطوة الثانية: هذا كل شيء!

      والآن بعد أن أصبح مدعومًا في المتصفحات الأربعة الرئيسية، لم يعد هناك سبب حقيقي لعدم استخدامه.

  ###########################################################################
  # Takeaways
  ###########################################################################

  - key: forms.forms_features.takeaway.html2025
    t: |
      على نحو مفاجئ، كانت `<input type="color"/>` أكثر الميزات المتعلقة بالنماذج استخدامًا هذا العام، إذ أفاد **41.8%** من المشاركين باستخدامها.

      لكن عند النظر إلى المواقف الإيجابية، تتصدر اللبنات الأساسية لواجهات المستخدم مثل الإكمال التلقائي (`<datalist>`) والقوائم المنسدلة (Select القابلة للتخصيص) الترتيب، ما يوضح تقدير المطورين للميزات القابلة للتخصيص والموائمة لاحتياجاتهم.

  - key: forms.forms_pain_points.takeaway.html2025
    t: |
      لا يزال **تنسيق عناصر التحكم الافتراضية في النماذج وتخصيصها** عقبة كبيرة، إذ تتعلق به نحو **نصف** المشكلات.

      ويُعد **التحقق من صحة النماذج** مشكلة أيضًا، وخصوصًا في حالات الاستخدام المتقدمة مثل التحقق من قيمة حقل بناءً على قيمة حقل آخر.

  - key: graphics_multimedia.graphics_multimedia_features.takeaway.html2025
    t: |
      كانت **JPEG XL** و**ctx.drawElement()** الميزتين الجديدتين اللتين حصدتا أكثر المواقف الإيجابية، بينما لم تحرز المجالات الأكثر تعقيدًا مثل واجهات برمجة تطبيقات الواقع المعزز أو الممتد نتائج مماثلة؛ ما يوضح مجددًا أن اهتمام المطورين الأول ينصب على الأدوات الأساسية التي تسهل حياتهم اليومية.

  - key: graphics_multimedia.graphics_pain_points.takeaway.html2025
    t: |
      لطالما كان SVG الحصان الأسود للويب؛ تهمله شركات المتصفحات باستمرار، ومع ذلك يُستخدم في كل موقع تقريبًا. لذا ليس من المستغرب أن يتصدر هنا، إذ يتعلق به ربع المشكلات.

  - key: content.content_features.takeaway.html2025
    t: |
      كانت الميزتان الأكثر إعجابًا والأكثر استياءً مرتبطتين بالأمان: حصدت **Sanitizer API** أكثر الآراء الإيجابية، بينما تصدرت **سياسة أمن المحتوى** قائمة الإحباط.

      يسلط هذا التباين الضوء على الترحيب بآليات الأمان التي تقلل التعقيد وتندمج بسلاسة مع سير العمل الحالي، في حين أن الآليات التي تفرض سياسات صارمة أو تتطلب إعدادًا دقيقًا أو تعطل شيفرة كانت تعمل سابقًا قد تثير الاستياء.

  - key: content.content_pain_points.takeaway.html2025
    t: |
      ترسم البيانات صورة واضحة جدًا: إن أكثر مشكلات المحتوى إلحاحًا بفارق كبير هي **إعادة استخدام HTML** بين الصفحات وداخل الصفحة نفسها. ورغم أن ذلك ممكن بالفعل باستخدام أدوات البناء وأطر عمل الواجهات الأمامية القائمة على المكونات، يبدو أن هناك طلبًا كبيرًا على ميزة أصلية في المنصة.

  - key: interactivity.interactivity_features.takeaway.html2025
    t: |
      هناك طلب هائل على عناصر أساسية تصريحية بسيطة وقابلة للتخصيص للأمور الشائعة، كما يتضح من النسبة الكبيرة للمواقف الإيجابية تجاه كل ميزة HTML في هذه الفئة.

  - key: interactivity.interactivity_pain_points.takeaway.html2025
    t: |
      ترسل النسبة الكبيرة لمشكلات دعم المتصفحات المذكورة هنا رسالة واضحة: «نحب كل هذه الميزات الجديدة التي قدمتموها لنا؛ والآن اجعلوها تعمل في كل مكان كي نتمكن من استخدامها فعلًا!».

  - key: performance.performance_features.takeaway.html2025
    t: |
      الرسالة واضحة وصريحة: تجربة المطور مع `srcset` و`sizes` تحتاج إلى تحسين! يقع طرفا الطيف حولهما؛ إذ تتصدر `srcset`/`sizes` قائمة الإحباط، بينما كانت `sizes="auto` الميزة الأكثر إعجابًا لأنها تخفف بعض هذه المعاناة.

  - key: performance.performance_pain_points.takeaway.html2025
    t: |
      الغاية الأساسية من الويب هي إتاحة الوصول إلى المحتوى البعيد. لذلك يبدو غريبًا بعض الشيء أن يكون **تحميل** هذا المحتوى فكرة لاحقة في كثير من الأحيان، مع إحراز تقدم ضئيل خلال الثلاثين سنة الماضية باستثناء تحسينات طفيفة على رسوم مؤشرات التحميل.

  - key: web_components.web_components_features.takeaway.html2025
    t: |
      نرى مجددًا تفوق الحلول التصريحية، إذ تصدرت **العناصر المخصصة التصريحية** مخطط المواقف.

  - key: web_components.web_components_pain_points.takeaway.html2025
    t: |
      نعلم أن **توسيع العناصر المضمنة** ميزة مطلوبة منذ زمن طويل، وتؤكد هذه النتائج ذلك؛ فهي أبرز موضوع ملموس ضمن المشكلات هنا (بعد الموضوعات الأكثر تجريدًا المتعلقة بالتعقيد والاعتماد على JS وإمكانية الوصول).

  - key: web_components.web_components_other_pain_points.takeaway.html2025
    t: |
      مقارنةً بالسنوات السابقة، لا تزال الموضوعات نفسها حاضرة: عبء معرفي مرتفع، وقصور مقارنةً بمكونات أطر العمل، وكون Shadow DOM مشكلة أكثر منه حلًا.

  - key: system_capabilities.system_capabilities_features.takeaway.html2025
    t: |
      فتح ملف وحفظه من أبسط إمكانات التطبيقات، ومع ذلك لم يكن متاحًا لتطبيقات الويب حتى وقت قريب، إلى أن ظهرت **File System Access API**. لذا ليس من المستغرب أن تتصدر مخطط المواقف الإيجابية.

      ومن ناحية أخرى، حصدت واجهات برمجة تطبيقات الأجهزة مثل **WebUSB** و**Web Bluetooth** و**WebNFC** أقل قدر من الاهتمام، ما يؤكد مجددًا أن الميزات الأكثر جذبًا للاهتمام هي التي تحل مشكلات شائعة وأساسية.

  - key: system_capabilities.system_capabilities_pain_points.takeaway.html2025
    t: |
      ترسم البيانات صورة شديدة الوضوح: أبرز مشكلة هنا ليست سهولة الاستخدام ولا القيود، بل **دعم المتصفحات**، وبشكل أدق شركة بعينها يرى كثير من المطورين أنها تعرقل تقدم منصة الويب.

  # a11y

  - key: accessibility.accessibility_features.takeaway.html2025
    t: |
      ليست **عناصر المعالم** (`<main>` و`<nav>` وغيرها) جديدة أو مثيرة جدًا، لكنها تظل أساسًا لإمكانية الوصول إلى الويب.

  - key: accessibility.accessibility_pain_points.takeaway.html2025
    t: |
      رغم وجود فجوات تقنية في مجال إمكانية الوصول (مثل ARIA عبر الجذور)، يتكرر موضوع أساسي كلما سألنا عنها: ترتبط أبرز المشكلات بـ*الأشخاص* المعنيين، وتتصدر القائمة قضايا أولويات العمل والتعليم والعبء المعرفي.

  - key: accessibility.accessibility_techniques.takeaway.html2025
    t: |
      رغم أن أمورًا مثل النص البديل والتسلسل الصحيح للعناوين أصبحت أمرًا بديهيًا لمعظم مطوري الواجهات الأمامية، فإن الأدوات الأحدث مثل مجموعة استعلامات الوسائط `prefers-` لم تصبح شائعة حقًا بعد.

  - key: accessibility.accessibility_disabilities.takeaway.html2025
    t: |
      من الجيد أن نرى أن مزيدًا من المطورين باتوا يراعون، إلى جانب المستخدمين ذوي الإعاقات البصرية، ذوي الرؤية اللونية غير النمطية والإعاقات الحركية مقارنةً بالعام الماضي.

  - key: accessibility.accessibility_screenreaders.takeaway.html2025
    t: |
      تتفوق مجددًا الأدوات سهلة الوصول مثل VoiceOver أو أدوات مطوري Chrome على الخيارات الأكثر تخصصًا. ومع ذلك، لا يزال كثير من المطورين لا يستخدمون أي نوع من قارئات الشاشة (ولاحظ أيضًا أن 39% من المشاركين تخطوا السؤال بالكامل).

  - key: accessibility.accessibility_tools.takeaway.html2025
    t: |
      شهدت أدوات المطور في المتصفح قفزة كبيرة في الاستخدام مقارنةً بنتائج العام الماضي، متجاوزةً Lighthouse لتصبح الأداة الرائدة لاختبار إمكانية الوصول.

  # usage
  - key: usage.html_interoperability_features.takeaway.html2025
    t: |
      يوجد دائمًا بعض التأخر بين حالة منصة الويب واعتمادها الفعلي في الواقع، لذا ليس من المستغرب أن تظل **Popover API** في صدارة الترتيب. لكن لا شك أن هذه الميزة أصبحت رسميًا ضمن حالة Baseline «متاحة حديثًا»، ما يعني أن استخدامها عبر المتصفحات ينبغي أن يصبح أقل إشكالًا مستقبلًا.

  - key: usage.html_functionality_features.takeaway.html2025
    t: |
      يُنظر مجددًا إلى عناصر التحكم في النماذج والعناصر التفاعلية الأخرى على أنها الأكثر تقييدًا. وبعد حل مشكلة Select القابلة للتخصيص، يبدو أن منتقيات التاريخ قد تكون الهدف التالي.

  - key: usage.html_missing_elements.takeaway.html2025
    t: |
      تتصدر **جداول البيانات** مجددًا قائمة العناصر الجديدة الأكثر طلبًا هذا العام. سيكون من الرائع بالتأكيد توفر إمكانات مضمنة للتصفية والفرز والبحث وغيرها، لكن لا يبدو أن ذلك سيتحقق قريبًا.

      ومن ناحية أخرى، يتحقق تقدم في ميزات أخرى طال انتظارها مثل عنصر **التبديل** الأصلي، ما يفسر تراجعه في الترتيب.

  - key: usage.html_styling_issues.takeaway.html2025
    t: |
      ليس من المستغرب أن تتصدر حقول إدخال النماذج قائمة أصعب العناصر تنسيقًا. ولحسن الحظ، يجري العمل على [عناصر Select القابلة للتخصيص](https://developer.chrome.com/blog/a-customizable-select)، رغم أن [دعم المتصفحات](https://web-platform-dx.github.io/web-features-explorer/features/customizable-select/) لا يزال متأخرًا.

  - key: usage.component_strategies.takeaway.html2025
    t: |
      يصعب إنكار أن مكونات JavaScript أصبحت النموذج السائد لبناء واجهات المستخدم على الويب. نعم، قد يكون التعامل مع كل أطر الواجهات الأمامية المتنافسة هذه فوضويًا، لكنه فوضى نعرفها (وربما نحبها؟)، وهذا ما يصعب على مكونات الويب تجاوز المركز الرابع.

  - key: usage.design_system_strategies.takeaway.html2025
    t: |
      أصبحت أنظمة التصميم ضرورة لمعظم المشروعات الكبيرة، وينعكس ذلك في شعبية مختلف الأساليب هذه.

  - key: usage.html_css_js_balance.takeaway.html2025
    t: |
      كما يوضح مخطط «استراتيجيات المكونات» أعلاه، أصبحت JavaScript فعليًا الحاوية لكثير من شيفرة HTML التي ننتجها، وهذا يفسر قضاءنا وقتًا طويلًا في كتابتها!

  - key: usage.what_do_you_use_html_for.takeaway.html2025
    t: |
      رغم أن المشارك المتوسط في الاستطلاع يعمل أساسًا على تطبيقات ويب ديناميكية، يقضي كثيرون منا وقتًا أيضًا في إنشاء المدونات أو المواقع الغنية بالنصوص، مستعيدين بذلك جذور HTML كلغة موجهة للمستندات.

  - key: usage.html_pain_points_freeform.takeaway.html2025
    t: |
      عند النظر عمومًا إلى مشكلات منصة الويب، يبرز دعم المتصفحات، ولا سيما في منظومة Apple.

      ونتيجة لذلك، تكتسب مبادرات مجتمعية مثل وسم [#AppleBrowserBan](https://open-web-advocacy.org/apple-browser-ban/) زخمًا، بينما تدفع مبادرة [Interop](https://web.dev/blog/interop-2025) من جانب الشركات عجلة التقدم في الاتجاه الصحيح كل عام.

  # opinions

  - key: opinions.accessibility_is_valued.takeaway.html2025
    t: |
      بما أن غياب الدعم في مكان العمل يُذكر غالبًا بوصفه عائقًا أمام تطبيق ممارسات إمكانية الوصول على نحو سليم، فمن الجيد أن نرى أن الأمور تتحسن على الأقل بين المشاركين في الاستطلاع، مع ارتفاع عمودي «أوافق» مقارنةً بالعام الماضي.

  - key: opinions.validation_is_important.takeaway.html2025
    t: |
      من السهل إغفال التحقق من صحة HTML وسط فوضى تطوير الويب الحديث. لكن المشاركين يتفقون على أنه لا يزال جزءًا مهمًا من العملية.

  - key: opinions.keeping_informed_is_challenging.takeaway.html2025
    t: |
      رغم المبادرات الرائعة مثل [Baseline](https://web-platform-dx.github.io/web-features/)، لا تزال [مواكبة منصة الويب](https://css-tricks.com/how-to-keep-up-with-new-css-features/) تحديًا. نأمل أن يساعد هذا الاستطلاع ولو قليلًا!

  - key: opinions.browser_interoperability_is_obstacle.takeaway.html2025
    t: |
      ليس من السهل أن تكون شركة متصفح في عام 2025. يشتكي المطورون من ركود المنصة، فتقدم ميزات وواجهات برمجة تطبيقات جديدة… ثم يشتكون من غياب الدعم عبر المتصفحات!

      لهذا أصبحت [Interop](https://web.dev/blog/interop-2025) جزءًا أساسيًا من العملية خلال العامين الماضيين. فهي تتيح لشركات المتصفحات تنسيق جهودها لضمان توافق الميزات، وتجنب ضياع كل عملها الشاق بسبب ضعف التوافق.

  - key: opinions.browser_interoperability_pace.takeaway.html2025
    t: |
      تنعكس نتائج جهود التوافق هذه في المخطط، إذ يتفق **75%** من المشاركين على أن التقدم يحدث بوتيرة أسرع من السابق.

  - key: opinions.web_platform_right_direction.takeaway.html2025
    t: |
      وبالمثل، يحمل **77%** من المشاركين رأيًا إيجابيًا عن الاتجاه العام لمنصة الويب.

  ###########################################################################
  # Conclusion
  ###########################################################################

  - key: conclusion.html2025.lea_verou.name
    t: د. Lea Verou
  - key: conclusion.html2025.lea_verou.bio
    t: متحدثة ومؤلفة ومستشارة حائزة على جوائز في هندسة الويب
  - key: conclusion.html2025.lea_verou
    t: >
      غالبًا ما نتوقع أن تجذب الميزات الأكثر بهرجة اهتمام المطورين الأكبر، مثل واجهات برمجة التطبيقات المدعومة بالذكاء الاصطناعي، وتقنيات 3D/XR/AR، أو واجهات برمجة تطبيقات الأجهزة. لكن ما يتصدر عامًا بعد عام ليس مبهرجًا على الإطلاق، بل يكاد يكون… عاديًا: القوائم المنسدلة، ومربعات الاختيار، والنوافذ المنبثقة، ومربعات الحوار، والتحقق من صحة النماذج، وتحميل الملفات وحفظها، والقوالب، وعرض المحتوى الذي ينشئه المستخدم بأمان، والأيقونات.

      ### جعل واجهات برمجة التطبيقات قابلة للاستخدام

      قد تعترض قائلًا: «لكن كثيرًا من هذه الأشياء موجود بالفعل!» وهذا صحيح، لكن عندما يتعذر تخصيص واجهة المستخدم المضمنة أو تنسيقها، تصبح غير قابلة للاستخدام فعليًا. ويُضطر المطورون إلى إعادة إنشائها على أي حال.


      ما إن ندرك ذلك حتى تتضح معظم نتائج الاستطلاع. فهو يفسر تصدر **Select القابلة للتخصيص** المخططات، والاستقبال الإيجابي للعناصر الأساسية منخفضة المستوى مثل النوافذ المنبثقة والمستدعين، وتقدم **SVG** و**رسم HTML على canvas** بفارق كبير على AR/VR، وحتى بروز **توسيع العناصر المضمنة** بوصفه مشكلة رئيسية في مكونات الويب.


      ففي النهاية، كم مرة يمكنك إعادة بناء زر أو قائمة منسدلة قبل أن تفقد صوابك؟ وما مدى ثقتك بأنك نفذتها على نحو صحيح؟


      ونتيجة لذلك، لا يزال بناء واجهات مستخدم تفاعلية احترافية يتطلب جمع حلول عديدة من جهات خارجية، حتى للأمور المعتادة في المنصات الاحتكارية.

      ### بطء التغيير

      هذه النتيجة ليست جديدة. ففي [أول استطلاع لحالة HTML](https://2023.stateofhtml.com/)، رأينا بالفعل مدى أهمية التنسيق والتخصيص، ولا سيما في النماذج. ويؤكد التحليل الأعمق لهذا العام أن الوضع لم يتغير؛ بل إن الإشارة أصبحت أقوى.


      لكن الأمور *تغيرت* نحو الأفضل! فالميزات التي كان يجري النقاش حولها في عام 2023 أصبحت متاحة الآن في المتصفحات الرئيسية. وميزات أخرى كانت غير عملية آنذاك—مثل **Popover API**—أصبحت مدعومة على نطاق واسع.


      ومع ذلك، لا تزال Popover تتصدر الشكاوى من دعم المتصفحات. لماذا؟ رغم تسارع وتيرة التنفيذ، لا يزال الانطباع العام متأخرًا. فقد أصبح المطورون يحتاجون إلى وقت أطول للثقة بالدعم من الوقت الذي تحتاجه المتصفحات لإطلاقه!

      ### تأثير النماذج اللغوية الكبيرة

      يُعد انتشار الشيفرة التي ينتجها الذكاء الاصطناعي أحد العوامل المساهمة. فالنماذج اللغوية الكبيرة ملمة على نحو مفاجئ بميزات منصة الويب الحديثة، وكان *يمكنها* دفع المجتمع إلى الأمام، لكنها متحفظة أكثر من اللازم في توصياتها. وقد يؤدي ذلك عمليًا إلى *إبطاء* الاعتماد! ولا تزال كيفية معالجة هذه المشكلة على نطاق واسع سؤالًا مفتوحًا. وفي الوقت نفسه، تساعد تعليمات دعم المتصفحات الصريحة؛ ومن يدري، ربما تُحل المشكلة من تلقاء نفسها إذا اتبعها عدد كافٍ من المطورين.

      ### تطلعات إلى المستقبل

      يبدو المستقبل واعدًا. يجري العمل بنشاط على كثير من المشكلات المذكورة، وبعض الحلول بدأ بالفعل بالوصول. وحتى العناصر المضمنة القابلة للتوسعة، التي عُدت سابقًا طريقًا مسدودًا، تشهد تقدمًا محتملًا بفضل العمل المبكر على السمات المخصصة.


      تشير كل هذه العناصر الأساسية إلى الاتجاه نفسه: منصة ويب تزداد مرونةً وقدرةً على التعبير، وتقترب أكثر فأكثر من الطريقة التي يبني بها المطورون واجهات المستخدم فعلًا.


      نادرًا ما يكون التقدم على الويب دراميًا، لكنه تراكمي. فكل عنصر أساسي جديد يقلل الحاجة إلى الحلول الالتفافية والمكتبات والحيل الهشة. وعندما تستقر هذه الأساسيات، سيظهر أثرها في كل مكان.

  - key: about.content.html2025
    t: |
      أُجري استطلاع حالة HTML لعام 2025 من 19 يوليو إلى 1 سبتمبر 2025، وجُمع فيه 6,223 ردًا.

      صممت [Lea Verou](https://lea.verou.me/) الاستطلاع أساسًا، كما صُمم بالتعاون عبر [نقاش مفتوح على GitHub](https://github.com/Devographics/surveys/issues/253).

      يتولى [Sacha Greif](https://sachagreif.com/) تشغيل البنية التحتية للاستطلاع، بمساعدة فريق من المساهمين والاستشاريين في المصادر المفتوحة.

      صمم [Christopher Kirk-Nielsen](http://chriskirknielsen.com/) شعار هذا العام وقميصه.

      ### أهداف الاستطلاع

      أُعد هذا الاستطلاع للتعرف على الاتجاهات القادمة في منظومة تطوير الويب ومساعدة المطورين على اتخاذ قرارات تقنية.

      لذلك يركز الاستطلاع على توقع ما سيأتي خلال السنوات القليلة المقبلة بدلًا من تحليل ما هو شائع الآن، ولهذا لا يشمل دائمًا الميزات أو التقنيات الأكثر انتشارًا حاليًا.

      ينبغي أيضًا اعتباره **صورةً لفئة محددة من المطورين**، فهو لا يهدف إلى تمثيل المنظومة بأكملها.

      كان الاستطلاع متاحًا للجميع عبر الإنترنت، ولم تُصفَّ المشاركات أو تُنتقَ بأي طريقة.

      ### تمويل المشروع

      يأتي تمويل هذا المشروع من مصادر متنوعة:

      - **مبيعات القمصان**.

      - **الروابط المدعومة**: يوفر شريكنا [Frontend Masters](https://frontendmasters.com/) روابط الموارد الموصى بها أسفل كل صفحة.

      - **مصادر تمويل أخرى**: ساهمت [Google](https://www.google.com/) و[TokyoDev](https://www.tokyodev.com/) أيضًا في تمويل العمل على الاستطلاع.

      ### نظرة تقنية عامة

      يمكنك الاطلاع [هنا](https://dev.to/sachagreif/how-the-devographics-surveys-are-run-2023-edition-1p6a) على شرح تقني مفصل لكيفية إجراء الاستطلاعات.